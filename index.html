<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Editor</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      user-select: none; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    html, body { 
      width: 100%; 
      height: 100dvh; 
      overflow: hidden; 
      background: #0d0d0d; 
      color: #fff; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    
    #app { 
      display: flex; 
      flex-direction: column; 
      width: 100%; 
      height: 100dvh; 
      position: relative; 
      overflow: hidden; 
    }
    
    /* Top Navigation Bar */
    #top-bar { 
      height: 44px; 
      background: #181818; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding: 0 8px;
      border-bottom: 1px solid #282828; 
      flex-shrink: 0; 
      z-index: 1000;
    }
    .top-bar-left, .top-bar-right { display: flex; align-items: center; gap: 4px; }
    
    .icon-btn { 
      background: rgba(255,255,255,0.05); 
      border: 1px solid #333; 
      color: #ccc; 
      font-size: 11px; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      gap: 3px; 
      padding: 5px 8px; 
      border-radius: 6px; 
    }
    .icon-btn:active { background: #222; color: #007aff; }
    .icon-btn.delete-btn { background: rgba(255, 59, 48, 0.15); color: #ff3b30; border-color: rgba(255, 59, 48, 0.3); }
    .icon-btn.keyframe-btn { background: rgba(255, 204, 0, 0.15); color: #ffcc00; border-color: rgba(255, 204, 0, 0.3); }
    .icon-btn.rig-btn { background: rgba(52, 199, 89, 0.15); color: #34c759; border-color: rgba(52, 199, 89, 0.3); }

    /* 3D Viewport Area */
    #viewport { 
      flex: 1; 
      position: relative; 
      width: 100%; 
      background: #121212; 
      min-height: 0; 
    }
    #three-canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    
    #hierarchy { 
      position: absolute; top: 10px; left: 10px; width: 110px; max-height: 100px; 
      background: rgba(18, 18, 18, 0.85); border: 1px solid #333; border-radius: 6px; padding: 6px; 
      overflow-y: auto; z-index: 100; font-size: 10px; backdrop-filter: blur(4px);
    }
    .tree-item { padding: 4px 6px; border-radius: 4px; margin-bottom: 3px; background: rgba(255,255,255,0.05); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .tree-item.selected { background: #007aff; color: #fff; }

    /* Rigging Joint Overlay Layer */
    #rig-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      display: none;
      z-index: 500;
    }
    .joint-node {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(255, 149, 0, 0.4);
      border: 2px solid #ff9500;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      cursor: pointer;
    }
    .joint-node.center-node {
      background: rgba(0, 199, 190, 0.4);
      border-color: #00c7be;
    }
    #rig-bar-bottom {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 600;
    }
    .apply-btn {
      background: #2c2c2e;
      color: #fff;
      border: 1px solid #444;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    /* Timeline Panel */
    #timeline-panel { 
      height: 100px; 
      background: #141414; 
      border-top: 1px solid #282828; 
      display: flex; 
      flex-direction: column; 
      flex-shrink: 0; 
      z-index: 10;
    }
    #tl-header { 
      height: 26px; background: #1c1c1c; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-size: 10px; color: #aaa;
    }
    #tl-play-btn { background: transparent; border: none; color: #fff; font-size: 12px; cursor: pointer; }
    #tl-tracks-container { flex: 1; position: relative; overflow: hidden; background: #111; touch-action: none; }
    #tl-canvas { width: 100%; height: 100%; display: block; }

    /* Bottom Toolbar */
    #bottom-toolbar { 
      height: 54px; 
      background: #181818; 
      border-top: 1px solid #282828; 
      display: flex; 
      align-items: center; 
      justify-content: space-around;
      padding: 0 4px; 
      flex-shrink: 0; 
      z-index: 100;
    }
    .tool-item { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      gap: 2px; 
      color: #aaa; 
      font-size: 10px; 
      cursor: pointer; 
      flex: 1; 
      height: 100%; 
    }
    .tool-item span { font-size: 16px; }
    .tool-item:active { color: #007aff; }

    #toast { 
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%); 
      background: rgba(0,0,0,0.85); color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 11px; 
      display: none; z-index: 2000; pointer-events: none; border: 1px solid #444;
    }
    input[type="file"] { display: none !important; }
  </style>

  <!-- Three.js Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

<div id="app">
  <!-- Top Navigation Bar -->
  <div id="top-bar">
    <div class="top-bar-left">
      <!-- Home Button Restored -->
      <button class="icon-btn" id="btn-home">🏠 Home</button>
      <button class="icon-btn" id="btn-mode-trans">✢ Move</button>
      <button class="icon-btn" id="btn-mode-rot">🔄 Rotate</button>
      <button class="icon-btn" id="btn-mode-scale">📐 Scale</button>
    </div>
    <div class="top-bar-right">
      <!-- Bone Rig Button Added -->
      <button class="icon-btn rig-btn" id="btn-bone-rig">🦴 Bone Rig</button>
      <button class="icon-btn keyframe-btn" id="btn-add-keyframe">🔑 Keyframe</button>
      <button class="icon-btn delete-btn" id="btn-delete">🗑 Delete</button>
    </div>
  </div>

  <!-- 3D Viewport Area -->
  <div id="viewport">
    <canvas id="three-canvas"></canvas>
    <div id="hierarchy">
      <div style="font-weight: bold; margin-bottom: 4px; border-bottom: 1px solid #444; padding-bottom:2px;">Objects</div>
      <div id="tree-root"></div>
    </div>

    <!-- Prisma 3D Style Rigging Joint Overlay -->
    <div id="rig-overlay">
      <div class="joint-node center-node" style="top: 25%; left: 50%;"></div> <!-- Neck/Head -->
      <div class="joint-node" style="top: 35%; left: 42%;"></div> <!-- L-Shoulder -->
      <div class="joint-node" style="top: 35%; left: 58%;"></div> <!-- R-Shoulder -->
      <div class="joint-node" style="top: 48%; left: 38%;"></div> <!-- L-Elbow -->
      <div class="joint-node" style="top: 48%; left: 62%;"></div> <!-- R-Elbow -->
      <div class="joint-node" style="top: 52%; left: 50%;"></div> <!-- Hip -->
      <div class="joint-node" style="top: 68%; left: 45%;"></div> <!-- L-Knee -->
      <div class="joint-node" style="top: 68%; left: 55%;"></div> <!-- R-Knee -->
      
      <div id="rig-bar-bottom">
        <button class="apply-btn" id="btn-apply-rig">✓ Apply Rig</button>
      </div>
    </div>

    <div id="toast">Engine Ready</div>
  </div>

  <!-- Video Timeline Panel -->
  <div id="timeline-panel">
    <div id="tl-header">
      <button id="tl-play-btn">▶</button>
      <span id="time-val" style="font-family: monospace;">00:00.00 of 05:00</span>
      <span style="font-size: 10px; color: #666;">FPS: 30</span>
    </div>
    <div id="tl-tracks-container">
      <canvas id="tl-canvas"></canvas>
    </div>
  </div>

  <!-- Bottom Toolbar -->
  <div id="bottom-toolbar">
    <div class="tool-item" id="btn-add-model">
      <span>📦</span>Models
    </div>
    <div class="tool-item" id="btn-sky">
      <span>🌐</span>Sky
    </div>
    <div class="tool-item" id="btn-add-camera">
      <span>🎥</span>Camera
    </div>
    <div class="tool-item" id="btn-light">
      <span>💡</span>Light
    </div>
    <div class="tool-item" id="btn-upload-photo">
      <span>🖼️</span>Media
    </div>
    <div class="tool-item" id="btn-add-cube">
      <span>🧊</span>Cube
    </div>
  </div>
</div>

<!-- Hidden File Upload Handlers -->
<input type="file" id="file-model" accept=".glb,.gltf">
<input type="file" id="file-photo" accept="image/*">

<script>
  // Global Variables
  let scene, camera, renderer, orbit, transform;
  let objects = [], selectedObj = null;
  let keyframes = []; 
  let raycaster = new THREE.Raycaster();
  let mouse = new THREE.Vector2();
  let isPlaying = false, currentTime = 0, duration = 5.0;
  let isRigMode = false;

  const toast = document.getElementById('toast');
  const treeRoot = document.getElementById('tree-root');
  const tlWrap = document.getElementById('tl-tracks-container');
  const tlCanvas = document.getElementById('tl-canvas');
  const tlCtx = tlCanvas.getContext('2d');
  const rigOverlay = document.getElementById('rig-overlay');

  function showMsg(m) {
    toast.innerText = m;
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 2000);
  }

  function initApp() {
    const viewport = document.getElementById('viewport');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x121212);

    camera = new THREE.PerspectiveCamera(60, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
    resetCamera();

    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three-canvas'), antialias: true });
    renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    orbit = new THREE.OrbitControls(camera, renderer.domElement);
    orbit.enableDamping = true;
    orbit.target.set(0, 0.5, 0);

    transform = new THREE.TransformControls(camera, renderer.domElement);
    transform.size = 0.8;
    transform.addEventListener('dragging-changed', (e) => { orbit.enabled = !e.value; });
    scene.add(transform);

    const light1 = new THREE.DirectionalLight(0xffffff, 1.2);
    light1.position.set(5, 10, 7);
    scene.add(light1);
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));

    const grid = new THREE.GridHelper(20, 20, 0x555555, 0x222222);
    grid.position.y = 0;
    scene.add(grid);

    setupEvents();
    drawTimeline();
    animate();
  }

  function resetCamera() {
    camera.position.set(0, 2, 4);
    if (orbit) {
      orbit.target.set(0, 0.5, 0);
      orbit.update();
    }
  }

  function toggleRigMode() {
    if (!selectedObj) {
      showMsg('Select a model first to Rig');
      return;
    }
    isRigMode = !isRigMode;
    rigOverlay.style.display = isRigMode ? 'block' : 'none';
    showMsg(isRigMode ? 'IK Rigging Mode Active' : 'Rig Mode Closed');
  }

  function selectObject(obj) {
    selectedObj = obj;
    if (obj) {
      transform.attach(obj);
    } else {
      transform.detach();
    }
    updateTree();
  }

  function addObject(obj, name) {
    obj.name = name || 'Object_' + (objects.length + 1);
    scene.add(obj);
    objects.push(obj);
    selectObject(obj);
  }

  function deleteSelectedObject() {
    if (!selectedObj) {
      showMsg('Pehle koi object select karein');
      return;
    }
    
    const objName = selectedObj.name;
    transform.detach();
    scene.remove(selectedObj);
    
    selectedObj.traverse((child) => {
      if (child.geometry) child.geometry.dispose();
      if (child.material) {
        if (Array.isArray(child.material)) {
          child.material.forEach(m => m.dispose());
        } else {
          child.material.dispose();
        }
      }
    });

    keyframes = keyframes.filter(kf => kf.obj !== selectedObj);
    objects = objects.filter(o => o !== selectedObj);
    selectedObj = null;
    updateTree();
    drawTimeline();
    showMsg(objName + ' Delete ho gaya!');
  }

  function addKeyframe() {
    if (!selectedObj) {
      showMsg('Select object first!');
      return;
    }

    const time = parseFloat(currentTime.toFixed(2));
    let existingKF = keyframes.find(kf => kf.obj === selectedObj && Math.abs(kf.time - time) < 0.05);

    const kfData = {
      obj: selectedObj,
      time: time,
      position: selectedObj.position.clone(),
      rotation: selectedObj.rotation.clone(),
      scale: selectedObj.scale.clone()
    };

    if (existingKF) {
      Object.assign(existingKF, kfData);
      showMsg('Keyframe Updated at ' + time + 's');
    } else {
      keyframes.push(kfData);
      showMsg('Keyframe Added at ' + time + 's');
    }

    drawTimeline();
  }

  function setupEvents() {
    const canvas = document.getElementById('three-canvas');

    canvas.addEventListener('pointerdown', (e) => {
      if (transform.dragging || isRigMode) return;
      const rect = canvas.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / canvas.clientWidth) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / canvas.clientHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(objects, true);

      if (intersects.length > 0) {
        let topObj = intersects[0].object;
        while (topObj.parent && topObj.parent !== scene) topObj = topObj.parent;
        selectObject(topObj);
      }
    });

    // Centralized Event Delegation System
    document.addEventListener('click', (e) => {
      const target = e.target.closest('[id]');
      if (!target) return;

      switch (target.id) {
        case 'btn-home':
          resetCamera();
          showMsg('Camera Reset');
          break;

        case 'btn-mode-trans':
          transform.setMode('translate');
          showMsg('Move Mode');
          break;

        case 'btn-mode-rot':
          transform.setMode('rotate');
          showMsg('Rotate Mode');
          break;

        case 'btn-mode-scale':
          transform.setMode('scale');
          showMsg('Scale Mode');
          break;

        case 'btn-bone-rig':
          toggleRigMode();
          break;

        case 'btn-apply-rig':
          isRigMode = false;
          rigOverlay.style.display = 'none';
          
          // Generate Skeleton Helper on selected model
          if (selectedObj) {
            const helper = new THREE.SkeletonHelper(selectedObj);
            scene.add(helper);
          }
          showMsg('IK Rig Applied Successfully!');
          break;

        case 'btn-add-keyframe':
          addKeyframe();
          break;

        case 'btn-delete':
          deleteSelectedObject();
          break;

        case 'btn-add-model':
          document.getElementById('file-model').click();
          break;

        case 'btn-upload-photo':
          document.getElementById('file-photo').click();
          break;

        case 'btn-add-cube':
          const cube = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshStandardMaterial({ color: 0x007aff }));
          cube.position.set(0, 0.4, 0);
          addObject(cube, 'Cube');
          break;

        case 'tl-play-btn':
          isPlaying = !isPlaying;
          document.getElementById('tl-play-btn').innerText = isPlaying ? '⏸' : '▶';
          break;
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Delete' || e.key === 'Backspace') {
        deleteSelectedObject();
      }
    });

    document.getElementById('file-model').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      showMsg('Model Loading...');
      const loader = new THREE.GLTFLoader();
      loader.load(URL.createObjectURL(file), (gltf) => {
        addObject(gltf.scene, file.name);
        showMsg('Model Added!');
      }, undefined, () => {
        showMsg('Error loading model');
      });
    };

    document.getElementById('file-photo').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      new THREE.TextureLoader().load(URL.createObjectURL(file), (tex) => {
        if (selectedObj) {
          selectedObj.traverse(child => { if(child.isMesh) child.material.map = tex; });
          showMsg('Texture Applied!');
        } else {
          const plane = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 1.5), new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide }));
          plane.position.set(0, 1, 0);
          addObject(plane, 'Media Plane');
        }
      });
    };

    const scrubTimeline = (e) => {
      const rect = tlWrap.getBoundingClientRect();
      const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
      let ratio = Math.max(0, Math.min(1, x / rect.width));
      currentTime = ratio * duration;
      applyKeyframesAtTime(currentTime);
      drawTimeline();
    };

    tlWrap.addEventListener('pointerdown', scrubTimeline);
    tlWrap.addEventListener('pointermove', (e) => { if(e.buttons > 0) scrubTimeline(e); });

    window.addEventListener('resize', () => {
      const vp = document.getElementById('viewport');
      camera.aspect = vp.clientWidth / vp.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(vp.clientWidth, vp.clientHeight);
      drawTimeline();
    });
  }

  function applyKeyframesAtTime(time) {
    objects.forEach(obj => {
      const objKFs = keyframes.filter(kf => kf.obj === obj).sort((a,b) => a.time - b.time);
      if (objKFs.length === 0) return;

      if (time <= objKFs[0].time) {
        obj.position.copy(objKFs[0].position);
        obj.rotation.copy(objKFs[0].rotation);
        obj.scale.copy(objKFs[0].scale);
      } else if (time >= objKFs[objKFs.length - 1].time) {
        let last = objKFs[objKFs.length - 1];
        obj.position.copy(last.position);
        obj.rotation.copy(last.rotation);
        obj.scale.copy(last.scale);
      } else {
        for (let i = 0; i < objKFs.length - 1; i++) {
          let kf1 = objKFs[i];
          let kf2 = objKFs[i+1];
          if (time >= kf1.time && time <= kf2.time) {
            let alpha = (time - kf1.time) / (kf2.time - kf1.time);
            obj.position.lerpVectors(kf1.position, kf2.position, alpha);
            obj.scale.lerpVectors(kf1.scale, kf2.scale, alpha);
            obj.rotation.x = THREE.MathUtils.lerp(kf1.rotation.x, kf2.rotation.x, alpha);
            obj.rotation.y = THREE.MathUtils.lerp(kf1.rotation.y, kf2.rotation.y, alpha);
            obj.rotation.z = THREE.MathUtils.lerp(kf1.rotation.z, kf2.rotation.z, alpha);
            break;
          }
        }
      }
    });
  }

  function updateTree() {
    treeRoot.innerHTML = '';
    if (objects.length === 0) {
      treeRoot.innerHTML = '<div style="color:#666;">No Objects</div>';
      return;
    }
    objects.forEach(obj => {
      const item = document.createElement('div');
      item.className = 'tree-item' + (selectedObj === obj ? ' selected' : '');
      item.innerText = '📦 ' + (obj.name.length > 8 ? obj.name.substring(0,7)+'..' : obj.name);
      item.onclick = (e) => { e.stopPropagation(); selectObject(obj); };
      treeRoot.appendChild(item);
    });
  }

  function drawTimeline() {
    const w = tlCanvas.width = tlWrap.clientWidth;
    const h = tlCanvas.height = tlWrap.clientHeight;
    
    tlCtx.fillStyle = '#111';
    tlCtx.fillRect(0, 0, w, h);
    
    tlCtx.fillStyle = '#666';
    tlCtx.font = '9px sans-serif';
    tlCtx.strokeStyle = '#222';
    tlCtx.lineW
