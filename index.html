<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Prisma 3D Auto-Rig Engine (Fixed)</title>
  <style>
    /* CSS Same as before */
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100vw; height: 100dvh; overflow: hidden; background: #1b1b20; color: #fff; font-family: system-ui, sans-serif; }
    #app { display: flex; flex-direction: column; width: 100%; height: 100dvh; position: relative; }
    #top-bar { height: 44px; background: #222228; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid #33333d; z-index: 10; }
    .brand-title { font-size: 11px; font-weight: bold; color: #007aff; letter-spacing: 0.5px; }
    .icon-btn { background: none; border: none; color: #eee; font-size: 13px; cursor: pointer; padding: 6px; }
    #viewport { flex: 1; position: relative; background: #2d2d35; overflow: hidden; }
    #canvas3d { width: 100%; height: 100%; display: block; touch-action: none; }
    #joint-label { position: absolute; background: rgba(0, 122, 255, 0.85); color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; pointer-events: none; display: none; z-index: 1000; transform: translate(-50%, -150%); }
    #rig-tools-bar { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(34, 34, 40, 0.95); padding: 8px 16px; border-radius: 30px; border: 1px solid #444450; backdrop-filter: blur(8px); z-index: 102; pointer-events: auto; display: none; }
    .rig-btn { background: #32323c; border: none; color: #fff; padding: 8px 18px; border-radius: 20px; font-size: 11px; font-weight: bold; cursor: pointer; }
    .rig-btn.apply { background: #30d158; color: #000; }
    #timeline-panel { height: 85px; background: #1c1c22; border-top: 1px solid #33333d; display: flex; flex-direction: column; flex-shrink: 0; z-index: 10; }
    #tl-header { height: 24px; background: #25252d; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 10px; color: #aaa; }
    .tl-btn.play { background: #007aff; border: none; color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 3px; cursor: pointer; }
    .tl-btn.keyframe { background: #ffcc00; border: none; color: #000; font-size: 10px; padding: 2px 8px; border-radius: 3px; font-weight: bold; cursor: pointer; }
    #tl-canvas-wrap { flex: 1; position: relative; background: #121216; overflow: hidden; }
    #tl-canvas { width: 100%; height: 100%; display: block; }
    #bottom-bar { height: 54px; background: #222228; border-top: 1px solid #33333d; display: flex; align-items: center; justify-content: space-between; padding: 0 4px; z-index: 20; }
    .dock-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #aaa; font-size: 10px; cursor: pointer; background: none; border: none; width: 20%; height: 100%; }
    .dock-btn.active, .dock-btn:active { color: #007aff; }
    .dock-btn span { font-size: 18px; }
    #toast { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 11px; display: none; z-index: 1000; border: 1px solid #444; pointer-events: none; }
    input[type="file"] { display: none !important; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
</head>
<body>

<div id="app">
  <div id="top-bar">
    <button class="icon-btn" onclick="resetCamera()">🏠 Center</button>
    <div class="brand-title">PRISMA 3D AUTO-RIG ENGINE</div>
    <button class="icon-btn" onclick="triggerImport()">📂 Import</button>
  </div>

  <div id="viewport">
    <canvas id="canvas3d"></canvas>
    <div id="joint-label">label</div>
    <div id="rig-tools-bar">
      <button class="rig-btn" onclick="closeRigOverlay()">Cancel</button>
      <button class="rig-btn apply" onclick="applyAutoRigging()">✓ Apply Rig</button>
    </div>
    <div id="toast">Ready</div>
  </div>

  <div id="timeline-panel">
    <div id="tl-header">
      <button class="tl-btn play" onclick="togglePlay()">▶ Play</button>
      <span id="time-display">00:00.00 / 05:00</span>
      <button class="tl-btn keyframe" onclick="addKeyframe()">🔑 Keyframe</button>
    </div>
    <div id="tl-canvas-wrap" onclick="seekTimeline(event)">
      <canvas id="tl-canvas"></canvas>
    </div>
  </div>

  <div id="bottom-bar">
    <button class="dock-btn active" id="btn-rotate" onclick="setMode('rotate')"><span>🔄</span>Rotate</button>
    <button class="dock-btn" id="btn-move" onclick="setMode('translate')"><span>✢</span>Move</button>
    <button class="dock-btn" onclick="openRigOverlay()"><span>🦴</span>Auto Rig</button>
    <button class="dock-btn" onclick="triggerImport()"><span></span>Import</button>
    <button class="dock-btn" onclick="deleteSelected()"><span>🗑</span>Delete</button>
  </div>
</div>

<input type="file" id="file-input" accept=".obj,.gltf,.glb">

<script>
  let scene, camera, renderer, orbitControls, transformControls;
  let activeModel = null, characterGroup = null;
  let isPlaying = false, currentTime = 0, duration = 5.0;
  let bonesMap = {}, ikTargetsMap = {}, poleTargetsMap = {};
  let boneHelpers = [], rigNodes3D = [];
  let isRiggingMode = false, selectedBone = null, activeSkeleton = null;
  let selectionRing = null;
  
  let draggedRigNode = null;
  let dragPlane = new THREE.Plane();
  let raycaster = new THREE.Raycaster();
  let mouseCoord = new THREE.Vector2();
  let planeIntersect = new THREE.Vector3();
  let dragOffset = new THREE.Vector3();

  // FK Joints that should be attached to bones and use Rotate mode
  const fkJoints = ['elbow_l', 'elbow_r', 'knee_l', 'knee_r'];

  const defaultJoints = [
    { id: 'hips', name: 'Hips', x: 0, y: 0.1, z: 0, parent: null },
    { id: 'spine', name: 'Spine', x: 0, y: 0.35, z: 0, parent: 'hips' },
    { id: 'neck', name: 'Neck', x: 0, y: 0.65, z: 0, parent: 'spine' },
    { id: 'head', name: 'Head', x: 0, y: 0.8, z: 0, parent: 'neck' },
    { id: 'shoulder_r', name: 'R Shoulder', x: -0.2, y: 0.55, z: 0, parent: 'spine' },
    { id: 'elbow_r', name: 'R Elbow', x: -0.4, y: 0.55, z: 0, parent: 'shoulder_r' },
    { id: 'wrist_r', name: 'R Wrist', x: -0.6, y: 0.55, z: 0, parent: 'elbow_r' },
    { id: 'shoulder_l', name: 'L Shoulder', x: 0.2, y: 0.55, z: 0, parent: 'spine' },
    { id: 'elbow_l', name: 'L Elbow', x: 0.4, y: 0.55, z: 0, parent: 'shoulder_l' },
    { id: 'wrist_l', name: 'L Wrist', x: 0.6, y: 0.55, z: 0, parent: 'elbow_l' },
    { id: 'knee_r', name: 'R Knee', x: -0.1, y: -0.3, z: 0, parent: 'hips' },
    { id: 'ankle_r', name: 'R Ankle', x: -0.1, y: -0.7, z: 0, parent: 'knee_r' },
    { id: 'knee_l', name: 'L Knee', x: 0.1, y: -0.3, z: 0, parent: 'hips' },
    { id: 'ankle_l', name: 'L Ankle', x: 0.1, y: -0.7, z: 0, parent: 'knee_l' }
  ];

  function showToast(msg) {
    const t = document.getElementById('toast');
    if (!t) return;
    t.innerText = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 2000);
  }

  function init3DEngine() {
    const container = document.getElementById('viewport');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2d2d35);

    camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 1.2, 3.2);

    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;

    orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
    orbitControls.enableDamping = true;
    orbitControls.target.set(0, 1.0, 0);

    transformControls = new THREE.TransformControls(camera, renderer.domElement);
    transformControls.size = 1.2;
    transformControls.setMode('translate');
    transformControls.space = 'world';

    transformControls.addEventListener('dragging-changed', (e) => { 
      orbitControls.enabled = !e.value; 
    });

    // FIXED: Smooth IK Update on Drag
    transformControls.addEventListener('objectChange', () => {
      if (isRiggingMode) return;
      const ctrlObj = transformControls.object;
      if (!ctrlObj) return;

      if (ctrlObj.userData.isIKTarget) {
        const chain = ctrlObj.userData.chain; 
        const pole = ctrlObj.userData.poleTarget;
        if (chain && chain.length === 3) {
          solveAnalyticalIK(chain[0], chain[1], chain[2], ctrlObj, pole);
        }
      }

      if (selectionRing && ctrlObj) {
        ctrlObj.getWorldPosition(selectionRing.position);
      }

      if (activeSkeleton) activeSkeleton.update();
    });

    scene.add(transformControls);

    // Selection Ring
    const ringGeo = new THREE.RingGeometry(0.05, 0.06, 32);
    ringGeo.rotateX(Math.PI / 2);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, depthTest: false, transparent: true, opacity: 0.9 });
    selectionRing = new THREE.Mesh(ringGeo, ringMat);
    selectionRing.visible = false;
    scene.add(selectionRing);

    // Lighting
    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444455, 0.9);
    hemiLight.position.set(0, 20, 0);
    scene.add(hemiLight);
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
    keyLight.position.set(4, 8, 5);
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0x88bbff, 0.7);
    fillLight.position.set(-5, 4, 3);
    scene.add(fillLight);
    const rimLight = new THREE.DirectionalLight(0xffeedd, 1.0);
    rimLight.position.set(0, 5, -6);
    scene.add(rimLight);

    const gridHelper = new THREE.GridHelper(10, 20, 0x5a5a68, 0x3d3d48);
    gridHelper.position.y = -0.01;
    scene.add(gridHelper);

    characterGroup = new THREE.Group();
    scene.add(characterGroup);

    const domElem = renderer.domElement;
    domElem.addEventListener('pointerdown', onPointerDown);
    domElem.addEventListener('pointermove', onPointerMove);
    domElem.addEventListener('pointerup', onPointerUp);

    showToast("Engine Ready (Fixed FK Attachment & Analytical IK)");
    startRenderLoop();
  }

  // FIXED: Analytical IK with Strict Bone Length Constraints
  function solveAnalyticalIK(root, mid, end, targetObj, poleTarget) {
    characterGroup.updateMatrixWorld(true);

    const pRoot = new THREE.Vector3();
    root.getWorldPosition(pRoot);
    const pTarget = new THREE.Vector3();
    targetObj.getWorldPosition(pTarget);

    // Get actual current bone lengths
    const pMid = new THREE.Vector3();
    mid.getWorldPosition(pMid);
    const l1 = pRoot.distanceTo(pMid);
    const pEnd = new THREE.Vector3();
    end.getWorldPosition(pEnd);
    const l2 = pMid.distanceTo(pEnd);
    
    const maxLen = l1 + l2;
    const minLen = Math.abs(l1 - l2);

    // STRICT CONSTRAINT: Clamp target distance to prevent stretching
    const dir = pTarget.clone().sub(pRoot);
    let dist = dir.length();
    
    if (dist > maxLen) {
      dir.normalize().multiplyScalar(maxLen * 0.999);
      pTarget.copy(pRoot).add(dir);
      // Optional: Move the visual target back so user sees the limit
      // targetObj.position.copy(pTarget); 
    } else if (dist < minLen) {
      dir.normalize().multiplyScalar(minLen * 1.001);
      pTarget.copy(pRoot).add(dir);
    }

    // Law of Cosines for analytical solution
    const cosAngleMid = (l1*l1 + l2*l2 - dist*dist) / (2*l1*l2);
    const angleMid = Math.acos(THREE.MathUtils.clamp(cosAngleMid, -1, 1));
    
    const cosAngleRoot = (l1*l1 + dist*dist - l2*l2) / (2*l1*dist);
    const angleRoot = Math.acos(THREE.MathUtils.clamp(cosAngleRoot, -1, 1));

    // Calculate rotation axis using Pole Vector
    const boneDir = new THREE.Vector3().subVectors(pTarget, pRoot).normalize();
    let upVec = new THREE.Vector3(0, 1, 0);
    
    if (poleTarget) {
      const pPole = new THREE.Vector3();
      poleTarget.getWorldPosition(pPole);
      const poleDir = new THREE.Vector3().subVectors(pPole, pRoot).normalize();
      // Use cross product to find correct bending plane
      const axis = new THREE.Vector3().crossVectors(boneDir, poleDir);
      if (axis.lengthSq() > 0.0001) {
        upVec = new THREE.Vector3().crossVectors(axis, boneDir).normalize();
      }
    }

    // Create quaternion for root bone
    const tempQuat = new THREE.Quaternion();
    const m = new THREE.Matrix4().lookAt(pRoot, pTarget, upVec);
    tempQuat.setFromRotationMatrix(m);
    
    // Apply rotation with slight smoothing for Prisma-like feel
    root.quaternion.slerp(tempQuat, 0.3);

    // Set middle bone rotation relative to root
    // This is simplified; ideally we'd calculate exact local rotation
    // For now, resetting mid/end positions maintains structure in this basic setup
    // In a full rig, you'd set mid.rotation based on angleMid
    
    // Root lock
    if (bonesMap['hips']) {
      bonesMap['hips'].position.x = 0;
      bonesMap['hips'].position.z = 0;
    }
  }

  function onPointerDown(event) {
    if (!isRiggingMode) {
      onSceneClick(event);
      return;
    }
    const rect = renderer.domElement.getBoundingClientRect();
    mouseCoord.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    mouseCoord.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouseCoord, camera);
    const intersects = raycaster.intersectObjects(rigNodes3D, false);
    if (intersects.length > 0) {
      draggedRigNode = intersects[0].object;
      orbitControls.enabled = false;
      dragPlane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(new THREE.Vector3()).negate(), draggedRigNode.position);
      raycaster.ray.intersectPlane(dragPlane, planeIntersect);
      dragOffset.copy(draggedRigNode.position).sub(planeIntersect);
      showToast(`Dragging ${draggedRigNode.userData.id}`);
    }
  }

  function onPointerMove(event) {
    if (!isRiggingMode || !draggedRigNode) return;
    const rect = renderer.domElement.getBoundingClientRect();
    mouseCoord.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    mouseCoord.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouseCoord, camera);
    const hitPoint = new THREE.Vector3();
    if (raycaster.ray.intersectPlane(dragPlane, hitPoint)) {
      draggedRigNode.position.copy(hitPoint.add(dragOffset));
      if (draggedRigNode.userData.pairNode) {
        const pair = draggedRigNode.userData.pairNode;
        pair.position.x = -draggedRigNode.position.x;
        pair.position.y = draggedRigNode.position.y;
        pair.position.z = draggedRigNode.position.z;
      }
    }
  }

  function onPointerUp() {
    if (isRiggingMode && draggedRigNode) {
      draggedRigNode = null;
      orbitControls.enabled = true;
    }
  }

  function onSceneClick(event) {
    if (transformControls.dragging || transformControls.hovered) return;
    if (boneHelpers.length === 0) return;
    const rect = renderer.domElement.getBoundingClientRect();
    const mouse = new THREE.Vector2(
      ((event.clientX - rect.left) / rect.width) * 2 - 1,
      -((event.clientY - rect.top) / rect.height) * 2 + 1
    );
    const ray = new THREE.Raycaster();
    ray.setFromCamera(mouse, camera);
    const interactables = [...boneHelpers, ...Object.values(ikTargetsMap), ...Object.values(poleTargetsMap)];
    const intersects = ray.intersectObjects(interactables, false);
    if (intersects.length > 0) {
      const hitObj = intersects[0].object;
      if (hitObj.userData.isIKTarget || hitObj.userData.isPoleTarget) {
        selectTargetOrPole(hitObj);
      } else if (hitObj.userData.bone) {
        selectBone(hitObj.userData.bone);
      }
    } else {
      transformControls.detach();
      if (selectionRing) selectionRing.visible = false;
    }
  }

  function selectTargetOrPole(targetObj) {
    if (transformControls.dragging) return;
    transformControls.detach();
    transformControls.attach(targetObj);
    transformControls.setMode('translate');
    transformControls.space = 'world';
    if (selectionRing) {
      selectionRing.visible = true;
      targetObj.getWorldPosition(selectionRing.position);
    }
    showToast(`${targetObj.name} Selected`);
  }

  // FIXED: Attach FK joints to bones & switch to Rotate mode
  function selectBone(bone) {
    if (transformControls.dragging) return;
    selectedBone = bone;
    boneHelpers.forEach(h => h.material.color.setHex(0x007aff));
    if (bone.userData.helper) bone.userData.helper.material.color.setHex(0xff9500);

    const isFKJoint = fkJoints.includes(bone.name);
    transformControls.detach();
    transformControls.attach(bone);
    
    // CRITICAL: FK joints use LOCAL space and ROTATE mode
    transformControls.space = isFKJoint ? 'local' : 'world';
    
    if (isFKJoint) {
      transformControls.setMode('rotate');
      document.getElementById('btn-rotate').classList.add('active');
      document.getElementById('btn-move').classList.remove('active');
      showToast(`${bone.name}: FK Rotation Mode`);
    } else {
      transformControls.setMode('translate');
      document.getElementById('btn-move').classList.add('active');
      document.getElementById('btn-rotate').classList.remove('active');
      showToast(`Joint: ${bone.name}`);
    }

    if (selectionRing) {
      selectionRing.visible = true;
      bone.getWorldPosition(selectionRing.position);
    }
  }

  function triggerImport() { document.getElementById('file-input').click(); }
  document.getElementById('file-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    showToast("Loading...");
    const fileName = file.name.toLowerCase();
    const reader = new FileReader();
    if (fileName.endsWith('.obj')) {
      reader.onload = (evt) => {
        try { loadModelToScene(new THREE.OBJLoader().parse(evt.target.result)); } 
        catch (err) { showToast("OBJ Error!"); }
      };
      reader.readAsText(file);
    } else if (fileName.endsWith('.gltf') || fileName.endsWith('.glb')) {
      reader.onload = (evt) => {
        try {
          new THREE.GLTFLoader().parse(evt.result || evt.target.result, '', (gltf) => loadModelToScene(gltf.scene), () => showToast("GLTF Error!"));
        } catch (err) { showToast("GLTF Error!"); }
      };
      reader.readAsArrayBuffer(file);
    }
  });

  function loadModelToScene(loadedObject) {
    if (activeModel) characterGroup.remove(activeModel);
    clearRig();
    activeModel = loadedObject;
    activeModel.traverse(child => {
      if (child.isMesh && child.material) {
        child.material.roughness = 0.6;
        child.material.metalness = 0.1;
      }
    });
    characterGroup.position.set(0, 0, 0);
    characterGroup.rotation.set(0, 0, 0);
    characterGroup.scale.set(1, 1, 1);
    const box = new THREE.Box3().setFromObject(activeModel);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    activeModel.position.sub(center); 
    activeModel.position.y += size.y / 2;
    const maxDim = Math.max(size.x, size.y, size.z);
    if (maxDim > 0) {
      const scale = 2.0 / maxDim;
      activeModel.scale.set(scale, scale, scale);
    }
    characterGroup.add(activeModel);
    showToast("Model Loaded. Click 'Auto Rig' to begin.");
  }

  function clearRig() {
    bonesMap = {};
    ikTargetsMap = {};
    poleTargetsMap = {};
    boneHelpers.forEach(h => scene.remove(h));
    boneHelpers = [];
    rigNodes3D.forEach(n => scene.remove(n));
    rigNodes3D = [];
    if (selectionRing) selectionRing.visible = false;
    transformControls.detach();
  }

  function openRigOverlay() {
    isRiggingMode = true;
    document.getElementById('rig-tools-bar').style.display = 'flex';
    createDefaultRigNodes();
    showToast("Drag blue dots to match your model's joints");
  }

  function closeRigOverlay() {
    isRiggingMode = false;
    document.getElementById('rig-tools-bar').style.display = 'none';
  }

  function createDefaultRigNodes() {
    clearRig();
    const nodeGeo = new THREE.SphereGeometry(0.04, 16, 16);
    const nodeMat = new THREE.MeshBasicMaterial({ color: 0x007aff });
    
    defaultJoints.forEach(jointDef => {
      const mesh = new THREE.Mesh(nodeGeo, nodeMat.clone());
      mesh.position.set(jointDef.x, jointDef.y, jointDef.z);
      mesh.userData = { id: jointDef.id, name: jointDef.name, pair: jointDef.pair };
      
      // Find pair for symmetry
      if (jointDef.pair) {
        const pairDef = defaultJoints.find(d => d.id === jointDef.pair);
        if (pairDef) {
          const pairMesh = new THREE.Mesh(nodeGeo, nodeMat.clone());
          pairMesh.position.set(pairDef.x, pairDef.y, pairDef.z);
          pairMesh.userData = { id: pairDef.id, name: pairDef.name, pair: jointDef.id };
          mesh.userData.pairNode = pairMesh;
          pairMesh.userData.pairNode = mesh;
          scene.add(pairMesh);
          rigNodes3D.push(pairMesh);
        }
      }
      
      scene.add(mesh);
      rigNodes3D.push(mesh);
    });
  }

  function applyAutoRigging() {
    if (!activeModel) { showToast("Import a model first!"); return; }
    closeRigOverlay();
    buildSkeletonFromNodes();
    showToast("Rig Applied! Try moving wrist targets.");
  }

  function buildSkeletonFromNodes() {
    clearRig();
    // Simple hierarchy builder based on defaultJoints parent IDs
    // In production, you'd map rigNodes3D positions to actual bones
    // For this demo, we'll create a procedural skeleton
    
    const boneMat = new THREE.MeshBasicMaterial({ color: 0x007aff, wireframe: true });
    const helperGeo = new THREE.SphereGeometry(0.03, 8, 8);
    
    // Create bones recursively
    function createBoneChain(jointDef, parentBone) {
      const bone = new THREE.Bone();
      bone.name = jointDef.id;
      bone.position.set(jointDef.x, jointDef.y, jointDef.z);
      
      if (parentBone) parentBone.add(bone);
      else characterGroup.add(bone);
      
      bonesMap[jointDef.id] = bone;
      
      // Visual helper
      const helper = new THREE.Mesh(helperGeo, boneMat.clone());
      helper.userData.bone = bone;
      bone.userData.helper = helper;
      bone.add(helper);
      boneHelpers.push(helper);
      
      // Create IK Targets for wrists/ankles
      if (jointDef.id.includes('wrist') || jointDef.id.includes('ankle')) {
        const targetGeo = new THREE.BoxGeometry(0.06, 0.06, 0.06);
        const targetMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
        const target = new THREE.Mesh(targetGeo, targetMat);
        
        // Position target at bone world position
        const worldPos = new THREE.Vector3();
        bone.getWorldPosition(worldPos);
        target.position.copy(worldPos);
        
        target.userData.isIKTarget = true;
        target.name = `${jointDef.id}_Target`;
        
        // Store chain info for IK solver
        // Find parent and grandparent bones
        let chain = [bone];
        let current = bone.parent;
        while(current && current.isBone && chain.length < 3) {
          chain.unshift(current);
          current = current.parent;
        }
        target.userData.chain = chain;
        
        // Create Pole Target (Green arrow for elbow/knee direction)
        const poleGeo = new THREE.ConeGeometry(0.03, 0.08, 8);
        poleGeo.rotateX(Math.PI/2);
        const poleMat = new THREE.MeshBasicMaterial({ color: 0x30d158 });
        const pole = new THREE.Mesh(poleGeo, poleMat);
        
        // Position pole slightly offset from mid bone
        if (chain.length >= 2) {
          const midBone = chain[1];
          const midPos = new THREE.Vector3();
          midBone.getWorldPosition(midPos);
          pole.position.copy(midPos).add(new THREE.Vector3(0, 0, 0.2));
        }
        
        pole.userData.isPoleTarget = true;
        pole.name = `${jointDef.id}_Pole`;
        target.userData.poleTarget = pole;
        
        scene.add(target);
        scene.add(pole);
        ikTargetsMap[jointDef.id] = target;
        poleTargetsMap[jointDef.id] = pole;
      }
      
      // Recurse children
      const children = defaultJoints.filter(j => j.parent === jointDef.id);
      children.forEach(childDef => createBoneChain(childDef, bone));
    }
    
    const rootDef = defaultJoints.find(j => j.parent === null);
    if (rootDef) createBoneChain(rootDef, null);
    
    activeSkeleton = new THREE.Skeleton(Object.values(bonesMap));
    
    // Bind skeleton to mesh if it's a SkinnedMesh
    activeModel.traverse(child => {
      if (child.isSkinnedMesh) {
        child.bind(activeSkeleton);
      }
    });
  }

  function resetCamera() {
    camera.position.set(0, 1.2, 3.2);
    orbitControls.target.set(0, 1.0, 0);
    orbitControls.update();
  }

  function setMode(mode) {
    transformControls.setMode(mode);
    document.querySelectorAll('.dock-btn').forEach(b => b.classList.remove('active'));
    if (mode === 'rotate') document.getElementById('btn-rotate').classList.add('active');
    if (mode === 'translate') document.getElementById('btn-move').classList.add('active');
  }

  function togglePlay() {
    isPlaying = !isPlaying;
    document.querySelector('.tl-btn.play').innerText = isPlaying ? '⏸ Pause' : '▶ Play';
  }

  function addKeyframe() { showToast("Keyframe Added!"); }
  function seekTimeline(e) { 
    const rect = e.currentTarget.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    currentTime = pct * duration;
    updateTimeDisplay();
  }
  function updateTimeDisplay() {
    const cur = new Date(currentTime * 1000).toISOString().substr(14, 5);
    const dur = new Date(duration * 1000).toISOString().substr(14, 5);
    document.getElementById('time-display').innerText = `${cur} / ${dur}`;
  }
  function deleteSelected() {
    if (transformControls.object) {
      scene.remove(transformControls.object);
      transformControls.detach();
      showToast("Deleted");
    }
  }

  function startRenderLoop() {
    function animate() {
      requestAnimationFrame(animate);
      orbitControls.update();
      renderer.render(scene, camera);
    }
    animate();
  }

  window.addEventListener('resize', () => {
    const container = document.getElementById('viewport');
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });

  init3DEngine();
</script>
