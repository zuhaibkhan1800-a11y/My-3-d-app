<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Prisma 3D Editor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body { width: 100vw; height: 100dvh; overflow: hidden; background: #0f0f11; color: #fff; font-family: sans-serif; }
    #app { display: flex; flex-direction: column; width: 100%; height: 100dvh; }

    #top-bar { height: 44px; background: #18181a; display: flex; align-items: center; gap: 8px; padding: 0 8px; flex-shrink: 0; overflow-x: auto; border-bottom: 1px solid #2a2a30; }
    .btn { background: #25252a; border: 1px solid #3d3d45; color: #fff; font-size: 11px; padding: 6px 10px; border-radius: 4px; flex-shrink: 0; cursor: pointer; }

    #viewport { flex: 1; position: relative; background: #121215; min-height: 0; }
    #canvas3d { width: 100%; height: 100%; display: block; }

    #timeline-panel { height: 80px; background: #141417; border-top: 1px solid #28282e; display: flex; flex-direction: column; flex-shrink: 0; z-index: 10; }
    #tl-header { height: 24px; background: #1c1c20; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-size: 10px; color: #888; }
    #tl-body { flex: 1; background: #0d0d0f; position: relative; }
    #tl-canvas { width: 100%; height: 100%; display: block; }

    #bottom-toolbar { height: 50px; background: #18181a; border-top: 1px solid #28282e; display: flex; align-items: center; gap: 12px; padding: 0 12px; flex-shrink: 0; overflow-x: auto; z-index: 20; }
    .tool-item { display: flex; flex-direction: column; align-items: center; gap: 2px; color: #aaa; font-size: 10px; flex-shrink: 0; width: 45px; cursor: pointer; }
  </style>
  <!-- Three.js and OrbitControls CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="app">
  <div id="top-bar">
    <button class="btn" onclick="addCube()">🧊 Add Cube</button>
    <button class="btn" onclick="addSphere()">🔮 Add Sphere</button>
    <button class="btn" onclick="resetCam()">🏠 Center Cam</button>
  </div>

  <div id="viewport">
    <canvas id="canvas3d"></canvas>
  </div>

  <div id="timeline-panel">
    <div id="tl-header">
      <span>Timeline Control</span>
      <span id="frame-counter">00:00.00</span>
    </div>
    <div id="tl-body">
      <canvas id="tl-canvas"></canvas>
    </div>
  </div>

  <div id="bottom-toolbar">
    <div class="tool-item" onclick="addCube()"><span>🧊</span>Cube</div>
    <div class="tool-item" onclick="addSphere()"><span>🔮</span>Sphere</div>
  </div>
</div>

<script>
  let scene, camera, renderer, controls;
  const objects = [];

  function init3D() {
    const container = document.getElementById('viewport');
    const canvas = document.getElementById('canvas3d');

    // 1. Scene
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x121215);

    // 2. Camera
    camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(3, 3, 5);

    // 3. Renderer
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    // 4. Controls
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 5. Lights & Grid
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const grid = new THREE.GridHelper(10, 10, 0x444444, 0x222222);
    scene.add(grid);

    // Add Initial Cube
    addCube();

    // Render Loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    initTimeline();
  }

  function addCube() {
    const geometry = new THREE.BoxGeometry(1, 1, 1);
    const material = new THREE.MeshStandardMaterial({ color: 0x007aff });
    const cube = new THREE.Mesh(geometry, material);
    cube.position.y = 0.5;
    scene.add(cube);
    objects.push(cube);
  }

  function addSphere() {
    const geometry = new THREE.SphereGeometry(0.7, 32, 32);
    const material = new THREE.MeshStandardMaterial({ color: 0xff3b30 });
    const sphere = new THREE.Mesh(geometry, material);
    sphere.position.y = 0.7;
    scene.add(sphere);
    objects.push(sphere);
  }

  function resetCam() {
    camera.position.set(3, 3, 5);
    controls.target.set(0, 0, 0);
    controls.update();
  }

  function initTimeline() {
    const tlCanvas = document.getElementById('tl-canvas');
    const tlContainer = document.getElementById('tl-body');
    tlCanvas.width = tlContainer.clientWidth;
    tlCanvas.height = tlContainer.clientHeight;
    
    const ctx = tlCanvas.getContext('2d');
    ctx.fillStyle = '#0d0d0f';
    ctx.fillRect(0, 0, tlCanvas.width, tlCanvas.height);
    
    // Draw timeline ruler lines
    ctx.strokeStyle = '#28282e';
    ctx.beginPath();
    for (let i = 0; i < tlCanvas.width; i += 20) {
      ctx.moveTo(i, 0);
      ctx.lineTo(i, 10);
    }
    ctx.stroke();
  }

  window.addEventListener('resize', () => {
    const container = document.getElementById('viewport');
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
    initTimeline();
  });

  window.addEventListener('load', init3D);
</script>
</body>
</html>
