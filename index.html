<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Mobile Auto-Rig & Animator</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent;
    }
    body, html { 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background-color: #1a1a1a; 
      font-family: system-ui, -apple-system, sans-serif; 
      color: #fff; 
    }
    #app-container { 
      display: flex; 
      flex-direction: column; 
      width: 100vw; 
      height: 100vh; 
      position: relative; 
    }
    #top-bar { 
      height: 50px; 
      background: #252525; 
      display: flex; 
      align-items: center; 
      padding: 0 8px; 
      gap: 6px; 
      overflow-x: auto; 
      white-space: nowrap; 
      border-bottom: 1px solid #333; 
      z-index: 9999; 
      position: relative; 
      touch-action: pan-x;
    }
    #top-bar::-webkit-scrollbar { display: none; }
    
    .btn { 
      background: #3a3a3c; 
      color: #fff; 
      border: 1px solid #48484a; 
      padding: 8px 12px; 
      border-radius: 6px; 
      font-size: 12px; 
      font-weight: 600; 
      cursor: pointer; 
      display: inline-flex; 
      align-items: center; 
      gap: 4px; 
      flex-shrink: 0; 
      z-index: 10000;
      position: relative;
      touch-action: manipulation;
    }
    .btn:active, .btn.active { 
      background: #007aff; 
      border-color: #007aff; 
    }
    .btn-danger { background: #8e0000; border-color: #aa0000; }
    .btn-special { background: #5e5ce6; border-color: #5e5ce6; }
    .btn-success { background: #28a745; border-color: #28a745; }
    .btn-preset { background: #ff9500; border-color: #ff9500; }
    
    #viewport-container { 
      flex: 1; 
      position: relative; 
      width: 100%; 
      background: #121212; 
      overflow: hidden; 
    }
    #three-canvas { 
      width: 100%; 
      height: 100%; 
      display: block; 
      touch-action: none; 
      z-index: 1;
    }
    #rig-overlay { 
      position: absolute; 
      top: 10px; 
      left: 50%; 
      transform: translateX(-50%); 
      display: none; 
      gap: 10px; 
      z-index: 9999; 
      background: rgba(0,0,0,0.85); 
      padding: 8px 16px; 
      border-radius: 30px; 
      border: 1px solid #5e5ce6; 
    }
    #hierarchy-panel { 
      position: absolute; 
      top: 10px; 
      left: 10px; 
      width: 140px; 
      max-height: 180px; 
      background: rgba(30, 30, 30, 0.9); 
      border: 1px solid #444; 
      border-radius: 8px; 
      padding: 8px; 
      overflow-y: auto; 
      z-index: 9999; 
      font-size: 11px; 
      touch-action: pan-y;
    }
    .tree-item { 
      padding: 4px 6px; 
      border-radius: 4px; 
      cursor: pointer; 
      margin-bottom: 2px; 
      overflow: hidden; 
      text-overflow: ellipsis; 
      white-space: nowrap; 
      background: #2a2a2a; 
    }
    .tree-item.selected { background: #007aff; }
    .tree-item.bone-item { background: #3a2e5c; color: #d0c4ff; margin-left: 8px; }
    .tree-item.bone-item.selected { background: #5e5ce6; color: #fff; }
    
    #timeline-container { 
      height: 130px; 
      background: #1e1e1e; 
      border-top: 1px solid #333; 
      display: flex; 
      flex-direction: column; 
      z-index: 9999; 
      position: relative; 
    }
    #timeline-controls { 
      height: 36px; 
      background: #282828; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding: 0 8px; 
      border-bottom: 1px solid #333; 
      overflow-x: auto; 
      gap: 6px; 
      touch-action: pan-x;
    }
    #timeline-controls::-webkit-scrollbar { display: none; }
    .playback-group { display: flex; gap: 4px; flex-shrink: 0; }
    #timeline-slider-wrap { 
      flex: 1; 
      height: 94px; 
      position: relative; 
      overflow-x: hidden; 
      background: #181818; 
      touch-action: none; 
    }
    #timeline-canvas { height: 100%; display: block; width: 100%; }
    input[type="file"] { display: none; }
    #toast { 
      position: absolute; 
      bottom: 150px; 
      left: 50%; 
      transform: translateX(-50%); 
      background: rgba(0,0,0,0.85); 
      color: white; 
      padding: 8px 16px; 
      border-radius: 20px; 
      font-size: 12px; 
      display: none; 
      z-index: 10000; 
      pointer-events: none; 
    }
  </style>

  <!-- Stable Three.js & Controls Loaders -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
</head>
<body>

<div id="app-container">
  <div id="top-bar">
    <button class="btn" id="btn-add-cube">🧊 Cube</button>
    <button class="btn" id="btn-model">📦 Upload Model</button>
    <div style="width: 1px; height: 20px; background: #444; margin: 0 2px;"></div>
    <button class="btn btn-special" id="btn-start-rig">🦴 Auto-Rig (Full Body)</button>
    <div style="width: 1px; height: 20px; background: #444; margin: 0 2px;"></div>
    <button class="btn active" id="mode-select">Select</button>
    <button class="btn" id="mode-move">Move</button>
    <button class="btn" id="mode-rotate">Rotate</button>
    <button class="btn btn-danger" id="btn-delete">🗑 Delete</button>
  </div>

  <div id="viewport-container">
    <canvas id="three-canvas"></canvas>
    <div id="rig-overlay">
      <span style="font-size: 12px; align-self: center;">Align Joints:</span>
      <button class="btn btn-success" id="btn-apply-rig">✓ Apply Rig & Skin</button>
      <button class="btn btn-danger" id="btn-cancel-rig">✕ Cancel</button>
    </div>
    <div id="hierarchy-panel">
      <div style="font-weight: bold; margin-bottom: 6px; border-bottom: 1px solid #555;">Objects & Bones</div>
      <div id="tree-root"></div>
    </div>
    <div id="toast">Notification</div>
  </div>

  <div id="timeline-container">
    <div id="timeline-controls">
      <div class="playback-group">
        <button class="btn" id="btn-play">▶ Play</button>
        <button class="btn" id="btn-pause">⏸ Pause</button>
        <button class="btn" id="btn-stop">⏹ Stop</button>
      </div>
      <span id="time-display" style="font-size: 11px; font-family: monospace;">0.00s / 5.00s</span>
      <div class="playback-group">
        <button class="btn btn-preset" id="preset-stand">🧍 Stand</button>
        <button class="btn btn-preset" id="preset-walk">🚶 Walk</button>
        <button class="btn btn-preset" id="preset-run">🏃 Run</button>
        <button class="btn btn-preset" id="preset-jump">🦘 Jump</button>
      </div>
      <div class="playback-group">
        <button class="btn btn-success" id="btn-add-key">+ Key</button>
        <button class="btn btn-danger" id="btn-del-key">- Key</button>
      </div>
    </div>
    <div id="timeline-slider-wrap">
      <canvas id="timeline-canvas"></canvas>
    </div>
  </div>
</div>

<input type="file" id="input-model" accept=".glb,.gltf,.obj">

<script>
  let scene, camera, renderer, orbit, transformControls;
  let objectsList = [], selectedObject = null, riggedBonesMap = {};
  let currentTime = 0, duration = 5.0, isPlaying = false, keyframes = {};
  let jointMarkers = [];

  const canvas3D = document.getElementById('three-canvas');
  const treeRoot = document.getElementById('tree-root');
  const toastEl = document.getElementById('toast');
  const timeDisplay = document.getElementById('time-display');
  const tlCanvas = document.getElementById('timeline-canvas');
  const tlCtx = tlCanvas.getContext('2d');

  function init3D() {
    const container = document.getElementById('viewport-container');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);

    camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 1.5, 3.5);

    renderer = new THREE.WebGLRenderer({ canvas: canvas3D, antialias: true, alpha: false });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    orbit = new THREE.OrbitControls(camera, renderer.domElement);
    orbit.enableDamping = true;

    transformControls = new THREE.TransformControls(camera, renderer.domElement);
    transformControls.size = 0.75;
    scene.add(transformControls);

    transformControls.addEventListener('dragging-changed', function (e) {
      orbit.enabled = !e.value;
    });

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    scene.add(new THREE.GridHelper(20, 20, 0x555555, 0x333333));

    window.addEventListener('resize', onWindowResize);
    setupTimelineEvents();
    bindUIEvents();
    animate();
  }

  function showToast(msg) {
    toastEl.innerText = msg;
    toastEl.style.display = 'block';
    setTimeout(() => { toastEl.style.display = 'none'; }, 2000);
  }

  function selectObject(obj) {
    selectedObject = obj;
    if (obj) {
      transformControls.attach(obj);
    } else {
      transformControls.detach();
    }
    updateHierarchyUI();
    drawTimeline();
  }

  function addObject(obj, name) {
    obj.name = name || 'Model_' + (objectsList.length + 1);
    scene.add(obj);
    objectsList.push(obj);
    if (!keyframes[obj.uuid]) keyframes[obj.uuid] = [];
    selectObject(obj);
    showToast(obj.name + ' Added');
  }

  const defaultJointDefs = [
    { name: 'Head', pos: [0, 1.8, 0], color: 0x00e5ff },
    { name: 'Neck', pos: [0, 1.5, 0], color: 0x007aff },
    { name: 'L_Shoulder', pos: [0.35, 1.35, 0], color: 0xffcc00 },
    { name: 'R_Shoulder', pos: [-0.35, 1.35, 0], color: 0xffcc00 },
    { name: 'L_Elbow', pos: [0.6, 1.0, 0], color: 0xff9500 },
    { name: 'R_Elbow', pos: [-0.6, 1.0, 0], color: 0xff9500 },
    { name: 'Hips', pos: [0, 0.9, 0], color: 0xaf52de },
    { name: 'L_Hip', pos: [0.2, 0.85, 0], color: 0x34c759 },
    { name: 'R_Hip', pos: [-0.2, 0.85, 0], color: 0x34c759 },
    { name: 'L_Knee', pos: [0.2, 0.45, 0], color: 0x34c759 },
    { name: 'R_Knee', pos: [-0.2, 0.45, 0], color: 0x34c759 },
    { name: 'L_Ankle', pos: [0.2, 0.05, 0.05], color: 0xff2d55 },
    { name: 'R_Ankle', pos: [-0.2, 0.05, 0.05], color: 0xff2d55 }
  ];

  function addTouchClick(id, handler) {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('pointerdown', (e) => { e.stopPropagation(); });
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      e.preventDefault();
      handler(e);
    });
  }

  function bindUIEvents() {
    addTouchClick('btn-add-cube', () => {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: 0x007aff }));
      mesh.position.set(0, 0.5, 0);
      addObject(mesh, 'Cube');
    });

    addTouchClick('btn-model', () => {
      document.getElementById('input-model').click();
    });

    document.getElementById('input-model').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      const ext = file.name.split('.').pop().toLowerCase();

      if (ext === 'glb' || ext === 'gltf') {
        new THREE.GLTFLoader().load(url, (gltf) => addObject(gltf.scene, file.name));
      } else if (ext === 'obj') {
        new THREE.OBJLoader().load(url, (obj) => addObject(obj, file.name));
      }
    };

    addTouchClick('btn-start-rig', () => {
      if (!selectedObject) { showToast('Select a 3D Model first!'); return; }
      document.getElementById('rig-overlay').style.display = 'flex';
      transformControls.detach();
      createJointMarkers();
      showToast('Drag Markers to match character joints');
    });

    addTouchClick('btn-apply-rig', () => {
      if (!selectedObject) return;

      const jPos = {};
      jointMarkers.forEach(m => { jPos[m.userData.jointName] = m.position.clone(); });

      const bones = [];
      const boneMap = {};

      defaultJointDefs.forEach((j) => {
        const b = new THREE.Bone();
        b.name = j.name;
        b.position.copy(jPos[j.name]);
        boneMap[j.name] = b;
        bones.push(b);
      });

      boneMap['Hips'].add(boneMap['Neck']);
      boneMap['Neck'].add(boneMap['Head']);
      boneMap['Neck'].add(boneMap['L_Shoulder']);
      boneMap['L_Shoulder'].add(boneMap['L_Elbow']);
      boneMap['Neck'].add(boneMap['R_Shoulder']);
      boneMap['R_Shoulder'].add(boneMap['R_Elbow']);
      boneMap['Hips'].add(boneMap['L_Hip']);
      boneMap['L_Hip'].add(boneMap['L_Knee']);
      boneMap['L_Knee'].add(boneMap['L_Ankle']);
      boneMap['Hips'].add(boneMap['R_Hip']);
      boneMap['R_Hip'].add(boneMap['R_Knee']);
      boneMap['R_Knee'].add(boneMap['R_Ankle']);

      const skeleton = new THREE.Skeleton(bones);

      let targetMesh = selectedObject;
      if (targetMesh.isGroup) {
        targetMesh.traverse((c) => { if (c.isMesh) targetMesh = c; });
      }

      if (targetMesh && targetMesh.isMesh) {
        const geometry = targetMesh.geometry.clone();
        const position = geometry.attributes.position;
        const skinIndices = [];
        const skinWeights = [];

        for (let i = 0; i < position.count; i++) {
          const vertex = new THREE.Vector3().fromBufferAttribute(position, i);
          targetMesh.localToWorld(vertex);

          let minDist = Infinity;
          let closestBoneIdx = 0;

          bones.forEach((b, idx) => {
            const dist = vertex.distanceTo(b.position);
            if (dist < minDist) {
              minDist = dist;
              closestBoneIdx = idx;
            }
          });

          skinIndices.push(closestBoneIdx, 0, 0, 0);
          skinWeights.push(1, 0, 0, 0);
        }

        geometry.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(skinIndices, 4));
        geometry.setAttribute('skinWeight', new THREE.Float32BufferAttribute(skinWeights, 4));

        const skinnedMesh = new THREE.SkinnedMesh(geometry, targetMesh.material);
        skinnedMesh.add(bones[0]); 
        skinnedMesh.bind(skeleton);

        scene.remove(selectedObject);
        objectsList = objectsList.filter(o => o !== selectedObject);
        
        addObject(skinnedMesh, targetMesh.name || 'RiggedCharacter');
        selectedObject = skinnedMesh;
      }

      riggedBonesMap = boneMap;
      Object.values(boneMap).forEach(b => { keyframes[b.uuid] = []; });

      const skelHelper = new THREE.SkeletonHelper(boneMap['Hips']);
      scene.add(skelHelper);

      clearJointMarkers();
      document.getElementById('rig-overlay').style.display = 'none';
      selectObject(selectedObject);
      showToast('Rigging Applied!');
    });

    addTouchClick('btn-cancel-rig', () => {
      clearJointMarkers();
      document.getElementById('rig-overlay').style.display = 'none';
      selectObject(selectedObject);
    });

    addTouchClick('mode-select', () => setTransformMode('select', 'mode-select'));
    addTouchClick('mode-move', () => setTransformMode('translate', 'mode-move'));
    addTouchClick('mode-rotate', () => setTransformMode('rotate', 'mode-rotate'));

    addTouchClick('btn-delete', () => {
      if (selectedObject) {
        delete keyframes[selectedObject.uuid];
        scene.remove(selectedObject);
        objectsList = objectsList.filter(o => o !== selectedObject);
        selectObject(null);
        showToast('Deleted');
      }
    });

    addTouchClick('preset-stand', () => applyAnimationPreset('stand'));
    addTouchClick('preset-walk', () => applyAnimationPreset('walk'));
    addTouchClick('preset-run', () => applyAnimationPreset('run'));
    addTouchClick('preset-jump', () => applyAnimationPreset('jump'));

    addTouchClick('btn-play', () => isPlaying = true);
    addTouchClick('btn-pause', () => isPlaying = false);
    addTouchClick('btn-stop', () => { isPlaying = false; currentTime = 0; objectsList.forEach(obj => updateAnimatedNodes(obj)); drawTimeline(); });

    addTouchClick('btn-add-key', () => {
      if (!selectedObject) { showToast('Select an Object or Bone first!'); return; }
      const list = keyframes[selectedObject.uuid] || [];
      const t = parseFloat(currentTime.toFixed(2));
      const existingIndex = list.findIndex(k => Math.abs(k.time - t) < 0.05);
      const keyData = { time: t, pos: selectedObject.position.clone(), rot: selectedObject.rotation.clone(), scl: selectedObject.scale.clone() };

      if (existingIndex >= 0) list[existingIndex] = keyData;
      else list.push(keyData);

      list.sort((a, b) => a.time - b.time);
      keyframes[selectedObject.uuid] = list;
      drawTimeline();
      showToast('Keyframe Set at ' + t + 's');
    });

    addTouchClick('btn-del-key', () => {
      if (!selectedObject) return;
      let list = keyframes[selectedObject.uuid] || [];
      keyframes[selectedObject.uuid] = list.filter(k => Math.abs(k.time - currentTime) >= 0.1);
      drawTimeline();
      showToast('Keyframe Removed');
    });
  }

  function createJointMarkers() {
    clearJointMarkers();
    defaultJointDefs.forEach(j => {
      const geo = new THREE.TorusGeometry(0.05, 0.012, 16, 32);
      const mat = new THREE.MeshBasicMaterial({ color: j.color, depthTest: false });
      const marker = new THREE.Mesh(geo, mat);
      marker.position.set(...j.pos);
      marker.renderOrder = 999;
      marker.userData = { jointName: j.name };
      scene.add(marker);
      jointMarkers.push(marker);
    });
    if (jointMarkers.length > 0) transformControls.attach(jointMarkers[0]);
  }

  function clearJointMarkers() {
    jointMarkers.forEach(m => scene.remove(m));
    jointMarkers = [];
  }

  function applyAnimationPreset(type) {
    if (!riggedBonesMap['Hips']) { showToast('Apply Rigging first!'); return; }
    
    Object.values(riggedBonesMap).forEach(b => { keyframes[b.uuid] = []; });

    const setKey = (boneName, time, rx, ry, rz, px = 0, py = 0, pz = 0) => {
      const b = riggedBonesMap[boneName];
      if (!b) return;
      if (!keyframes[b.uuid]) keyframes[b.uuid] = [];
      keyframes[b.uuid].push({
        time: time,
        pos: new THREE.Vector3(b.position.x + px, b.position.y + py, b.position.z + pz),
        rot: new THREE.Euler(rx, ry, rz),
        scl: b.scale.clone()
      });
    };

    if (type === 'stand') {
      Object.keys(riggedBonesMap).forEach(name => {
        setKey(name, 0, 0, 0, 0);
        setKey(name, 2.5, 0, 0, 0);
      });
      showToast('Stand Preset Applied');
    } 
    else if (type === 'walk') {
      const times = [0, 1.25, 2.5, 3.75, 5.0];
      times.forEach((t, i) => {
        const sign = (i % 2 === 0) ? 1 : -1;
        setKey('L_Hip', t, 0.5 * sign, 0, 0);
        setKey('R_Hip', t, -0.5 * sign, 0, 0);
        setKey('L_Knee', t, sign > 0 ? 0.4 : 0.1, 0, 0);
        setKey('R_Knee', t, sign < 0 ? 0.4 : 0.1, 0, 0);
        setKey('L_Shoulder', t, -0.6 * sign, 0, 0);
        setKey('R_Shoulder', t, 0.6 * sign, 0, 0);
        setKey('L_Elbow', t, 0.3, 0, 0);
        setKey('R_Elbow', t, 0.3, 0, 0);
      });
      showToast('Walk Preset Applied');
    }
    else if (type === 'run') {
      const times = [0, 0.75, 1.5, 2.25, 3.0, 3.75, 4.5, 5.0];
      times.forEach((t, i) => {
        const sign = (i % 2 === 0) ? 1 : -1;
        setKey('L_Hip', t, 0.8 * sign, 0, 0);
        setKey('R_Hip', t, -0.8 * sign, 0, 0);
        setKey('L_Knee', t, sign > 0 ? 0.9 : 0.2, 0, 0);
