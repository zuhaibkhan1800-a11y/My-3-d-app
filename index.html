<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    #app { display: flex; flex-direction: column; width: 100vw; height: 100vh; position: relative; overflow: hidden; }
    
    /* Top Navigation */
    #top-bar { 
      height: 44px; background: #121212; display: flex; align-items: center; justify-content: space-between; padding: 0 12px;
      border-bottom: 1px solid #222; flex-shrink: 0; z-index: 1000;
    }
    .top-bar-left, .top-bar-right { display: flex; align-items: center; gap: 10px; }
    .icon-btn { background: transparent; border: none; color: #ccc; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 4px; }
    .icon-btn:active { background: #222; color: #007aff; }

    /* 3D Viewport */
    #viewport { flex: 1; position: relative; width: 100%; background: #0a0a0a; min-height: 0; }
    #three-canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    
    #hierarchy { 
      position: absolute; top: 12px; left: 12px; width: 110px; max-height: 100px; 
      background: rgba(18, 18, 18, 0.8); border: 1px solid #333; border-radius: 6px; padding: 6px; 
      overflow-y: auto; z-index: 100; font-size: 10px; backdrop-filter: blur(4px);
    }
    .tree-item { padding: 3px 5px; border-radius: 3px; margin-bottom: 2px; background: rgba(255,255,255,0.05); cursor: pointer; }
    .tree-item.selected { background: #007aff; color: #fff; }

    /* Video Timeline Panel */
    #timeline-panel { 
      height: 120px; background: #111; border-top: 1px solid #222; display: flex; flex-direction: column; flex-shrink: 0; z-index: 999;
    }
    #tl-header { 
      height: 28px; background: #181818; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 10px; color: #888;
    }
    #tl-play-btn { background: transparent; border: none; color: #fff; font-size: 12px; cursor: pointer; }
    #tl-tracks-container { flex: 1; position: relative; overflow: hidden; background: #0e0e0e; touch-action: none; }
    #tl-canvas { width: 100%; height: 100%; display: block; }

    /* Bottom Toolbar Grid (Guaranteed Visible) */
    #bottom-toolbar { 
      height: 60px; background: #121212; border-top: 1px solid #222; display: flex !important; align-items: center; justify-content: space-around;
      padding: 0 4px; flex-shrink: 0; z-index: 1001; position: relative;
    }
    .tool-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #aaa; font-size: 10px; cursor: pointer; flex: 1; height: 100%; }
    .tool-item span { font-size: 18px; }
    .tool-item:active { color: #007aff; }

    #toast { 
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%); 
      background: rgba(0,0,0,0.85); color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 11px; 
      display: none; z-index: 2000; pointer-events: none; border: 1px solid #444;
    }
    input[type="file"] { display: none !important; }
  </style>

  <!-- Three.js Bundle -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

<div id="app">
  <!-- Top Navigation Bar -->
  <div id="top-bar">
    <div class="top-bar-left">
      <button class="icon-btn">🏠</button>
    </div>
    <div class="top-bar-right">
      <button class="icon-btn" id="btn-mode-trans">✢ Move</button>
      <button class="icon-btn" id="btn-mode-rot">🔄 Rotate</button>
      <button class="icon-btn" id="btn-delete" style="color: #ff3b30;">🗑</button>
    </div>
  </div>

  <!-- 3D Canvas Area -->
  <div id="viewport">
    <canvas id="three-canvas"></canvas>
    <div id="hierarchy">
      <div style="font-weight: bold; margin-bottom: 4px; border-bottom: 1px solid #444;">Objects</div>
      <div id="tree-root"></div>
    </div>
    <div id="toast">Engine Ready</div>
  </div>

  <!-- Video Editor Timeline -->
  <div id="timeline-panel">
    <div id="tl-header">
      <button id="tl-play-btn">▶</button>
      <span id="time-val" style="font-family: monospace;">00:00.00 of 05:00</span>
      <span style="font-size: 10px; color: #666;">FPS: 30</span>
    </div>
    <div id="tl-tracks-container">
      <canvas id="tl-canvas"></canvas>
    </div>
  </div>

  <!-- Import & Creation Bottom Toolbar -->
  <div id="bottom-toolbar">
    <div class="tool-item" id="btn-add-model">
      <span>📦</span>Models
    </div>
    <div class="tool-item" id="btn-sky">
      <span>🌐</span>Sky
    </div>
    <div class="tool-item" id="btn-add-camera">
      <span>🎥</span>Camera
    </div>
    <div class="tool-item" id="btn-light">
      <span>💡</span>Light
    </div>
    <div class="tool-item" id="btn-upload-photo">
      <span>🖼️</span>Media
    </div>
    <div class="tool-item" id="btn-add-cube">
      <span>🧊</span>Cube
    </div>
  </div>
</div>

<!-- Hidden File Inputs -->
<input type="file" id="file-model" accept=".glb,.gltf">
<input type="file" id="file-photo" accept="image/*">

<script>
  let scene, camera, renderer, orbit, transform;
  let objects = [], selectedObj = null;
  let raycaster = new THREE.Raycaster();
  let mouse = new THREE.Vector2();
  let isPlaying = false, currentTime = 0, duration = 5.0;

  const toast = document.getElementById('toast');
  const treeRoot = document.getElementById('tree-root');
  const tlWrap = document.getElementById('tl-tracks-container');
  const tlCanvas = document.getElementById('tl-canvas');
  const tlCtx = tlCanvas.getContext('2d');

  function showMsg(m) {
    toast.innerText = m;
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 2000);
  }

  function initApp() {
    const viewport = document.getElementById('viewport');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0a);

    camera = new THREE.PerspectiveCamera(60, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
    camera.position.set(0, 2, 5);

    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three-canvas'), antialias: true });
    renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    orbit = new THREE.OrbitControls(camera, renderer.domElement);
    orbit.enableDamping = true;
    orbit.target.set(0, 0, 0);

    transform = new THREE.TransformControls(camera, renderer.domElement);
    transform.size = 0.8;
    transform.addEventListener('dragging-changed', (e) => { orbit.enabled = !e.value; });
    scene.add(transform);

    const light1 = new THREE.DirectionalLight(0xffffff, 1.2);
    light1.position.set(5, 10, 7);
    scene.add(light1);
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));

    // Permanent Grid
    const grid = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
    grid.position.y = 0;
    scene.add(grid);

    setupEvents();
    drawTimeline();
    animate();
  }

  function selectObject(obj) {
    selectedObj = obj;
    if (obj) transform.attach(obj);
    else transform.detach();
    updateTree();
  }

  function addObject(obj, name) {
    obj.name = name || 'Mesh_' + (objects.length + 1);
    scene.add(obj);
    objects.push(obj);
    selectObject(obj);
  }

  function setupEvents() {
    const canvas = document.getElementById('three-canvas');
    canvas.addEventListener('pointerdown', (e) => {
      if (transform.dragging) return;
      const rect = canvas.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / canvas.clientWidth) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / canvas.clientHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(objects, true);

      if (intersects.length > 0) {
        let topObj = intersects[0].object;
        while (topObj.parent && topObj.parent !== scene) topObj = topObj.parent;
        selectObject(topObj);
      }
    });

    // Import Button Handlers
    document.getElementById('btn-add-model').addEventListener('click', () => {
      document.getElementById('file-model').click();
    });

    document.getElementById('btn-upload-photo').addEventListener('click', () => {
      document.getElementById('file-photo').click();
    });

    document.getElementById('btn-mode-trans').onclick = () => { transform.setMode('translate'); showMsg('Move Tool'); };
    document.getElementById('btn-mode-rot').onclick = () => { transform.setMode('rotate'); showMsg('Rotate Tool'); };

    document.getElementById('file-model').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      showMsg('Loading Model...');
      const loader = new THREE.GLTFLoader();
      loader.load(URL.createObjectURL(file), (gltf) => {
        addObject(gltf.scene, file.name);
        showMsg('Model Loaded!');
      }, undefined, (err) => {
        showMsg('Error loading model');
      });
    };

    document.getElementById('file-photo').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      new THREE.TextureLoader().load(URL.createObjectURL(file), (tex) => {
        if (selectedObj) {
          selectedObj.traverse(child => { if(child.isMesh) child.material.map = tex; });
          showMsg('Texture Applied!');
        } else {
          const plane = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 1.5), new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide }));
          plane.position.set(0, 1, 0);
          addObject(plane, 'Media Plane');
        }
      });
    };

    document.getElementById('btn-add-cube').onclick = () => {
      const cube = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshStandardMaterial({ color: 0x007aff }));
      cube.position.set(0, 0.4, 0);
      addObject(cube, 'Cube');
    };

    document.getElementById('btn-delete').onclick = () => {
      if (selectedObj) {
        transform.detach();
        scene.remove(selectedObj);
        objects = objects.filter(o => o !== selectedObj);
        selectObject(null);
        showMsg('Deleted');
      }
    };

    document.getElementById('tl-play-btn').onclick = () => {
      isPlaying = !isPlaying;
      document.getElementById('tl-play-btn').innerText = isPlaying ? '⏸' : '▶';
    };

    const scrubTimeline = (e) => {
      const rect = tlWrap.getBoundingClientRect();
      const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
      let ratio = Math.max(0, Math.min(1, x / rect.width));
      currentTime = ratio * duration;
      drawTimeline();
    };

    tlWrap.addEventListener('pointerdown', scrubTimeline);
    tlWrap.addEventListener('pointermove', (e) => { if(e.buttons > 0) scrubTimeline(e); });

    window.addEventListener('resize', () => {
      const vp = document.getElementById('viewport');
      camera.aspect = vp.clientWidth / vp.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(vp.clientWidth, vp.clientHeight);
      drawTimeline();
    });
  }

  function updateTree() {
    treeRoot.innerHTML = '';
    objects.forEach(obj => {
      const item = document.createElement('div');
      item.className = 'tree-item' + (selectedObj === obj ? ' selected' : '');
      item.innerText = '📦 ' + obj.name;
      item.onclick = (e) => { e.stopPropagation(); selectObject(obj); };
      treeRoot.appendChild(item);
    });
  }

  function drawTimeline() {
    const w = tlCanvas.width = tlWrap.clientWidth;
    const h = tlCanvas.height = tlWrap.clientHeight;
    
    tlCtx.fillStyle = '#0e0e0e';
    tlCtx.fillRect(0, 0, w, h);
    
    tlCtx.fillStyle = '#555';
    tlCtx.font = '9px sans-serif';
    tlCtx.strokeStyle = '#1d1d1d';
    tlCtx.lineWidth = 1;

    for(let i = 0; i <= 5; i++) {
      let x = (i / 5) * (w - 20) + 10;
      tlCtx.fillText(i + 's', x - 4, 10);
      tlCtx.beginPath(); tlCtx.moveTo(x, 14); tlCtx.lineTo(x, h); tlCtx.stroke();
    }

    tlCtx.fillStyle = '#1a1a1a';
    tlCtx.fillRect(10, 20, w - 20, 18);
    tlCtx.fillStyle = '#777';
    tlCtx.fillText('✕ Camera', 16, 32);

    let clipStart = 10 + (0 / duration) * (w - 20);
    let clipWidth = (2 / duration) * (w - 20);
    tlCtx.fillStyle = '#2563eb';
    tlCtx.fillRect(clipStart, 42, clipWidth, 26);
    tlCtx.fillStyle = '#fff';
    tlCtx.fillText('Animation', clipStart + 6, 54);

    let playheadX = (currentTime / duration) * (w - 20) + 10;
    tlCtx.strokeStyle = '#ffffff';
    tlCtx.lineWidth = 2;
    tlCtx.beginPath();
    tlCtx.moveTo(playheadX, 0);
    tlCtx.lineTo(playheadX, h);
    tlCtx.stroke();

    let sec = currentTime.toFixed(2);
    document.getElementById('time-val').innerText = '00:' + (sec < 10 ? '0' : '') + sec + ' of 05:00';
  }

  function animate() {
    requestAnimationFrame(animate);
    if (isPlaying) {
      currentTime += 0.016;
      if (currentTime > duration) currentTime = 0;
      drawTimeline();
    }
    orbit.update();
    renderer.render(scene, camera);
  }

  window.onload = initApp;
</script>
</body>
</html>
