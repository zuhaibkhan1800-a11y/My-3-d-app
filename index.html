<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Prisma 3D Editor - Real 3D File Parser</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100dvh; overflow: hidden; background: #0f0f11; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #app { display: flex; flex-direction: column; width: 100%; height: 100dvh; position: relative; }
    
    #top-bar { height: 50px; background: #18181a; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-bottom: 1px solid #28282e; flex-shrink: 0; z-index: 100; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
    #top-bar::-webkit-scrollbar { display: none; }
    
    .icon-btn { background: #25252a; border: 1px solid #3d3d45; color: #eee; font-size: 11px; padding: 6px 12px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .icon-btn:active { background: #007aff; color: #fff; }
    .icon-btn.rig-btn { background: rgba(52, 199, 89, 0.15); color: #34c759; border-color: rgba(52, 199, 89, 0.4); }
    .icon-btn.rig-btn.active { background: #34c759; color: #000; font-weight: bold; }
    .icon-btn.keyframe-btn { background: rgba(255, 204, 0, 0.15); color: #ffcc00; border-color: rgba(255, 204, 0, 0.4); }
    .icon-btn.delete-btn { background: rgba(255, 59, 48, 0.15); color: #ff3b30; border-color: rgba(255, 59, 48, 0.4); }

    #viewport { flex: 1; position: relative; background: #121215; width: 100%; min-height: 0; overflow: hidden; }
    #canvas3d { width: 100%; height: 100%; display: block; position: absolute; top:0; left:0; touch-action: none; }
    
    #hierarchy { position: absolute; top: 12px; left: 12px; width: 140px; max-height: 160px; background: rgba(20, 20, 24, 0.88); border: 1px solid #33333d; border-radius: 8px; padding: 8px; z-index: 10; font-size: 11px; overflow-y: auto; backdrop-filter: blur(6px); }
    .tree-item { padding: 6px 8px; border-radius: 4px; margin-top: 4px; background: rgba(255,255,255,0.05); cursor: pointer; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
    .tree-item.selected { background: #007aff; color: #fff; font-weight: bold; }

    #timeline-panel { height: 110px; background: #141417; border-top: 1px solid #28282e; display: flex; flex-direction: column; flex-shrink: 0; z-index: 100; }
    #tl-header { height: 28px; background: #1c1c20; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 11px; color: #aaa; border-bottom: 1px solid #2a2a30; }
    #tl-play-btn { background: #2a2a32; border: 1px solid #444; color: #fff; font-size: 11px; padding: 3px 10px; border-radius: 4px; cursor: pointer; }
    
    #tl-body { flex: 1; display: flex; overflow-x: auto; position: relative; background: #101012; }
    #tl-track-labels { width: 95px; background: #161619; border-right: 1px solid #28282e; flex-shrink: 0; z-index: 5; }
    .track-label { height: 32px; display: flex; align-items: center; padding: 0 8px; font-size: 10px; color: #888; border-bottom: 1px solid #222226; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
    .track-label.active { color: #fff; background: rgba(0, 122, 255, 0.2); font-weight: bold; }
    
    #tl-canvas-container { flex: 1; position: relative; height: 100%; min-width: 100%; }
    #tl-canvas { width: 100%; height: 100%; display: block; }

    #bottom-toolbar { height: 58px; background: #18181a; border-top: 1px solid #28282e; display: flex; align-items: center; gap: 12px; padding: 0 12px; flex-shrink: 0; z-index: 100; overflow-x: auto; scrollbar-width: none; }
    #bottom-toolbar::-webkit-scrollbar { display: none; }
    
    .tool-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #aaa; font-size: 10px; cursor: pointer; flex-shrink: 0; min-width: 55px; height: 100%; }
    .tool-item span { font-size: 18px; }
    .tool-item:active { color: #007aff; }

    #toast { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 11px; display: none; z-index: 1000; border: 1px solid #444; pointer-events: none; }
    input[type="file"] { display: none !important; }
  </style>
</head>
<body>

<div id="app">
  <div id="top-bar">
    <button class="icon-btn" onclick="resetCam()">🏠 Home</button>
    <button class="icon-btn" onclick="setMode('translate')">✢ Move</button>
    <button class="icon-btn" onclick="setMode('rotate')">🔄 Rotate</button>
    <button id="rig-btn" class="icon-btn rig-btn" onclick="toggleRig()">🦴 Bone Rig</button>
    <button class="icon-btn keyframe-btn" onclick="addKeyframe()">🔑 Keyframe</button>
    <button class="icon-btn delete-btn" onclick="deleteObj()">🗑 Delete</button>
  </div>

  <div id="viewport">
    <canvas id="canvas3d"></canvas>
    <div id="hierarchy">
      <div style="font-weight: bold; border-bottom: 1px solid #444; padding-bottom:3px; color:#aaa;">Objects</div>
      <div id="tree-root"></div>
    </div>
    <div id="toast">Ready</div>
  </div>

  <div id="timeline-panel">
    <div id="tl-header">
      <button id="tl-play-btn" onclick="togglePlay()">▶ Play</button>
      <span id="time-val" style="font-family: monospace;">00:00.00 of 05:00</span>
      <span style="font-size: 10px; color: #666;">FPS: 30</span>
    </div>
    <div id="tl-body">
      <div id="tl-track-labels"></div>
      <div id="tl-canvas-container">
        <canvas id="tl-canvas"></canvas>
      </div>
    </div>
  </div>

  <div id="bottom-toolbar">
    <div class="tool-item" onclick="addCube()"><span>🧊</span>Cube</div>
    <div class="tool-item" onclick="addSphere()"><span>🔮</span>Sphere</div>
    <div class="tool-item" onclick="addLight()"><span>💡</span>Light</div>
    <div class="tool-item" onclick="triggerImport()"><span>📂</span>Import .OBJ</div>
    <div class="tool-item" onclick="triggerImgUpload()"><span>🖼️</span>Texture</div>
    <div class="tool-item" onclick="toggleBg()"><span>🌐</span>BG Toggle</div>
  </div>
</div>

<input type="file" id="img-input" accept="image/*">
<input type="file" id="import-input" accept=".obj">

<script>
  const canvas = document.getElementById('canvas3d');
  const ctx = canvas.getContext('2d');
  
  let width, height;
  let objects = [];
  let selectedIdx = -1;
  let keyframes = [];
  let isPlaying = false, currentTime = 0, duration = 5.0;
  let currentMode = 'translate';
  let isRigActive = false;
  let bgDark = true;

  let cameraDistance = 6.0;
  let yaw = 0.0;
  let pitch = 0.4;
  let targetX = 0, targetY = 0.5, targetZ = 0;

  let isDragging = false;
  let lastX = 0, lastY = 0;

  function resize() {
    const vp = document.getElementById('viewport');
    width = canvas.width = vp.clientWidth;
    height = canvas.height = vp.clientHeight;
    drawScene();
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 2000);
  }

  function project(x, y, z) {
    let cosY = Math.cos(yaw), sinY = Math.sin(yaw);
    let cosP = Math.cos(pitch), sinP = Math.sin(pitch);

    let dx = x - targetX;
    let dy = y - targetY;
    let dz = z - targetZ;

    let rx = cosY * dx - sinY * dz;
    let rz = sinY * dx + cosY * dz;

    let ry = cosP * dy - sinP * rz;
    let finalZ = sinP * dy + cosP * rz + cameraDistance;

    if (finalZ <= 0.1) return null;

    let fov = 380;
    return {
      x: width / 2 + (rx * fov) / finalZ,
      y: height / 2 - (ry * fov) / finalZ,
      z: finalZ
    };
  }

  function createCube() {
    return {
      type: 'Mesh',
      name: 'Cube ' + (objects.length + 1),
      x: 0, y: 0.5, z: 0,
      rx: 0, ry: 0, rz: 0,
      sx: 1, sy: 1, sz: 1,
      color: '#007aff',
      vertices: [
        [-0.5,-0.5,-0.5],[0.5,-0.5,-0.5],[0.5,0.5,-0.5],[-0.5,0.5,-0.5],
        [-0.5,-0.5,0.5],[0.5,-0.5,0.5],[0.5,0.5,0.5],[-0.5,0.5,0.5]
      ],
      faces: [
        [0,1,2,3],[5,4,7,6],[4,0,3,7],[1,5,6,2],[4,5,1,0],[3,2,6,7]
      ]
    };
  }

  function addCube() {
    const cube = createCube();
    objects.push(cube);
    selectedIdx = objects.length - 1;
    updateUI();
    showToast("Cube Added!");
  }

  function addSphere() {
    const sphere = createCube();
    sphere.name = 'Sphere ' + (objects.length + 1);
    sphere.color = '#ff9500';
    objects.push(sphere);
    selectedIdx = objects.length - 1;
    updateUI();
    showToast("Sphere Added!");
  }

  function addLight() {
    const light = {
      type: 'Light',
      name: 'PointLight ' + (objects.length + 1),
      x: 0, y: 3, z: 0,
      color: '#ffcc00'
    };
    objects.push(light);
    selectedIdx = objects.length - 1;
    updateUI();
    showToast("Light Added!");
  }

  function triggerImport() {
    document.getElementById('import-input').click();
  }

  // Real OBJ File Parser
  document.getElementById('import-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(evt) {
      const text = evt.target.result;
      const lines = text.split('\n');
      
      const parsedVertices = [];
      const parsedFaces = [];

      lines.forEach(line => {
        line = line.trim();
        if (line.startsWith('v ')) {
          const parts = line.split(/\s+/).slice(1).map(Number);
          parsedVertices.push(parts);
        } else if (line.startsWith('f ')) {
          const parts = line.split(/\s+/).slice(1).map(p => {
            const idx = p.split('/')[0];
            return parseInt(idx) - 1;
          });
          if (parts.length >= 3) {
            parsedFaces.push(parts);
          }
        }
      });

      if (parsedVertices.length === 0) {
        showToast("Invalid OBJ file!");
        return;
      }

      // Auto Scale/Center Model
      let maxX = -Infinity, minX = Infinity;
      let maxY = -Infinity, minY = Infinity;
      let maxZ = -Infinity, minZ = Infinity;

      parsedVertices.forEach(v => {
        if(v[0] > maxX) maxX = v[0]; if(v[0] < minX) minX = v[0];
        if(v[1] > maxY) maxY = v[1]; if(v[1] < minY) minY = v[1];
        if(v[2] > maxZ) maxZ = v[2]; if(v[2] < minZ) minZ = v[2];
      });

      let maxDim = Math.max(maxX - minX, maxY - minY, maxZ - minZ);
      let scaleFactor = maxDim > 0 ? 2.0 / maxDim : 1;

      let normalizedVertices = parsedVertices.map(v => [
        (v[0] - (maxX + minX) / 2) * scaleFactor,
        (v[1] - (maxY + minY) / 2) * scaleFactor + 0.5,
        (v[2] - (maxZ + minZ) / 2) * scaleFactor
      ]);

      const importedObj = {
        type: 'Mesh',
        name: file.name.split('.')[0],
        x: 0, y: 0, z: 0,
        rx: 0, ry: 0, rz: 0,
        sx: 1, sy: 1, sz: 1,
        color: '#af52de',
        vertices: normalizedVertices,
        faces: parsedFaces
      };

      objects.push(importedObj);
      selectedIdx = objects.length - 1;
      updateUI();
      showToast("OBJ Model Imported!");
    };
    reader.readAsText(file);
  });

  function resetCam() {
    cameraDistance = 6.0;
    yaw = 0.0;
    pitch = 0.4;
    targetX = 0; targetY = 0.5; targetZ = 0;
    drawScene();
  }

  function setMode(mode) {
    currentMode = mode;
    showToast("Mode: " + mode.toUpperCase());
  }

  function toggleRig() {
    isRigActive = !isRigActive;
    document.getElementById('rig-btn').classList.toggle('active', isRigActive);
    showToast(isRigActive ? "Bone Rig Active" : "Rig Disabled");
    drawScene();
  }

  function toggleBg() {
    bgDark = !bgDark;
    drawScene();
  }

  function deleteObj() {
    if (selectedIdx >= 0) {
      const name = objects[selectedIdx].name;
      objects.splice(selectedIdx, 1);
      keyframes = keyframes.filter(k => k.objIdx !== selectedIdx);
      selectedIdx = objects.length - 1;
      updateUI();
      showToast(name + " Deleted");
    }
  }

  function drawGrid() {
    ctx.strokeStyle = bgDark ? '#282834' : '#d0d0d8';
    ctx.lineWidth = 1;
    let size = 6, step = 1;

    for (let i = -size; i <= size; i += step) {
      let p1 = project(i, 0, -size);
      let p2 = project(i, 0, size);
      if (p1 && p2) {
        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
      }
      let p3 = project(-size, 0, i);
      let p4 = project(size, 0, i);
      if (p3 && p4) {
        ctx.beginPath(); ctx.moveTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y); ctx.stroke();
      }
    }
  }

  function renderObject(obj, idx) {
    let isSelected = (idx === selectedIdx);

    if (obj.type === 'Light') {
      let p = project(obj.x, obj.y, obj.z);
      if (p) {
        ctx.fillStyle = obj.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = isSelected ? '#ffffff' : '#ffcc00';
        ctx.lineWidth = 2; ctx.stroke();
      }
      return;
    }

    let renderVertices = [];
    obj.vertices.forEach(v => {
      let x = v[0] * obj.sx, y = v[1] * obj.sy, z = v[2] * obj.sz;
      let cosY = Math.cos(obj.ry), sinY = Math.sin(obj.ry);
      let x1 = cosY * x + sinY * z;
      let z1 = -sinY * x + cosY * z;

      let wx = x1 + obj.x, wy = y + obj.y, wz = z1 + obj.z;
      renderVertices.push({ proj: project(wx, wy, wz) });
    });

    obj.faces.forEach((face, fIdx) => {
      if (face.length < 3) return;
      let p0 = renderVertices[face[0]]?.proj;
      let p1 = renderVertices[face[1]]?.proj;
      let p2 = renderVertices[face[2]]?.proj;

      if (p0 && p1 && p2) {
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
        
        if (face.length === 4 && renderVertices[face[3]]?.proj) {
          let p3 = renderVertices[face[3]].proj;
          ctx.lineTo(p3.x, p3.y);
        }
        ctx.closePath();

        ctx.fillStyle = isSelected ? (fIdx % 2 === 0 ? obj.color : '#3388ff') : obj.color;
        ctx.globalAlpha = 0.85; ctx.fill();

        ctx.strokeStyle = isSelected ? '#ffffff' : '#000000';
        ctx.lineWidth = isSelected ? 1.5 : 0.5;
        ctx.globalAlpha = 1.0; ctx.stroke();
      }
    });

    if (isRigActive && isSelected) {
      const joints = [
        { pos: project(obj.x, obj.y + 0.8, obj.z) },
        { pos: project(obj.x, obj.y, obj.z) },
        { pos: project(obj.x, obj.y - 0.5, obj.z) }
      ];

      ctx.strokeStyle = '#34c759'; ctx.lineWidth = 3;
      if (joints[0].pos && joints[1].pos && joints[2].pos) {
        ctx.beginPath();
        ctx.moveTo(joints[0].pos.x, joints[0].pos.y);
        ctx.lineTo(joints[1].pos.x, joints[1].pos.y);
        ctx.lineTo(joints[2].pos.x, joints[2].pos.y);
        ctx.stroke();

        joints.forEach(j => {
          if (j.pos) {
            ctx.fillStyle = '#ffcc00';
            ctx.beginPath(); ctx.arc(j.pos.x, j.pos.y, 6, 0, Math.PI * 2); ctx.fill();
          }
        });
      }
    }
  }

  function drawScene() {
    ctx.fillStyle = bgDark ? '#121215' : '#e5e5ea';
    ctx.fillRect(0, 0, width, height);

    drawGrid();
    objects.forEach((obj, idx) => renderObject(obj, idx));
  }

  canvas.addEventListener('pointerdown', (e) => {
    isDragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    let dx = e.clientX - lastX;
    let dy = e.clientY - lastY;

    if (selectedIdx >= 0 && e.shiftKey) {
      let obj = objects[selectedIdx];
      if (currentMode === 'translate') {
        obj.x += dx * 0.01; obj.y -= dy * 0.01;
      } else if (currentMode === 'rotate') {
        obj.ry += dx * 0.02;
      }
    } else {
      yaw += dx * 0.006;
      pitch += dy * 0.006;
      pitch = Math.max(-1.4, Math.min(1.4, pitch));
    }

    lastX = e.clientX;
    lastY = e.clientY;
    drawScene();
  });

  canvas.addEventListener('pointerup', () => isDragging = false);

  function updateUI() {
    const root = document.getElementById('tree-root');
    root.innerHTML = '';

    if (objects.length === 0) {
      root.innerHTML = '<div style="color:#666;">No Objects</div>';
    } else {
      objects.forEach((o, i) => {
        const div = document.createElement('div');
        div.className = 'tree-item' + (i === selectedIdx ? ' selected' : '');
        div.innerText = (o.type === 'Light' ? '💡 ' : '📦 ') + o.name;
        div.onclick = () => { selectedIdx = i; updateUI(); };
        root.appendChild(div);
      });
    }

    updateTimeline();
    drawScene();
  }

  function triggerImgUpload() {
    document.getElementById('img-input').click();
  }

  document.getElementById('img-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file && selectedIdx >= 0) {
      objects[selectedIdx].color = '#34c759';
      showToast("Texture Applied!");
      drawScene();
    }
  });

  function addKeyframe() {
    if (selectedIdx < 0) return showToast("Select an object first!");
    let obj = objects[selectedIdx];
    keyframes = keyframes.filter(k => !(k.objIdx === selectedIdx && Math.abs(k.time - currentTime) < 0.1));
    keyframes.push({
      objIdx: selectedIdx, time: currentTime,
      x: obj.x, y: obj.y, z: obj.z, ry: obj.ry || 0
    });
    updateTimeline();
    showToast("Keyframe Added!");
  }

  function togglePlay() {
    isPlaying = !isPlaying;
    document.getElementById('tl-play-btn').innerText = isPlaying ? '⏸ Pause' : '▶ Play';
  }

  function applyAnimation() {
    objects.forEach((obj, idx) => {
      let objKFs = keyframes.filter(k => k.objIdx === idx).sort((a,b) => a.time - b.time);
      if (objKFs.length === 0) return;

      if (currentTime <= objKFs[0].time) {
        obj.x = objKFs[0].x; obj.y = objKFs[0].y; if (obj.ry !== undefined) obj.ry = objKFs[0].ry;
      } else if (currentTime >= objKFs[objKFs.length - 1].time) {
        let last = objKFs[objKFs.length - 1];
        obj.x = last.x; obj.y = last.y; if (obj.ry !== undefined) obj.ry = last.ry;
      } else {
        for (let i = 0; i < objKFs.length - 1; i++) {
          let k1 = objKFs[i], k2 = objKFs[i+1];
          if (currentTime >= k1.time && currentTime <= k2.time) {
            let t = (currentTime - k1.time) / (k2.time - k1.time);
            obj.x = k1.x + (k2.x - k1.x) * t;
            obj.y = k1.y + (k2.y - k1.y) * t;
            if (obj.ry !== undefined) obj.ry = k1.ry + (k2.ry - k1.ry) * t;
            break;
          }
        }
      }
    });
  }

  function updateTimeline() {
    const labels = document.getElementById('tl-track-labels');
    labels.innerHTML = '';
    objects.forEach((o, i) => {
      let d = document.createElement('div');
      d.className = 'track-label' + (i === selectedIdx ? ' active' : '');
      d.innerText = (i === selectedIdx ? '▶ ' : '   ') + o.name;
      d.onclick = () => { selectedIdx = i; updateUI(); };
      labels.appendChild(d);
    });
    drawTimeline();
  }

  function drawTimeline() {
    const tlCanvas = document.getElementById('tl-canvas');
    const container = document.getElementById('tl-canvas-container');
    const tw = tlCanvas.width = container.clientWidth;
    const th = tlCanvas.height = container.clientHeight;
    const tctx = tlCanvas.getContext('2d');

    tctx.fillStyle = '#101012';
    tctx.fillRect(0, 0, tw, th);

    objects.forEach((o, i) => {
      tctx.fillStyle = (i === selectedIdx) ? 'rgba(0,122,255,0.15)' : '#141417';
      tctx.fillRect(0, i * 32, tw, 32);
    });

    keyframes.forEach(k => {
      let x = (k.time / duration) * (tw - 20) + 10;
      let y = k.objIdx * 32 + 16;
      tctx.fillStyle = '#ffcc00';
      tctx.beginPath(); tctx.arc(x, y, 4, 0, Math.PI*2); tctx.fill();
    });

    let px = (currentTi
