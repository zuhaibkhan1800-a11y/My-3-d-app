<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Mobile Rig & Animator</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body, html { 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background-color: #121212; 
      font-family: system-ui, -apple-system, sans-serif; 
      color: #fff; 
    }
    #app-container { 
      display: flex; 
      flex-direction: column; 
      width: 100vw; 
      height: 100vh; 
      position: relative; 
    }
    #top-bar { 
      height: 52px; 
      background: #1f1f1f; 
      display: flex; 
      align-items: center; 
      padding: 0 8px; 
      gap: 6px; 
      overflow-x: auto; 
      white-space: nowrap; 
      border-bottom: 1px solid #333; 
      z-index: 1000; 
    }
    #top-bar::-webkit-scrollbar { display: none; }
    
    .btn { 
      background: #2c2c2e; 
      color: #fff; 
      border: 1px solid #444; 
      padding: 8px 12px; 
      border-radius: 6px; 
      font-size: 12px; 
      font-weight: 600; 
      cursor: pointer; 
      display: inline-flex; 
      align-items: center; 
      gap: 4px; 
      flex-shrink: 0; 
    }
    .btn:active, .btn.active { 
      background: #007aff !important; 
      border-color: #007aff !important; 
    }
    .btn-danger { background: #d32f2f; border-color: #d32f2f; }
    .btn-special { background: #5e5ce6; border-color: #5e5ce6; }
    .btn-success { background: #2e7d32; border-color: #2e7d32; }
    .btn-preset { background: #f57c00; border-color: #f57c00; }
    
    #viewport-container { 
      flex: 1; 
      position: relative; 
      width: 100%; 
      background: #121212; 
      overflow: hidden; 
    }
    #three-canvas { 
      width: 100%; 
      height: 100%; 
      display: block; 
      touch-action: none; 
    }
    
    #hierarchy-panel { 
      position: absolute; 
      top: 10px; 
      left: 10px; 
      width: 130px; 
      max-height: 160px; 
      background: rgba(25, 25, 25, 0.85); 
      border: 1px solid #444; 
      border-radius: 8px; 
      padding: 6px; 
      overflow-y: auto; 
      z-index: 500; 
      font-size: 11px; 
    }
    .tree-item { 
      padding: 4px 6px; 
      border-radius: 4px; 
      cursor: pointer; 
      margin-bottom: 2px; 
      background: #2a2a2a; 
      text-overflow: ellipsis; 
      overflow: hidden; 
      white-space: nowrap; 
    }
    .tree-item.selected { background: #007aff; }
    
    #timeline-container { 
      height: 120px; 
      background: #1a1a1a; 
      border-top: 1px solid #333; 
      display: flex; 
      flex-direction: column; 
      z-index: 1000; 
    }
    #timeline-controls { 
      height: 38px; 
      background: #242424; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding: 0 8px; 
      gap: 6px; 
      overflow-x: auto; 
    }
    #timeline-controls::-webkit-scrollbar { display: none; }
    .playback-group { display: flex; gap: 4px; flex-shrink: 0; }
    
    #timeline-slider-wrap { 
      flex: 1; 
      position: relative; 
      background: #151515; 
      touch-action: none; 
    }
    #timeline-canvas { width: 100%; height: 100%; display: block; }
    
    #toast { 
      position: absolute; 
      bottom: 130px; 
      left: 50%; 
      transform: translateX(-50%); 
      background: rgba(0,0,0,0.85); 
      color: #fff; 
      padding: 6px 14px; 
      border-radius: 20px; 
      font-size: 12px; 
      display: none; 
      z-index: 2000; 
      pointer-events: none; 
    }
  </style>

  <!-- High-Reliability CDNs -->
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="app-container">
  <div id="top-bar">
    <button class="btn" id="btn-add-cube">🧊 Cube</button>
    <button class="btn" id="btn-add-man">🧍 Character Mesh</button>
    <div style="width: 1px; height: 20px; background: #444;"></div>
    <button class="btn btn-special" id="btn-auto-rig">🦴 Auto-Rig Skeleton</button>
    <div style="width: 1px; height: 20px; background: #444;"></div>
    <button class="btn btn-danger" id="btn-delete">🗑 Delete</button>
  </div>

  <div id="viewport-container">
    <canvas id="three-canvas"></canvas>
    
    <div id="hierarchy-panel">
      <div style="font-weight: bold; margin-bottom: 4px; border-bottom: 1px solid #555;">Scene Objects</div>
      <div id="tree-root"></div>
    </div>
    
    <div id="toast">Ready</div>
  </div>

  <div id="timeline-container">
    <div id="timeline-controls">
      <div class="playback-group">
        <button class="btn" id="btn-play">▶ Play</button>
        <button class="btn" id="btn-pause">⏸ Pause</button>
        <button class="btn" id="btn-stop">⏹ Stop</button>
      </div>
      <span id="time-display" style="font-size: 11px; font-family: monospace;">0.00s / 5.00s</span>
      <div class="playback-group">
        <button class="btn btn-preset" id="preset-walk">🚶 Walk Animation</button>
        <button class="btn btn-preset" id="preset-jump">🦘 Jump Animation</button>
      </div>
      <div class="playback-group">
        <button class="btn btn-success" id="btn-add-key">+ Key</button>
      </div>
    </div>
    <div id="timeline-slider-wrap">
      <canvas id="timeline-canvas"></canvas>
    </div>
  </div>
</div>

<script>
  let scene, camera, renderer, orbitControls;
  let objectsList = [], selectedObject = null;
  let currentTime = 0, duration = 5.0, isPlaying = false, keyframes = {};
  let characterMesh = null, skeletonBones = [];

  const canvas3D = document.getElementById('three-canvas');
  const treeRoot = document.getElementById('tree-root');
  const toastEl = document.getElementById('toast');
  const timeDisplay = document.getElementById('time-display');
  const tlCanvas = document.getElementById('timeline-canvas');
  const tlCtx = tlCanvas.getContext('2d');

  function showToast(msg) {
    toastEl.innerText = msg;
    toastEl.style.display = 'block';
    setTimeout(() => { toastEl.style.display = 'none'; }, 2000);
  }

  function init() {
    const container = document.getElementById('viewport-container');
    
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x121212);

    camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 2, 4);

    renderer = new THREE.WebGLRenderer({ canvas: canvas3D, antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
    orbitControls.enableDamping = true;
    orbitControls.target.set(0, 1, 0);

    const light1 = new THREE.DirectionalLight(0xffffff, 1);
    light1.position.set(5, 10, 7);
    scene.add(light1);
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));

    const grid = new THREE.GridHelper(10, 10, 0x444444, 0x222222);
    scene.add(grid);

    setupEvents();
    window.addEventListener('resize', onResize);
    animate();
    showToast('Engine Ready');
  }

  function selectObject(obj) {
    selectedObject = obj;
    updateHierarchyUI();
    drawTimeline();
    if(obj) showToast('Selected: ' + obj.name);
  }

  function addObject(obj, name) {
    obj.name = name || 'Object_' + (objectsList.length + 1);
    scene.add(obj);
    objectsList.push(obj);
    keyframes[obj.uuid] = [];
    selectObject(obj);
  }

  function setupEvents() {
    // Add Cube
    document.getElementById('btn-add-cube').onclick = () => {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(0.8, 0.8, 0.8),
        new THREE.MeshStandardMaterial({ color: 0x007aff })
      );
      mesh.position.set(0, 0.4, 0);
      addObject(mesh, 'Cube');
    };

    // Add Humanoid Mesh
    document.getElementById('btn-add-man').onclick = () => {
      const group = new THREE.Group();
      
      const bodyGeo = new THREE.CylinderGeometry(0.3, 0.2, 1.2, 16);
      const mat = new THREE.MeshStandardMaterial({ color: 0xe5e5ea });
      const body = new THREE.Mesh(bodyGeo, mat);
      body.position.y = 1.0;
      group.add(body);

      const headGeo = new THREE.SphereGeometry(0.25, 16, 16);
      const head = new THREE.Mesh(headGeo, mat);
      head.position.y = 1.8;
      group.add(head);

      characterMesh = group;
      addObject(group, 'Character Body');
    };

    // Auto Rig Skeleton
    document.getElementById('btn-auto-rig').onclick = () => {
      if(!characterMesh) {
        showToast('First add "Character Mesh"');
        return;
      }

      const rootBone = new THREE.Bone();
      rootBone.name = "Hips";
      rootBone.position.set(0, 0.9, 0);

      const chestBone = new THREE.Bone();
      chestBone.name = "Chest";
      chestBone.position.set(0, 0.6, 0);
      rootBone.add(chestBone);

      const leftLeg = new THREE.Bone();
      leftLeg.name = "L_Leg";
      leftLeg.position.set(0.2, -0.4, 0);
      rootBone.add(leftLeg);

      const rightLeg = new THREE.Bone();
      rightLeg.name = "R_Leg";
      rightLeg.position.set(-0.2, -0.4, 0);
      rootBone.add(rightLeg);

      const skeleton = new THREE.Skeleton([rootBone, chestBone, leftLeg, rightLeg]);
      const helper = new THREE.SkeletonHelper(rootBone);
      
      scene.add(rootBone);
      scene.add(helper);

      skeletonBones = [rootBone, chestBone, leftLeg, rightLeg];
      skeletonBones.forEach(b => { keyframes[b.uuid] = []; });

      showToast('Full Body Auto-Rig Applied!');
      selectObject(rootBone);
    };

    // Delete
    document.getElementById('btn-delete').onclick = () => {
      if(selectedObject) {
        scene.remove(selectedObject);
        objectsList = objectsList.filter(o => o !== selectedObject);
        selectObject(null);
        showToast('Deleted');
      }
    };

    // Animation Controls
    document.getElementById('btn-play').onclick = () => isPlaying = true;
    document.getElementById('btn-pause').onclick = () => isPlaying = false;
    document.getElementById('btn-stop').onclick = () => { isPlaying = false; currentTime = 0; drawTimeline(); };

    document.getElementById('btn-add-key').onclick = () => {
      if(!selectedObject) return showToast('Select an Object first!');
      const list = keyframes[selectedObject.uuid] || [];
      list.push({
        time: parseFloat(currentTime.toFixed(2)),
        pos: selectedObject.position.clone(),
        rot: selectedObject.rotation.clone()
      });
      keyframes[selectedObject.uuid] = list;
      drawTimeline();
      showToast('Keyframe added at ' + currentTime.toFixed(1) + 's');
    };

    // Preset Walk
    document.getElementById('preset-walk').onclick = () => {
      if(skeletonBones.length === 0) return showToast('Click "Auto-Rig Skeleton" first!');
      
      const leftLeg = skeletonBones[2];
      const rightLeg = skeletonBones[3];

      keyframes[leftLeg.uuid] = [
        { time: 0, pos: leftLeg.position.clone(), rot: new THREE.Euler(0.5, 0, 0) },
        { time: 2.5, pos: leftLeg.position.clone(), rot: new THREE.Euler(-0.5, 0, 0) },
        { time: 5.0, pos: leftLeg.position.clone(), rot: new THREE.Euler(0.5, 0, 0) }
      ];

      keyframes[rightLeg.uuid] = [
        { time: 0, pos: rightLeg.position.clone(), rot: new THREE.Euler(-0.5, 0, 0) },
        { time: 2.5, pos: rightLeg.position.clone(), rot: new THREE.Euler(0.5, 0, 0) },
        { time: 5.0, pos: rightLeg.position.clone(), rot: new THREE.Euler(-0.5, 0, 0) }
      ];

      showToast('Walk Preset Loaded!');
      drawTimeline();
    };

    // Preset Jump
    document.getElementById('preset-jump').onclick = () => {
      if(!characterMesh) return showToast('Add Character Body first!');
      
      keyframes[characterMesh.uuid] = [
        { time: 0, pos: new THREE.Vector3(0, 0, 0), rot: new THREE.Euler(0,0,0) },
        { time: 2.5, pos: new THREE.Vector3(0, 1.2, 0), rot: new THREE.Euler(0,0,0) },
        { time: 5.0, pos: new THREE.Vector3(0, 0, 0), rot: new THREE.Euler(0,0,0) }
      ];

      showToast('Jump Preset Loaded!');
      drawTimeline();
    };

    setupScrubber();
  }

  function updateHierarchyUI() {
    treeRoot.innerHTML = '';
    objectsList.forEach(obj => {
      const item = document.createElement('div');
      item.className = 'tree-item' + (selectedObject === obj ? ' selected' : '');
      item.innerText = obj.name;
      item.onclick = (e) => { e.stopPropagation(); selectObject(obj); };
      treeRoot.appendChild(item);
    });

    skeletonBones.forEach(bone => {
      const item = document.createElement('div');
      item.className = 'tree-item' + (selectedObject === bone ? ' selected' : '');
      item.innerText = '🦴 ' + bone.name;
      item.onclick = (e) => { e.stopPropagation(); selectObject(bone); };
      treeRoot.appendChild(item);
    });
  }

  function setupScrubber() {
    let active = false;
    function updateScrub(e) {
      const rect = tlCanvas.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      currentTime = Math.max(0, Math.min(duration, (x / rect.width) * duration));
      updateAnimations();
      drawTimeline();
    }

    const wrap = document.getElementById('timeline-slider-wrap');
    wrap.addEventListener('mousedown', (e) => { active = true; updateScrub(e); });
    window.addEventListener('mousemove', (e) => { if(active) updateScrub(e); });
    window.addEventListener('mouseup', () => active = false);

    wrap.addEventListener('touchstart', (e) => { active = true; updateScrub(e); }, {passive: true});
    window.addEventListener('touchmove', (e) => { if(active) updateScrub(e); }, {passive: true});
    window.addEventListener('touchend', () => active = false);
  }

  function updateAnimations() {
    const all = [...objectsList, ...skeletonBones];
    all.forEach(obj => {
      const list = keyframes[obj.uuid];
      if(list && list.length > 1) {
        for(let i = 0; i < list.length - 1; i++) {
          const k1 = list[i], k2 = list[i+1];
          if(currentTime >= k1.time && currentTime <= k2.time) {
            const factor = (currentTime - k1.time) / (k2.time - k1.time);
            obj.position.lerpVectors(k1.pos, k2.pos, factor);
            obj.rotation.x = THREE.MathUtils.lerp(k1.rot.x, k2.rot.x, factor);
            obj.rotation.y = THREE.MathUtils.lerp(k1.rot.y, k2.rot.y, factor);
            obj.rotation.z = THREE.MathUtils.lerp(k1.rot.z, k2.rot.z, factor);
            break;
          }
        }
      }
    });
  }

  function drawTimeline() {
    const w = tlCanvas.width = document.getElementById('timeline-slider-wrap').clientWidth;
    const h = tlCanvas.height = 80;
    tlCtx.fillStyle = '#151515'; tlCtx.fillRect(0, 0, w, h);

    tlCtx.strokeStyle = '#333'; tlCtx.fillStyle = '#888'; tlCtx.font = '10px sans-serif';
    for(let s = 0; s <= duration; s += 1) {
      let x = (s / duration) * (w - 20) + 10;
      tlCtx.beginPath(); tlCtx.moveTo(x, 0); tlCtx.lineTo(x, 10); tlCtx.stroke();
      tlCtx.fillText(s + 's', x - 5, 22);
    }

    if(selectedObject && keyframes[selectedObject.uuid]) {
      keyframes[selectedObject.uuid].forEach(k => {
        let kx = (k.time / duration) * (w - 20) + 10;
        tlCtx.fillStyle = '#ffcc00';
        tlCtx.beginPath(); tlCtx.arc(kx, 45, 5, 0, Math.PI * 2); tlCtx.fill();
      });
    }

    let px = (currentTime / duration) * (w - 20) + 10;
    tlCtx.strokeStyle = '#ff3b30'; tlCtx.lineWidth = 2;
    tlCtx.beginPath(); tlCtx.moveTo(px, 0); tlCtx.lineTo(px, h); tlCtx.stroke();
    timeDisplay.innerText = currentTime.toFixed(2) + 's / ' + duration.toFixed(2) + 's';
  }

  function onResize() {
    const container = document.getElementById('viewport-container');
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
    drawTimeline();
  }

  function animate() {
    requestAnimationFrame(animate);
    if(isPlaying) {
      currentTime += 0.016;
      if(currentTime > duration) currentTime = 0;
      updateAnimations();
      drawTimeline();
    }
    orbitControls.update();
    renderer.render(scene, camera);
  }

  window.onload = init;
</script>
</body>
</html>
