<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Prisma 3D Auto-Rig Engine (True IK Limb Solver)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100vw; height: 100dvh; overflow: hidden; background: #1b1b20; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
    #app { display: flex; flex-direction: column; width: 100%; height: 100dvh; position: relative; }

    #top-bar { height: 44px; background: #222228; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid #33333d; z-index: 10; }
    .brand-title { font-size: 11px; font-weight: bold; color: #007aff; letter-spacing: 0.5px; }
    .icon-btn { background: none; border: none; color: #eee; font-size: 13px; cursor: pointer; padding: 6px; }

    #viewport { flex: 1; position: relative; background: #2d2d35; overflow: hidden; }
    #canvas3d { width: 100%; height: 100%; display: block; touch-action: none; }

    #rig-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 100; pointer-events: none; }
    #center-guide { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: rgba(0, 122, 255, 0.8); transform: translateX(-50%); pointer-events: none; }

    #joints-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    .joint-node { position: absolute; width: 24px; height: 24px; border-radius: 50%; border: 2px solid #ffffff; background: #ff9500; transform: translate(-50%, -50%); cursor: pointer; touch-action: none; z-index: 101; box-shadow: 0 0 10px rgba(0,0,0,0.8); pointer-events: auto; }
    .joint-node.head { background: #30d158; }
    .joint-node.hip { background: #ff3b30; }

    #rig-tools-bar { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(34, 34, 40, 0.95); padding: 8px 16px; border-radius: 30px; border: 1px solid #444450; backdrop-filter: blur(8px); z-index: 102; pointer-events: auto; }
    .rig-btn { background: #32323c; border: none; color: #fff; padding: 8px 18px; border-radius: 20px; font-size: 11px; font-weight: bold; cursor: pointer; }
    .rig-btn.apply { background: #30d158; color: #000; }

    #timeline-panel { height: 85px; background: #1c1c22; border-top: 1px solid #33333d; display: flex; flex-direction: column; flex-shrink: 0; z-index: 10; }
    #tl-header { height: 24px; background: #25252d; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 10px; color: #aaa; }
    .tl-btn.play { background: #007aff; border: none; color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 3px; cursor: pointer; }
    .tl-btn.keyframe { background: #ffcc00; border: none; color: #000; font-size: 10px; padding: 2px 8px; border-radius: 3px; font-weight: bold; cursor: pointer; }

    #tl-canvas-wrap { flex: 1; position: relative; background: #121216; overflow: hidden; }
    #tl-canvas { width: 100%; height: 100%; display: block; }

    #bottom-bar { height: 54px; background: #222228; border-top: 1px solid #33333d; display: flex; align-items: center; justify-content: space-between; padding: 0 4px; z-index: 20; }
    .dock-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #aaa; font-size: 10px; cursor: pointer; background: none; border: none; width: 20%; height: 100%; }
    .dock-btn.active, .dock-btn:active { color: #007aff; }
    .dock-btn span { font-size: 18px; }

    #toast { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 11px; display: none; z-index: 1000; border: 1px solid #444; pointer-events: none; }
    input[type="file"] { display: none !important; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
</head>
<body>

<div id="app">
  <div id="top-bar">
    <button class="icon-btn" onclick="resetCamera()">🏠 Center</button>
    <div class="brand-title">PRISMA 3D AUTO-RIG ENGINE</div>
    <button class="icon-btn" onclick="triggerImport()">📂 Import</button>
  </div>

  <div id="viewport">
    <canvas id="canvas3d"></canvas>

    <div id="rig-overlay">
      <div id="center-guide"></div>
      <div id="joints-container"></div>
      <div id="rig-tools-bar">
        <button class="rig-btn" onclick="closeRigOverlay()">Cancel</button>
        <button class="rig-btn apply" onclick="applyAutoRigging()">✓ Apply Rig</button>
      </div>
    </div>

    <div id="toast">Ready</div>
  </div>

  <div id="timeline-panel">
    <div id="tl-header">
      <button class="tl-btn play" onclick="togglePlay()">▶ Play</button>
      <span id="time-display">00:00.00 / 05:00</span>
      <button class="tl-btn keyframe" onclick="addKeyframe()">🔑 Keyframe</button>
    </div>
    <div id="tl-canvas-wrap" onclick="seekTimeline(event)">
      <canvas id="tl-canvas"></canvas>
    </div>
  </div>

  <div id="bottom-bar">
    <button class="dock-btn active" id="btn-rotate" onclick="setMode('rotate')"><span>🔄</span>Rotate</button>
    <button class="dock-btn" id="btn-move" onclick="setMode('translate')"><span>✢</span>Move</button>
    <button class="dock-btn" onclick="openRigOverlay()"><span>🦴</span>Auto Rig</button>
    <button class="dock-btn" onclick="triggerImport()"><span>📂</span>Import</button>
    <button class="dock-btn" onclick="deleteSelected()"><span>🗑</span>Delete</button>
  </div>
</div>

<input type="file" id="file-input" accept=".obj,.gltf,.glb">

<script>
  let scene, camera, renderer, orbitControls, transformControls;
  let activeModel = null;
  let characterGroup = null;
  let isPlaying = false, currentTime = 0, duration = 5.0;

  let bonesMap = {};
  let boneHelpers = [];
  let selectedBone = null;
  let activeSkeleton = null;

  const defaultJoints = [
    { id: 'hips', name: 'Hips', x: 50, y: 52, parent: null, class: 'hip' },
    { id: 'spine', name: 'Spine', x: 50, y: 38, parent: 'hips', class: '' },
    { id: 'neck', name: 'Neck', x: 50, y: 24, parent: 'spine', class: '' },
    { id: 'head', name: 'Head', x: 50, y: 16, parent: 'neck', class: 'head' },
    { id: 'shoulder_r', name: 'R Shoulder', x: 38, y: 28, parent: 'spine', class: '', pair: 'shoulder_l' },
    { id: 'elbow_r', name: 'R Elbow', x: 25, y: 28, parent: 'shoulder_r', class: '', pair: 'elbow_l' },
    { id: 'wrist_r', name: 'R Wrist', x: 12, y: 28, parent: 'elbow_r', class: '', pair: 'wrist_l' },
    { id: 'shoulder_l', name: 'L Shoulder', x: 62, y: 28, parent: 'spine', class: '', pair: 'shoulder_r' },
    { id: 'elbow_l', name: 'L Elbow', x: 75, y: 28, parent: 'shoulder_l', class: '', pair: 'elbow_r' },
    { id: 'wrist_l', name: 'L Wrist', x: 88, y: 28, parent: 'elbow_l', class: '', pair: 'wrist_r' },
    { id: 'knee_r', name: 'R Knee', x: 42, y: 72, parent: 'hips', class: '', pair: 'knee_l' },
    { id: 'ankle_r', name: 'R Ankle', x: 42, y: 90, parent: 'knee_r', class: '', pair: 'ankle_l' },
    { id: 'knee_l', name: 'L Knee', x: 58, y: 72, parent: 'hips', class: '', pair: 'knee_r' },
    { id: 'ankle_l', name: 'L Ankle', x: 58, y: 90, parent: 'knee_l', class: '', pair: 'ankle_r' }
  ];

  function showToast(msg) {
    const t = document.getElementById('toast');
    if (!t) return;
    t.innerText = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 2000);
  }

  function init3DEngine() {
    const container = document.getElementById('viewport');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2d2d35);

    camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 1.2, 3.2);

    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));

    orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
    orbitControls.enableDamping = true;
    orbitControls.target.set(0, 1.0, 0);

    transformControls = new THREE.TransformControls(camera, renderer.domElement);
    transformControls.size = 0.55; 
    transformControls.setMode('rotate');
    transformControls.space = 'local';

    transformControls.addEventListener('dragging-changed', (e) => { 
      orbitControls.enabled = !e.value; 
    });

    transformControls.addEventListener('objectChange', () => {
      if (!selectedBone) return;

      // 1. Lock Elbow & Knee from translation
      if (transformControls.getMode() === 'translate' && (selectedBone.name.includes('elbow') || selectedBone.name.includes('knee'))) {
        if (selectedBone.userData.restPosition) {
          selectedBone.position.copy(selectedBone.userData.restPosition);
        }
      }

      // 2. True IK Solver for Limbs when moving Wrist or Ankle
      if (transformControls.getMode() === 'translate') {
        if (selectedBone.name === 'wrist_r') solveIK('shoulder_r', 'elbow_r', 'wrist_r');
        else if (selectedBone.name === 'wrist_l') solveIK('shoulder_l', 'elbow_l', 'wrist_l');
        else if (selectedBone.name === 'ankle_r') solveIK('hips', 'knee_r', 'ankle_r');
        else if (selectedBone.name === 'ankle_l') solveIK('hips', 'knee_l', 'ankle_l');
      }

      if (activeSkeleton) {
        activeSkeleton.update();
      }
    });

    scene.add(transformControls);

    scene.add(new THREE.AmbientLight(0xffffff, 1.3));
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x555566, 1.1);
    hemiLight.position.set(0, 20, 0);
    scene.add(hemiLight);

    const mainDirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    mainDirLight.position.set(5, 10, 7);
    scene.add(mainDirLight);

    const gridHelper = new THREE.GridHelper(10, 20, 0x5a5a68, 0x3d3d48);
    gridHelper.position.y = -0.01;
    scene.add(gridHelper);

    characterGroup = new THREE.Group();
    scene.add(characterGroup);

    renderer.domElement.addEventListener('pointerdown', onSceneClick);

    showToast("Engine Ready");
    startRenderLoop();
  }

  // Lightweight Analytical 2-Bone IK Solver (Prisma 3D behavior)
  function solveIK(rootName, midName, endName) {
    const root = bonesMap[rootName];
    const mid = bonesMap[midName];
    const end = bonesMap[endName];
    if (!root || !mid || !end) return;

    characterGroup.updateMatrixWorld(true);

    const pRoot = new THREE.Vector3();
    const pMid = new THREE.Vector3();
    const pEnd = new THREE.Vector3();

    root.getWorldPosition(pRoot);
    mid.getWorldPosition(pMid);
    end.getWorldPosition(pEnd);

    const l1 = pRoot.distanceTo(pMid);
    const l2 = pMid.distanceTo(pEnd);
    const maxLen = l1 + l2;

    const target = pEnd.clone(); // End bone holds current target position from transform controls
    const dir = target.clone().sub(pRoot);
    let len = dir.length();

    if (len > maxLen * 0.999) {
      dir.normalize();
      target.copy(pRoot).add(dir.multiplyScalar(maxLen * 0.999));
      len = maxLen * 0.999;
    }

    // Law of cosines for 2-bone angle
    const cosAngle = (l1 * l1 + len * len - l2 * l2) / (2 * l1 * len);
    const angle = Math.acos(Math.max(-1, Math.min(1, cosAngle)));

    // Rotate root towards target with elbow bend orientation
    root.lookAt(target);
    
    // Maintain bone lengths strictly
    mid.position.set(0, 0, l1);
    end.position.set(0, 0, l2);
  }

  function onSceneClick(event) {
    if (transformControls.dragging || transformControls.hovered) return;
    if (boneHelpers.length === 0) return;

    const rect = renderer.domElement.getBoundingClientRect();
    const mouse = new THREE.Vector2(
      ((event.clientX - rect.left) / rect.width) * 2 - 1,
      -((event.clientY - rect.top) / rect.height) * 2 + 1
    );

    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(mouse, camera);

    const intersects = raycaster.intersectObjects(boneHelpers, false);

    if (intersects.length > 0) {
      selectBone(intersects[0].object.userData.bone);
    }
  }

  function selectBone(bone) {
    selectedBone = bone;
    boneHelpers.forEach(h => h.material.color.setHex(0x007aff));

    if (bone.userData.helper) {
      bone.userData.helper.material.color.setHex(0xff9500);
    }

    transformControls.detach();
    transformControls.attach(bone);
    showToast(`Joint: ${bone.name}`);
  }

  function triggerImport() { document.getElementById('file-input').click(); }

  document.getElementById('file-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    showToast("Loading 3D Model...");

    const fileName = file.name.toLowerCase();
    const reader = new FileReader();

    if (fileName.endsWith('.obj')) {
      reader.onload = (evt) => {
        try {
          const loader = new THREE.OBJLoader();
          loadModelToScene(loader.parse(evt.target.result));
        } catch (err) { showToast("OBJ Load Error!"); }
      };
      reader.readAsText(file);
    } else if (fileName.endsWith('.gltf') || fileName.endsWith('.glb')) {
      reader.onload = (evt) => {
        try {
          const loader = new THREE.GLTFLoader();
          loader.parse(evt.target.result, '', (gltf) => loadModelToScene(gltf.scene), () => showToast("GLTF Error!"));
        } catch (err) { showToast("GLTF Load Error!"); }
      };
      reader.readAsArrayBuffer(file);
    }
  });

  function loadModelToScene(loadedObject) {
    if (activeModel) characterGroup.remove(activeModel);
    clearRig();

    activeModel = loadedObject;

    characterGroup.position.set(0, 0, 0);
    characterGroup.rotation.set(0, 0, 0);
    characterGroup.scale.set(1, 1, 1);

    const box = new THREE.Box3().setFromObject(activeModel);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());

    activeModel.position.sub(center); 
    activeModel.position.y += size.y / 2;

    const maxDim = Math.max(size.x, size.y, size.z);
    if (maxDim > 0) {
      const scale = 2.0 / maxDim;
      activeModel.scale.set(scale, scale, scale);
    }

    characterGroup.add(activeModel);
    transformControls.detach();

    showToast("Model Loaded! Tap 'Auto Rig'");
  }

  function clearRig() {
    transformControls.detach();
    boneHelpers.forEach(h => scene.remove(h));

    bonesMap = {};
    boneHelpers = [];
    selectedBone = null;
    activeSkeleton = null;
  }

  function openRigOverlay() {
    if (!activeModel) { showToast("Import a 3D Model First!"); return; }

    resetCamera();

    const overlay = document.getElementById('rig-overlay');
    const container = document.getElementById('joints-container');
    container.innerHTML = '';
    overlay.style.display = 'block';

    defaultJoints.forEach(j => {
      const node = document.createElement('div');
      node.className = `joint-node ${j.class}`;
      node.style.left = `${j.x}%`;
      node.style.top = `${j.y}%`;
      node.dataset.id = j.id;
      if (j.pair) node.dataset.pair = j.pair;

      makeNodeDraggable(node);
      container.appendChild(node);
    });

    showToast("Align Joints Front View");
  }

  function makeNodeDraggable(elm) {
    let active = false, initialX, initialY;

    elm.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      active = true;
      initialX = e.clientX - elm.offsetLeft;
      initialY = e.clientY - elm.offsetTop;
      orbitControls.enabled = false; 
    });

    window.addEventListener('pointermove', (e) => {
      if (active) {
        e.preventDefault();
        const container = document.getElementById('joints-container');
        const cWidth = container.clientWidth;

        let newLeft = e.clientX - initialX;
        let newTop = e.clientY - initialY;

        elm.style.left = newLeft + 'px';
        elm.style.top = newTop + 'px';

        const pairId = elm.dataset.pair;
        if (pairId) {
          const pairNode = container.querySelector(`[data-id="${pairId}"]`);
          if (pairNode) {
            const centerX = cWidth / 2;
            const distFromCenter = newLeft - centerX;
            const mirroredLeft = centerX - distFromCenter;

            pairNode.style.left = mirroredLeft + 'px';
            pairNode.style.top = newTop + 'px';
          }
        }
      }
    });

    window.addEventListener('pointerup', () => { 
      if(active) {
        active = false; 
        orbitControls.enabled = true;
      }
    });
  }

  function closeRigOverlay() {
    document.getElementById('rig-overlay').style.display = 'none';
    orbitControls.enabled = true;
  }

  function applyAutoRigging() {
    if (!activeModel) { closeRigOverlay(); return; }

    clearRig();

    const container = document.getElementById('joints-container');
    const nodes = container.querySelectorAll('.joint-node');
    const rect = container.getBoundingClientRect();

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const calculatedWorldPositions = {};

    const modelBox = new THREE.Box3().setFromObject(activeModel);
    const modelCenterZ = modelBox.getCenter(new THREE.Vector3()).z;

    nodes.forEach(node => {
      const id = node.dataset.id;
      const nodeRect = node.getBoundingClientRect();
      const x = nodeRect.left + nodeRect.width / 2;
      const y = nodeRect.top + nodeRect.height / 2;

      mouse.x = ((x - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((y - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);

      let targetPos = new THREE.Vector3();
      const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -modelCenterZ);
      raycaster.ray.intersectPlane(plane, targetPos);
      
      targetPos.z = modelCenterZ;
      calculatedWorldPositions[id] = targetPos;
    });

    // 1. Build Bones Hierarchy
    const bonesList = [];
    const boneIndexMap = {};

    defaultJoints.forEach((j, index) => {
      const bone = new THREE.Bone();
      bone.name = j.id;
      bonesMap[j.id] = bone;
      bonesList.push(bone);
      boneIndexMap[j.id] = index;
    });

    defaultJoints.forEach(j => {
      const bone = bonesMap[j.id];
      const worldPos = calculatedWorldPositions[j.id];

      if (j.parent && bonesMap[j.parent]) {
        bonesMap[j.parent].add(bone);
        const parentWorldPos = calculatedWorldPositions[j.parent];
        const offset = worldPos.clone().sub(parentWorldPos);
        bone.position.copy(offset);
        bone.userData.restPosition = offset.clone();
      } else {
        characterGroup.add(bone);
        bone.position.copy(worldPos);
        bone.userData.restPosition = worldPos.clone();
      }
    });

    characterGroup.updateMatrixWorld(true);
    activeSkeleton = new THREE.Skeleton(bonesList);

    // 2. SkinnedMesh Conversion with Dual-Bone Weights
    const meshesToSkin = [];
    activeModel.traverse(child => {
      if (child.isMesh && child.geometry) {
        meshesToSkin.push(child);
      }
    });

    meshesToSkin.forEach(oldMesh => {
      oldMesh.updateMatrixWorld(true);

      const geometry = oldMesh.geometry.clone();
      const posAttr = geometry.attributes.position;
      const vertexCount = posAttr.count;

      const skinIndices = new Uint16Array(vertexCount * 4);
      const skinWeights = new Float32Array(vertexCount * 4);
      const vWorld = new THREE.Vector3();

      for (let i = 0; i < vertexCount; i++) {
        vWorld.set(posAttr.getX(i), posAttr.getY(i), posAttr.getZ(i));
        vWorld.applyMatrix4(oldMesh.matrixWorld);

        let distList = [];
        defaultJoints.forEach(j => {
          const d = vWorld.distanceTo(calculatedWorldPositions[j.id]);
          distList.push({ id: j.id, dist: d, idx: boneIndexMap[j.id] });
        });

        distList.sort((a, b) => a.dist - b.dist);

        const primary = distList[0];
        const secondary = distList[1];

        const totalDist = primary.dist + secondary.dist;
        const w1 = totalDist > 0 ? 1.0 - (primary.dist / totalDist) : 1.0;
        const w2 = 1.0 - w1;

        skinIndices[i * 4] = primary.idx;
        skinIndices[i * 4 + 1] = secondary.idx;
        skinIndices[i * 4 + 2] = 0;
        skinIndices[i * 4 + 3] = 0;

        skinWeights[i * 4] = w1;
        skinWeights[i * 4 + 1] = w2;
        skinWeights[i * 4 + 2] = 0.0;
        skinWeights[i * 4 + 3] = 0.0;
      }

      geometry.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(skinIndices, 4));
      geometry.setAttribute('skinWeight', new THREE.Float32BufferAttribute(skinWeights, 4));

      const newMaterial = oldMesh.material.clone();
      newMaterial.skinning = true;

      const skinnedMesh = new THREE.SkinnedMesh(geometry, newMaterial);
      skinnedMesh.bind(activeSkeleton, oldMesh.matrixWorld);

      if (oldMesh.parent) {
        oldMesh.parent.add(skinnedMesh);
        oldMesh.parent.remove(oldMesh);
      }
    });

    // 3. Render Joint Spheres Only
    defaultJoints.forEach(j => {
      const bone = bonesMap[j.id];

      const sphereGeo = new THREE.SphereGeometry(0.035, 16, 16);
      const sphereMat = new THREE.MeshBasicMaterial({ color: 0x007aff, depthTest: false });
      const handle = new THREE.Mesh(sphereGeo, sphereMat);
      handle.renderOrder = 999;
      handle.userData = { bone: bone };

      bone.add(handle);
      bone.userData.helper = handle;
      boneHelpers.push(handle);
    });

    closeRigOverlay();
    if (bonesList.length > 0) selectBone(bonesList[0]);

    setMode('rotate');
    showToast("Rigging Done! True IK Active");
  }

  function startRenderLoop() {
    requestAnimationFrame(startRenderLoop);
    orbitControls.update();
    renderer.render(scene, camera);
    drawTimelineCanvas();
  }

  function drawTimelineCanvas() {
    const cvs = document.getElementById('tl-canvas');
    const wrap = document.getElementById('tl-canvas-wrap');
    if (!cvs || !wrap) return;

    cvs.width = wrap.clientWidth; cvs.height = wrap.clientHeight;
    const ctx = cvs.getContext('2d');
    ctx.fillStyle = '#121216'; ctx.fillRect(0, 0, cvs.width, cvs.height);

    const px = (currentTime / duration) * cvs.width;
    ctx.strokeStyle = '#007aff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, cvs.height); ctx.stroke();
  }

  function resetCamera() { camera.position.set(0, 1.2, 3.2); orbitControls.target.set(0, 1.0, 0); }
  function togglePlay() { isPlaying = !isPlaying; }

  function setMode(m) { 
    if (transformControls) {
      transformControls.setMode(m);
      transformControls.space = 'local';
    }
    document.getElementById('btn-rotate').classList.toggle('active', m === 'rotate');
    document.getElementById('btn-move').classList.toggle('active', m === 'translate');
    showToast(`Mode: ${m.toUpperCase()}`);
  }

  function deleteSelected() { 
    if (activeModel) { 
      characterGroup.remove(activeModel); 
      activeModel = null; 
      clearRig();
      showToast("Model Deleted!");
    }
  }
  function addKeyframe() { showToast("Keyframe Added!"); }
  function seekTimeline(e) { showToast("Timeline Seeked"); }

  window.addEventListener('load', init3DEngine);
</script>
</body>
</html>
