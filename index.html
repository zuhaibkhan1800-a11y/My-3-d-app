<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Prisma 3D Auto-Rig Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100vw; height: 100dvh; overflow: hidden; background: #121215; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
    #app { display: flex; flex-direction: column; width: 100%; height: 100dvh; position: relative; }

    #top-bar { height: 44px; background: #18181c; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid #2a2a32; z-index: 10; }
    .icon-btn { background: none; border: none; color: #eee; font-size: 14px; cursor: pointer; padding: 6px; }

    #viewport { flex: 1; position: relative; background: #18181c; overflow: hidden; }
    #canvas3d { width: 100%; height: 100%; display: block; touch-action: none; }

    #rig-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.45); display: none; z-index: 100; touch-action: none;
    }
    #center-guide { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.7); transform: translateX(-50%); pointer-events: none; }

    #joints-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: auto; }
    .joint-node {
      position: absolute; width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid #ffffff; background: #ff9500;
      transform: translate(-50%, -50%); cursor: pointer; touch-action: none; z-index: 101;
      box-shadow: 0 0 10px rgba(0,0,0,0.8);
    }
    .joint-node.head { background: #30d158; }
    .joint-node.hip { background: #ff3b30; }

    #rig-tools-bar {
      position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; background: rgba(24, 24, 28, 0.95); padding: 8px 16px;
      border-radius: 30px; border: 1px solid #3d3d45; backdrop-filter: blur(8px); z-index: 102;
    }
    .rig-btn { background: #2c2c35; border: none; color: #fff; padding: 8px 18px; border-radius: 20px; font-size: 11px; font-weight: bold; cursor: pointer; }
    .rig-btn.apply { background: #30d158; color: #000; }

    #timeline-panel { height: 85px; background: #141417; border-top: 1px solid #28282e; display: flex; flex-direction: column; flex-shrink: 0; z-index: 10; }
    #tl-header { height: 24px; background: #1c1c20; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 10px; color: #aaa; }
    #tl-canvas-wrap { flex: 1; position: relative; background: #0c0c0e; overflow: hidden; }
    #tl-canvas { width: 100%; height: 100%; display: block; }

    #bottom-bar { height: 54px; background: #18181a; border-top: 1px solid #28282e; display: flex; align-items: center; justify-content: space-around; padding: 0 4px; z-index: 20; }
    .dock-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #aaa; font-size: 10px; cursor: pointer; background: none; border: none; width: 20%; height: 100%; }
    .dock-btn.active, .dock-btn:active { color: #007aff; }
    .dock-btn span { font-size: 18px; }

    #toast { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 11px; display: none; z-index: 1000; border: 1px solid #444; pointer-events: none; }
    input[type="file"] { display: none !important; }
  </style>

  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/TransformControls.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

<div id="app">
  <div id="top-bar">
    <button class="icon-btn" onclick="resetCamera()">🏠 Center</button>
    <div style="font-size:12px; font-weight:bold; color:#007aff;">PRISMA 3D AUTO-RIG ENGINE</div>
    <button class="icon-btn" onclick="triggerImport()">📂 Import</button>
  </div>

  <div id="viewport">
    <canvas id="canvas3d"></canvas>

    <div id="rig-overlay">
      <div id="center-guide"></div>
      <div id="joints-container"></div>
      <div id="rig-tools-bar">
        <button class="rig-btn" onclick="closeRigOverlay()">Cancel</button>
        <button class="rig-btn apply" onclick="applyAutoRigging()">✓ Apply Rig</button>
      </div>
    </div>

    <div id="toast">Ready</div>
  </div>

  <div id="timeline-panel">
    <div id="tl-header">
      <button style="background:#007aff; border:none; color:#fff; font-size:10px; padding:2px 8px; border-radius:3px;" onclick="togglePlay()">▶ Play</button>
      <span id="time-display">00:00.00 / 05:00</span>
      <button style="background:#ffcc00; border:none; color:#000; font-size:10px; padding:2px 8px; border-radius:3px; font-weight:bold;" onclick="addKeyframe()">🔑 Keyframe</button>
    </div>
    <div id="tl-canvas-wrap" onclick="seekTimeline(event)">
      <canvas id="tl-canvas"></canvas>
    </div>
  </div>

  <div id="bottom-bar">
    <button class="dock-btn" onclick="setMode('translate')"><span>✢</span>Move</button>
    <button class="dock-btn" onclick="setMode('rotate')"><span>🔄</span>Rotate</button>
    <button class="dock-btn active" onclick="openRigOverlay()"><span>🦴</span>Auto Rig</button>
    <button class="dock-btn" onclick="triggerImport()"><span>📂</span>Import</button>
    <button class="dock-btn" onclick="deleteSelected()"><span>🗑</span>Delete</button>
  </div>
</div>

<input type="file" id="file-input" accept=".obj,.gltf,.glb">


  <script>
  let scene, camera, renderer, orbit, transformControl;
  let activeModel = null;
  let isPlaying = false, currentTime = 0, duration = 5.0;
  let controlHandles = [];
  let skeletonHelper = null;

  const defaultJoints = [
    { id: 'head', name: 'Head', x: 50, y: 16, class: 'head' },
    { id: 'neck', name: 'Neck', x: 50, y: 24, class: '' },
    { id: 'shoulder_r', name: 'R Shoulder', x: 38, y: 28, class: '' },
    { id: 'elbow_r', name: 'R Elbow', x: 25, y: 28, class: '' },
    { id: 'wrist_r', name: 'R Wrist', x: 12, y: 28, class: '' },
    { id: 'shoulder_l', name: 'L Shoulder', x: 62, y: 28, class: '' },
    { id: 'elbow_l', name: 'L Elbow', x: 75, y: 28, class: '' },
    { id: 'wrist_l', name: 'L Wrist', x: 88, y: 28, class: '' },
    { id: 'hips', name: 'Hips', x: 50, y: 52, class: 'hip' },
    { id: 'knee_r', name: 'R Knee', x: 42, y: 72, class: '' },
    { id: 'ankle_r', name: 'R Ankle', x: 42, y: 90, class: '' },
    { id: 'knee_l', name: 'L Knee', x: 58, y: 72, class: '' },
    { id: 'ankle_l', name: 'L Ankle', x: 58, y: 90, class: '' }
  ];

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg; t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 1800);
  }

  function init3DEngine() {
    const container = document.getElementById('viewport');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x18181c);

    camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 1.2, 3.0);

    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true, powerPreference: "high-performance" });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    orbit = new THREE.OrbitControls(camera, renderer.domElement);
    orbit.enableDamping = true;
    orbit.target.set(0, 1.0, 0);

    transformControl = new THREE.TransformControls(camera, renderer.domElement);
    transformControl.addEventListener('dragging-changed', (e) => { orbit.enabled = !e.value; });
    scene.add(transformControl);

    scene.add(new THREE.AmbientLight(0xffffff, 0.85));
    const dl = new THREE.DirectionalLight(0xffffff, 1.0);
    dl.position.set(3, 8, 5);
    scene.add(dl);
    scene.add(new THREE.GridHelper(10, 10, 0x3d3d45, 0x222228));

    showToast("Engine Ready. Import model");
    startRenderLoop();
  }

  function triggerImport() { 
    document.getElementById('file-input').click(); 
  }

  document.getElementById('file-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    showToast("Loading 3D Model...");

    const fileName = file.name.toLowerCase();
    const reader = new FileReader();

    if (fileName.endsWith('.obj')) {
      reader.onload = (evt) => {
        loadModelToScene(new THREE.OBJLoader().parse(evt.target.result));
      };
      reader.readAsText(file);
    } else if (fileName.endsWith('.gltf') || fileName.endsWith('.glb')) {
      reader.onload = (evt) => {
        const loader = new THREE.GLTFLoader();
        loader.parse(evt.target.result, '', (gltf) => {
          loadModelToScene(gltf.scene);
        });
      };
      reader.readAsArrayBuffer(file);
    } else {
      showToast("Unsupported format!");
    }
  });

  function loadModelToScene(loadedObject) {
    if (activeModel) scene.remove(activeModel);
    if (skeletonHelper) scene.remove(skeletonHelper);
    controlHandles.forEach(h => scene.remove(h));
    controlHandles = [];

    activeModel = loadedObject;

    const box = new THREE.Box3().setFromObject(activeModel);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());

    activeModel.position.x += (activeModel.position.x - center.x);
    activeModel.position.y += (activeModel.position.y - center.y) + (size.y / 2);
    activeModel.position.z += (activeModel.position.z - center.z);

    const maxDim = Math.max(size.x, size.y, size.z);
    if (maxDim > 0) {
      const scale = 2.0 / maxDim;
      activeModel.scale.set(scale, scale, scale);
    }

    scene.add(activeModel);
    showToast("Model Loaded! Click 'Auto Rig'");
  }

  function openRigOverlay() {
    if (!activeModel) { showToast("Import a 3D Model First!"); return; }

    camera.position.set(0, 1.1, 2.8);
    orbit.target.set(0, 1.1, 0);
    orbit.update();

    const overlay = document.getElementById('rig-overlay');
    const container = document.getElementById('joints-container');
    container.innerHTML = '';
    overlay.style.display = 'block';

    defaultJoints.forEach(j => {
      const node = document.createElement('div');
      node.className = `joint-node ${j.class}`;
      node.style.left = `${j.x}%`;
      node.style.top = `${j.y}%`;
      node.dataset.id = j.id;

      makeNodeDraggable(node);
      container.appendChild(node);
    });

    showToast("Adjust Points on Body Joints");
  }

  function makeNodeDraggable(elm) {
    let active = false, initialX, initialY;

    elm.addEventListener('pointerdown', (e) => {
      active = true;
      initialX = e.clientX - elm.offsetLeft;
      initialY = e.clientY - elm.offsetTop;
    });

    window.addEventListener('pointermove', (e) => {
      if (active) {
        e.preventDefault();
        elm.style.left = (e.clientX - initialX) + 'px';
        elm.style.top = (e.clientY - initialY) + 'px';
      }
    });

    window.addEventListener('pointerup', () => { active = false; });
  }

  function closeRigOverlay() {
    document.getElementById('rig-overlay').style.display = 'none';
  }


      function applyAutoRigging() {
    if (!activeModel) { showToast("Model load karein pehle!"); closeRigOverlay(); return; }

    showToast("Binding Bones to Model Mesh...");

    const box = new THREE.Box3().setFromObject(activeModel);
    const size = box.getSize(new THREE.Vector3());
    const min = box.min;
    const center = box.getCenter(new THREE.Vector3());

    const container = document.getElementById('joints-container');
    const rect = container.getBoundingClientRect();
    const nodes = container.querySelectorAll('.joint-node');
    const nodeCoords = {};

    nodes.forEach(node => {
      const nRect = node.getBoundingClientRect();
      const relativeX = (nRect.left + nRect.width / 2 - rect.left) / rect.width;
      const relativeY = (nRect.top + nRect.height / 2 - rect.top) / rect.height;

      const worldY = box.max.y - (relativeY * size.y);
      const worldX = center.x + (relativeX - 0.5) * size.x;
      nodeCoords[node.dataset.id] = new THREE.Vector3(worldX, worldY, center.z);
    });

    closeRigOverlay();

    if (skeletonHelper) scene.remove(skeletonHelper);
    controlHandles.forEach(h => scene.remove(h));
    controlHandles = [];

    const hipsPos = nodeCoords['hips'] || new THREE.Vector3(center.x, min.y + size.y * 0.5, center.z);
    const spinePos = nodeCoords['neck'] || new THREE.Vector3(center.x, min.y + size.y * 0.7, center.z);
    const headPos = nodeCoords['head'] || new THREE.Vector3(center.x, min.y + size.y * 0.9, center.z);

    const hips = new THREE.Bone(); hips.position.copy(hipsPos); hips.name = "Hips";
    const spine = new THREE.Bone(); spine.position.subVectors(spinePos, hipsPos); hips.add(spine);
    const head = new THREE.Bone(); head.position.subVectors(headPos, spinePos); spine.add(head);

    const shoulderR_Pos = nodeCoords['shoulder_r'] || new THREE.Vector3(center.x - size.x * 0.2, spinePos.y, center.z);
    const elbowR_Pos = nodeCoords['elbow_r'] || new THREE.Vector3(center.x - size.x * 0.35, spinePos.y, center.z);
    const wristR_Pos = nodeCoords['wrist_r'] || new THREE.Vector3(center.x - size.x * 0.5, spinePos.y, center.z);

    const armR = new THREE.Bone(); armR.position.subVectors(shoulderR_Pos, spinePos); spine.add(armR);
    const forearmR = new THREE.Bone(); forearmR.position.subVectors(elbowR_Pos, shoulderR_Pos); armR.add(forearmR);
    const handR = new THREE.Bone(); handR.position.subVectors(wristR_Pos, elbowR_Pos); forearmR.add(handR);

    const shoulderL_Pos = nodeCoords['shoulder_l'] || new THREE.Vector3(center.x + size.x * 0.2, spinePos.y, center.z);
    const elbowL_Pos = nodeCoords['elbow_l'] || new THREE.Vector3(center.x + size.x * 0.35, spinePos.y, center.z);
    const wristL_Pos = nodeCoords['wrist_l'] || new THREE.Vector3(center.x + size.x * 0.5, spinePos.y, center.z);

    const armL = new THREE.Bone(); armL.position.subVectors(shoulderL_Pos, spinePos); spine.add(armL);
    const forearmL = new THREE.Bone(); forearmL.position.subVectors(elbowL_Pos, shoulderL_Pos); armL.add(forearmL);
    const handL = new THREE.Bone(); handL.position.subVectors(wristL_Pos, elbowL_Pos); forearmL.add(handL);

    const kneeR_Pos = nodeCoords['knee_r'] || new THREE.Vector3(center.x - size.x * 0.15, min.y + size.y * 0.25, center.z);
    const ankleR_Pos = nodeCoords['ankle_r'] || new THREE.Vector3(center.x - size.x * 0.15, min.y, center.z);

    const legR = new THREE.Bone(); legR.position.set(-size.x * 0.15, -size.y * 0.1, 0); hips.add(legR);
    const shinR = new THREE.Bone(); shinR.position.subVectors(kneeR_Pos, hipsPos); legR.add(shinR);
    const footR = new THREE.Bone(); footR.position.subVectors(ankleR_Pos, kneeR_Pos); shinR.add(footR);

    const kneeL_Pos = nodeCoords['knee_l'] || new THREE.Vector3(center.x + size.x * 0.15, min.y + size.y * 0.25, center.z);
    const ankleL_Pos = nodeCoords['ankle_l'] || new THREE.Vector3(center.x + size.x * 0.15, min.y, center.z);

    const legL = new THREE.Bone(); legL.position.set(size.x * 0.15, -size.y * 0.1, 0); hips.add(legL);
    const shinL = new THREE.Bone(); shinL.position.subVectors(kneeL_Pos, hipsPos); legL.add(shinL);
    const footL = new THREE.Bone(); footL.position.subVectors(ankleL_Pos, kneeL_Pos); shinL.add(footL);

    const bones = [hips, spine, head, armR, forearmR, handR, armL, forearmL, handL, legR, shinR, footR, legL, shinL, footL];
    const skeleton = new THREE.Skeleton(bones);

    activeModel.add(hips);
    activeModel.updateMatrixWorld(true);

    activeModel.traverse((child) => {
      if (child.isMesh) {
        child.visible = true;
        child.frustumCulled = false;

        const geom = child.geometry.clone();
        const posAttr = geom.attributes.position;
        const skinIndices = [];
        const skinWeights = [];

        const vertexWorld = new THREE.Vector3();
        const boneWorld = new THREE.Vector3();

        for (let i = 0; i < posAttr.count; i++) {
          vertexWorld.fromBufferAttribute(posAttr, i);
          child.localToWorld(vertexWorld);

          let minDist1 = Infinity, boneIdx1 = 0;
          let minDist2 = Infinity, boneIdx2 = 0;

          bones.forEach((b, bIdx) => {
            b.getWorldPosition(boneWorld);
            const dist = vertexWorld.distanceTo(boneWorld);
            if (dist < minDist1) {
              minDist2 = minDist1; boneIdx2 = boneIdx1;
              minDist1 = dist; boneIdx1 = bIdx;
            } else if (dist < minDist2) {
              minDist2 = dist; boneIdx2 = bIdx;
            }
          });

          const w1 = 1 / (minDist1 + 0.0001);
          const w2 = 1 / (minDist2 + 0.0001);
          const totalW = w1 + w2;

          skinIndices.push(boneIdx1, boneIdx2, 0, 0);
          skinWeights.push(w1 / totalW, w2 / totalW, 0, 0);
        }

        geom.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(skinIndices, 4));
        geom.setAttribute('skinWeight', new THREE.Float32BufferAttribute(skinWeights, 4));

        const skinnedMesh = new THREE.SkinnedMesh(geom, child.material);
        skinnedMesh.position.copy(child.position);
        skinnedMesh.rotation.copy(child.rotation);
        skinnedMesh.scale.copy(child.scale);
        skinnedMesh.bind(skeleton, child.matrixWorld);

        if (child.parent) {
          child.parent.add(skinnedMesh);
          child.parent.remove(child);
        }
      }
    });

    bones.forEach(b => {
      const dot = new THREE.Mesh(
        new THREE.SphereGeometry(size.y * 0.02, 12, 12),
        new THREE.MeshBasicMaterial({ color: 0x007aff, depthTest: false })
      );
      dot.renderOrder = 999;
      dot.userData.targetBone = b;
      dot.userData.keyframes = [];
      scene.add(dot);
      controlHandles.push(dot);
    });

    skeletonHelper = new THREE.SkeletonHelper(activeModel);
    scene.add(skeletonHelper);

    transformControl.attach(hips);
    showToast("Rigging Complete! Mesh attached.");
  }

  window.addEventListener('pointerdown', (e) => {
    if (document.getElementById('rig-overlay').style.display === 'block') return;

    const rect = renderer.domElement.getBoundingClientRect();
    const mouse = new THREE.Vector2(
      ((e.clientX - rect.left) / rect.width) * 2 - 1,
      -((e.clientY - rect.top) / rect.height) * 2 + 1
    );

    const rc = new THREE.Raycaster();
    rc.setFromCamera(mouse, camera);
    const hits = rc.intersectObjects(controlHandles);

    if (hits.length > 0) {
      const selectedDot = hits[0].object;
      if (selectedDot.userData.targetBone) {
        transformControl.attach(selectedDot.userData.targetBone);
        showToast(`Bone Selected: ${selectedDot.userData.targetBone.name}`);
      }
    }
  });

  function startRenderLoop() {
    requestAnimationFrame(startRenderLoop);

    controlHandles.forEach(dot => {
      if (dot.userData.targetBone) {
        const worldPos = new THREE.Vector3();
        dot.userData.targetBone.getWorldPosition(worldPos);
        dot.position.copy(worldPos);
      }
    });

    if (isPlaying) {
      currentTime += 0.016;
      if (currentTime > duration) currentTime = 0;
      applyPlaybackAnimation(currentTime);
    }

    orbit.update();
    renderer.render(scene, camera);
    drawTimelineCanvas();
  }

  function addKeyframe() {
    const activeBone = transformControl.object;
    if (!activeBone || !activeBone.isBone) { showToast("Select a Bone Handle First!"); return; }

    const t = parseFloat(currentTime.toFixed(2));
    const handle = controlHandles.find(h => h.userData.targetBone === activeBone);
    if (handle) {
      if (!handle.userData.keyframes) handle.userData.keyframes = [];
      handle.userData.keyframes.push({
        time: t,
        rot: activeBone.rotation.clone(),
        pos: activeBone.position.clone()
      });
      showToast(`Keyframe Saved at ${t}s`);
    }
  }

  function applyPlaybackAnimation(t) {
    controlHandles.forEach(h => {
      const kfs = h.userData.keyframes;
      if (!kfs || kfs.length === 0) return;

      const bone = h.userData.targetBone;
      for (let i = 0; i < kfs.length - 1; i++) {
        if (t >= kfs[i].time && t <= kfs[i + 1].time) {
          const factor = (t - kfs[i].time) / (kfs[i + 1].time - kfs[i].time);
          bone.rotation.x = THREE.MathUtils.lerp(kfs[i].rot.x, kfs[i + 1].rot.x, factor);
          bone.rotation.y = THREE.MathUtils.lerp(kfs[i].rot.y, kfs[i + 1].rot.y, factor);
          bone.rotation.z = THREE.MathUtils.lerp(kfs[i].rot.z, kfs[i + 1].rot.z, factor);
          break;
        }
      }
    });
  }

  function drawTimelineCanvas() {
    const cvs = document.getElementById('tl-canvas');
    const wrap = document.getElementById('tl-canvas-wrap');
    if (!cvs || !wrap) return;

    cvs.width = wrap.clientWidth; cvs.height = wrap.clientHeight;
    const ctx = cvs.getContext('2d');
    ctx.fillStyle = '#0c0c0e'; ctx.fillRect(0, 0, cvs.width, cvs.height);

    const px = (currentTime / duration) * cvs.width;
    ctx.strokeStyle = '#007aff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, cvs.height); ctx.stroke();

    document.getElementById('time-display').innerText = `00:${currentTime < 10 ? '0' : ''}${currentTime.toFixed(2)} / 05:00`;
  }

  function setMode(m) { transformControl.setMode(m); }
  function resetCamera() { camera.position.set(0, 1.2, 3.0); orbit.target.set(0, 1.0, 0); }
  function togglePlay() { isPlaying = !isPlaying; }
  function seekTimeline(e) {
    const rect = e.currentTarget.getBoundingClientRect();
    currentTime = ((e.clientX - rect.left) / rect.width) * duration;
  }
  function deleteSelected() {
    if (transformControl.object) {
      scene.remove(transformControl.object);
      transformControl.detach();
    }
  }

  window.addEventListener('load', init3DEngine);
</script>
</body>
</html>
