      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-left: 2px solid transparent;

    .tree-item:hover { background: rgba(255,255,255,0.05); }
    .tree-item.selected {
      background: rgba(0, 122, 255, 0.18);
      color: #007aff;
      font-weight: bold;
      border-left-color: #007aff;

    #tl-play-btn { background: #007aff; border: none; color: #fff; font-size: 10px; padding: 3px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }

    #tl-canvas { width: 100%; height: 100%; display: block; cursor: pointer; }

    #bottom-toolbar::-webkit-scrollbar { display: none; }
