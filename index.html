<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Editor - Prisma 3D Skeleton Rigging & Multi-Track</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100dvh; overflow: hidden; background: #0d0d0d; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #app { display: flex; flex-direction: column; width: 100%; height: 100dvh; position: relative; }
    
    #top-bar { height: 48px; background: #181818; display: flex; align-items: center; justify-content: space-between; padding: 0 6px; border-bottom: 1px solid #282828; flex-shrink: 0; z-index: 100; }
    .top-bar-left, .top-bar-right { display: flex; align-items: center; gap: 4px; }
    
    .icon-btn { background: #252525; border: 1px solid #3d3d3d; color: #fff; font-size: 11px; padding: 6px 8px; border-radius: 6px; cursor: pointer; touch-action: manipulation; }
    .icon-btn:active { background: #007aff; }
    .icon-btn.rig-btn { background: rgba(52, 199, 89, 0.2); color: #34c759; border-color: rgba(52, 199, 89, 0.4); }
    .icon-btn.rig-btn.active { background: #34c759; color: #000; font-weight: bold; }
    .icon-btn.keyframe-btn { background: rgba(255, 204, 0, 0.2); color: #ffcc00; border-color: rgba(255, 204, 0, 0.4); }
    .icon-btn.delete-btn { background: rgba(255, 59, 48, 0.2); color: #ff3b30; border-color: rgba(255, 59, 48, 0.4); }

    #viewport { flex: 1; position: relative; background: #121212; width: 100%; min-height: 0; }
    #three-canvas { width: 100%; height: 100%; display: block; position: absolute; top:0; left:0; touch-action: none; }
    
    #hierarchy { position: absolute; top: 10px; left: 10px; width: 120px; max-height: 140px; background: rgba(18, 18, 18, 0.85); border: 1px solid #333; border-radius: 6px; padding: 6px; z-index: 10; font-size: 10px; overflow-y: auto; backdrop-filter: blur(4px); }
    .tree-item { padding: 5px 6px; border-radius: 4px; margin-top: 3px; background: rgba(255,255,255,0.05); cursor: pointer; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
    .tree-item.selected { background: #007aff; color: #fff; font-weight: bold; }

    /* Prisma 3D Style Multi-Track Timeline */
    #timeline-panel { height: 110px; background: #141414; border-top: 1px solid #282828; display: flex; flex-direction: column; flex-shrink: 0; z-index: 100; }
    #tl-header { height: 26px; background: #1c1c1c; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-size: 10px; color: #aaa; border-bottom: 1px solid #2a2a2a; }
    #tl-play-btn { background: #333; border: 1px solid #555; color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 4px; cursor: pointer; }
    
    #tl-body { flex: 1; display: flex; overflow-x: auto; position: relative; background: #111; }
    #tl-track-labels { width: 90px; background: #181818; border-right: 1px solid #282828; flex-shrink: 0; z-index: 5; }
    .track-label { height: 32px; display: flex; align-items: center; padding: 0 6px; font-size: 10px; color: #888; border-bottom: 1px solid #222; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
    .track-label.active { color: #fff; background: rgba(0, 122, 255, 0.2); font-weight: bold; }
    
    #tl-canvas-container { flex: 1; position: relative; height: 100%; min-width: 100%; }
    #tl-canvas { width: 100%; height: 100%; display: block; }

    #bottom-toolbar { height: 52px; background: #181818; border-top: 1px solid #282828; display: flex; align-items: center; justify-content: space-around; padding: 0 4px; flex-shrink: 0; z-index: 100; }
    .tool-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #aaa; font-size: 10px; cursor: pointer; flex: 1; height: 100%; }
    .tool-item span { font-size: 16px; }
    .tool-item:active { color: #007aff; }

    #toast { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 11px; display: none; z-index: 1000; border: 1px solid #555; pointer-events: none; }
    input[type="file"] { display: none !important; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

<div id="app">
  <div id="top-bar">
    <div class="top-bar-left">
      <button class="icon-btn" onclick="resetCamera()">🏠 Home</button>
      <button class="icon-btn" onclick="setTransformMode('translate')">✢ Move</button>
      <button class="icon-btn" onclick="setTransformMode('rotate')">🔄 Rotate</button>
      <button class="icon-btn" onclick="setTransformMode('scale')">📐 Scale</button>
    </div>
    <div class="top-bar-right">
      <button id="rig-toggle-btn" class="icon-btn rig-btn" onclick="toggleBoneRig()">🦴 Bone Rig</button>
      <button class="icon-btn keyframe-btn" onclick="addKeyframe()">🔑 Keyframe</button>
      <button class="icon-btn delete-btn" onclick="deleteObject()">🗑 Delete</button>
    </div>
  </div>

  <div id="viewport">
    <canvas id="three-canvas"></canvas>
    <div id="hierarchy">
      <div style="font-weight: bold; border-bottom: 1px solid #444; padding-bottom:2px;">Objects</div>
      <div id="tree-root"></div>
    </div>
    <div id="toast">Ready</div>
  </div>

  <!-- Prisma 3D Style Multi-Track Timeline -->
  <div id="timeline-panel">
    <div id="tl-header">
      <button id="tl-play-btn" onclick="togglePlay()">▶ Play</button>
      <span id="time-val" style="font-family: monospace;">00:00.00 of 05:00</span>
      <span style="font-size: 10px; color: #666;">FPS: 30</span>
    </div>
    <div id="tl-body">
      <div id="tl-track-labels"></div>
      <div id="tl-canvas-container">
        <canvas id="tl-canvas"></canvas>
      </div>
    </div>
  </div>

  <div id="bottom-toolbar">
    <div class="tool-item" onclick="triggerModelUpload()">
      <span>📦</span>Models
    </div>
    <div class="tool-item" onclick="toggleSky()">
      <span>🌐</span>Sky
    </div>
    <div class="tool-item" onclick="addCamera()">
      <span>🎥</span>Camera
    </div>
    <div class="tool-item" onclick="addLight()">
      <span>💡</span>Light
    </div>
    <div class="tool-item" onclick="triggerImageUpload()">
      <span>🖼️</span>Media
    </div>
    <div class="tool-item" onclick="addCube()">
      <span>🧊</span>Cube
    </div>
  </div>
</div>

<input type="file" id="file-model-input" accept=".glb,.gltf">
<input type="file" id="file-image-input" accept="image/*">

<script>
  let scene, camera, renderer, orbit, transform;
  let objects = [], selectedObj = null, selectedBone = null;
  let keyframes = []; 
  let isPlaying = false, currentTime = 0, duration = 5.0;
  let raycaster = new THREE.Raycaster();
  let mouse = new THREE.Vector2();

  // Rigging Helpers
  let skeletonHelper = null;
  let jointSpheresGroup = new THREE.Group();
  let isRigVisible = false;

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 2200);
  }

  window.addEventListener('load', () => {
    initScene();
    setupTimeline();
    setupFileInputs();
  });

  function initScene() {
    const vp = document.getElementById('viewport');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x121212);

    camera = new THREE.PerspectiveCamera(60, vp.clientWidth / vp.clientHeight, 0.1, 1000);
    
    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three-canvas'), antialias: true });
    renderer.setSize(vp.clientWidth, vp.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    orbit = new THREE.OrbitControls(camera, renderer.domElement);
    orbit.enableDamping = true;

    transform = new THREE.TransformControls(camera, renderer.domElement);
    transform.addEventListener('dragging-changed', e => orbit.enabled = !e.value);
    scene.add(transform);

    scene.add(jointSpheresGroup);

    const light = new THREE.DirectionalLight(0xffffff, 1.2);
    light.position.set(5, 10, 7);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));

    const grid = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
    scene.add(grid);

    resetCamera();
    addCube();

    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (transform.dragging) return;
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);

      // Check Joint selection first if Rig is active
      if (isRigVisible && jointSpheresGroup.children.length > 0) {
        const jointIntersects = raycaster.intersectObjects(jointSpheresGroup.children, true);
        if (jointIntersects.length > 0) {
          const selectedJoint = jointIntersects[0].object;
          if (selectedJoint.userData && selectedJoint.userData.bone) {
            selectedBone = selectedJoint.userData.bone;
            transform.attach(selectedBone);
            showToast('Bone Selected: ' + (selectedBone.name || 'Joint'));
            return;
          }
        }
      }

      // Check object selection
      const intersects = raycaster.intersectObjects(objects, true);
      if (intersects.length > 0) {
        let root = intersects[0].object;
        while (root.parent && root.parent !== scene && !objects.includes(root)) {
          root = root.parent;
        }
        selectObject(root);
      }
    });

    window.addEventListener('resize', onWindowResize);
    animate();
    showToast("Editor Ready!");
  }

  function resetCamera() {
    camera.position.set(0, 2, 5);
    orbit.target.set(0, 0.5, 0);
    orbit.update();
  }

  function addCube() {
    const geo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
    const mat = new THREE.MeshStandardMaterial({ color: 0x007aff, roughness: 0.4 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(0, 0.4, 0);
    addObjectToScene(mesh, 'Cube');
  }

  function addObjectToScene(obj, defaultName) {
    obj.name = defaultName || ('Obj_' + (objects.length + 1));
    scene.add(obj);
    objects.push(obj);
    selectObject(obj);
  }

  function selectObject(obj) {
    selectedObj = obj;
    selectedBone = null;
    if (obj) {
      transform.attach(obj);
    } else {
      transform.detach();
    }
    updateRigHelper();
    updateHierarchy();
    updateTimelineTracks();
    drawTimeline();
  }

  function deleteObject() {
    if (!selectedObj) {
      showToast('Select an object to delete');
      return;
    }
    clearRigHelpers();
    transform.detach();
    scene.remove(selectedObj);
    objects = objects.filter(o => o !== selectedObj);
    keyframes = keyframes.filter(kf => kf.obj !== selectedObj);
    selectedObj = null;
    updateHierarchy();
    updateTimelineTracks();
    drawTimeline();
    showToast('Deleted!');
  }

  function setTransformMode(mode) {
    if (transform) {
      transform.setMode(mode);
      showToast(mode.toUpperCase() + ' Mode');
    }
  }

  /* Upload Handlers */
  function triggerModelUpload() { document.getElementById('file-model-input').click(); }
  function triggerImageUpload() { document.getElementById('file-image-input').click(); }

  function setupFileInputs() {
    document.getElementById('file-model-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      showToast('Loading 3D Model...');
      const url = URL.createObjectURL(file);

      if (typeof THREE.GLTFLoader !== 'undefined') {
        const loader = new THREE.GLTFLoader();
        loader.load(url, (gltf) => {
          const model = gltf.scene;
          model.position.set(0, 0, 0);
          addObjectToScene(model, file.name.split('.')[0]);
          showToast('Model Loaded!');
        }, undefined, (err) => {
          console.error(err);
          showToast('Error loading model!');
        });
      }
      e.target.value = '';
    });

    document.getElementById('file-image-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      showToast('Uploading Image...');
      const url = URL.createObjectURL(file);

      new THREE.TextureLoader().load(url, (texture) => {
        if (selectedObj) {
          selectedObj.traverse((child) => {
            if (child.isMesh) {
              child.material.map = texture;
              child.material.needsUpdate = true;
            }
          });
          showToast('Texture applied!');
        } else {
          const aspect = texture.image.width / texture.image.height || 1;
          const planeGeo = new THREE.PlaneGeometry(1.5 * aspect, 1.5);
          const planeMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
          const plane = new THREE.Mesh(planeGeo, planeMat);
          plane.position.set(0, 1, 0);
          addObjectToScene(plane, 'Media_' + file.name.split('.')[0]);
          showToast('Media Plane Added!');
        }
      });
      e.target.value = '';
    });
  }

  /* Prisma 3D Skeleton Rigging System */
  function clearRigHelpers() {
    if (skeletonHelper) {
      scene.remove(skeletonHelper);
      skeletonHelper = null;
    }
    while (jointSpheresGroup.children.length > 0) {
      const child = jointSpheresGroup.children[0];
      jointSpheresGroup.remove(child);
      if (child.geometry) child.geometry.dispose();
      if (child.material) child.material.dispose();
    }
  }

  function toggleBoneRig() {
    isRigVisible = !isRigVisible;
    const btn = document.getElementById('rig-toggle-btn');
    if (isRigVisible) {
      btn.classList.add('active');
      updateRigHelper();
      showToast('Rig View ON (Prisma 3D Style)');
    } else {
      btn.classList.remove('active');
      clearRigHelpers();
      if (selectedObj) transform.attach(selectedObj);
      showToast('Rig View OFF');
    }
  }

  function updateRigHelper() {
    clearRigHelpers();
    if (!isRigVisible || !selectedObj) return;

    // Search for bones inside selected model
    let bones = [];
    selectedObj.traverse((child) => {
      if (child.isBone) bones.push(child);
    });

    // If GLTF/FBX has actual SkinnedMesh Bones
    if (bones.length > 0) {
      skeletonHelper = new THREE.SkeletonHelper(selectedObj);
      skeletonHelper.material.linewidth = 2;
      scene.add(skeletonHelper);

      // Create Prisma 3D style white joint spheres for each bone
      const sphereGeo = new THREE.SphereGeometry(0.04, 16, 16);
      const sphereMat = new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false });

      bones.forEach(bone => {
        const sphere = new THREE.Mesh(sphereGeo, sphereMat);
        sphere.renderOrder = 999;
        sphere.userData = { bone: bone };
        jointSpheresGroup.add(sphere);
      });
    } else {
      // Fallback procedural joints for simple models
      generateProceduralJoints(selectedObj);
    }
  }

  function generateProceduralJoints(obj) {
    const box = new THREE.Box3().setFromObject(obj);
    const center = new THREE.Vector3();
    const size = new THREE.Vector3();
    box.getCenter(center);
    box.getSize(size);

    // Standard joint positions relative to model bounding box
    const jointOffsets = [
      { name: 'Head', pos: new THREE.Vector3(center.x, center.y + size.y * 0.4, center.z) },
      { name: 'Neck', pos: new THREE.Vector3(center.x, center.y + size.y * 0.3, center.z) },
      { name: 'Shoulder_L', pos: new THREE.Vector3(center.x - size.x * 0.3, center.y + size.y * 0.25, center.z) },
      { name: 'Shoulder_R', pos: new THREE.Vector3(center.x + size.x * 0.3, center.y + size.y * 0.25, center.z) },
      { name: 'Elbow_L', pos: new THREE.Vector3(center.x - size.x * 0.35, center.y, center.z) },
      { name: 'Elbow_R', pos: new THREE.Vector3(center.x + size.x * 0.35, center.y, center.z) },
      { name: 'Hips', pos: new THREE.Vector3(center.x, center.y - size.y * 0.1, center.z) },
      { name: 'Knee_L', pos: new THREE.Vector3(center.x - size.x * 0.15, center.y - size.y * 0.3, center.z) },
      { name: 'Knee_R', pos: new THREE.Vector3(center.x + size.x * 0.15, center.y - size.y * 0.3, center.z) }
    ];

    const sphereGeo = new THREE.SphereGeometry(0.04, 16, 16);
    const sphereMat = new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false });

    jointOffsets.forEach(j => {
      const sphere = new THREE.Mesh(sphereGeo, sphereMat);
      sphere.position.copy(j.pos);
      sphere.renderOrder = 999;
      sphere.userData = { bone: obj, name: j.name };
      jointSpheresGroup.add(sphere);
    });
  }

  function syncJointPositions() {
    if (!isRigVisible || jointSpheresGroup.children.length === 0) return;
    jointSpheresGroup.children.forEach(sphere => {
      if (sphere.userData && sphere.userData.bone && sphere.userData.bone !== selectedObj) {
        sphere.position.setFromMatrixPosition(sphere.userData.bone.matrixWorld);
      }
    });
  }

  function addCamera() {
    const camHelper = new THREE.CameraHelper(new THREE.PerspectiveCamera(50, 1, 0.1, 10));
    camHelper.position.set(0, 1.5, 2);
    addObjectToScene(camHelper, 'Camera');
  }

  function addLight() {
    const pLight = new THREE.PointLight(0xffaa00, 2, 10);
    pLight.position.set(0, 2, 1);
    const helper = new THREE.PointLightHelper(pLight, 0.2);
    pLight.add(helper);
    addObjectToScene(pLight, 'Light');
  }

  function toggleSky() {
    scene.background = scene.background.isColor && scene.background.getHex() === 0x121212 
      ? new THREE.Color(0x1a2b4c) : new THREE.Color(0x121212);
  }

  function updateHierarchy() {
    const tree = document.getElementById('tree-root');
    tree.innerHTML = '';
    if (objects.length === 0) {
      tree.innerHTML = '<div style="color:#666;">No Objects</div>';
      return;
    }
    objects.forEach(obj => {
      const item = document.createElement('div');
      item.className = 'tree-item' + (selectedObj === obj ? ' selected' : '');
      item.innerText = '📦 ' + (obj.name.length > 9 ? obj.name.substring(0, 8) + '..' : obj.name);
      item.onclick = (e) => { e.stopPropagation(); selectObject(obj); };
      tree.appendChild(item);
    });
  }

  /* Prisma 3D Multi-Track Timeline System */
  function setupTimeline() {
    const container = document.getElementById('tl-canvas-container');

    const scrub = (e) => {
      const rect = container.getBoundingClientRect();
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      let ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      currentTime = ratio * duration;
      applyAnimation(currentTime);
      drawTimeline();
    };

    container.addEventListener('pointerdown', scrub);
    container.addEventListener('pointermove', (e) => { if (e.buttons > 0) scrub(e); });
    updateTimelineTracks();
  }

  function updateTimelineTracks() {
    const labels = document.getElementById('tl-track-labels');
    labels.innerHTML = '';

    if (objects.length === 0) {
      labels.innerHTML = '<div class="track-label">No Object</div>';
      return;
    }

    objects.forEach(obj => {
      const lbl = document.createElement('div');
      lbl.className = 'track-label' + (selectedObj === obj ? ' active' : '');
      lbl.innerText = (selectedObj === obj ? '▶ ' : '   ') + (obj.name.length > 8 ? obj.name.substring(0, 7) + '..' : obj.name);
      lbl.onclick = () => selectObject(obj);
      labels.appendChild(lbl);
    });
  }

  function addKeyframe() {
    const targetObj = selectedBone || selectedObj;
    if (!targetObj) {
      showToast('Select a model or bone first!');
      return;
    }
    const time = parseFloat(currentTime.toFixed(2));
    keyframes = keyframes.filter(kf => !(kf.obj === targetObj && Math.abs(kf.time - time) < 0.05));
    keyframes.push({
      obj: targetObj,
      time: time,
      pos: targetObj.position.clone(),
      rot: targetObj.rotation.clone(),
      scale: targetObj.scale.clone()
    });
    drawTimeline();
    showToast('Keyframe set!');
  }

  function togglePlay() {
    isPlaying = !isPlaying;
    document.getElementById('tl-play-btn').innerText = isPlaying ? '⏸ Pause' : '▶ Play';
  }

  function applyAnimation(time) {
    objects.forEach(obj => {
      const animateTarget = (target) => {
        const objKFs = keyframes.filter(kf => kf.obj === target).sort((a,b) => a.time - b.time);
        if (objKFs.length === 0) return;

        if (time <= objKFs[0].time) {
          target.position.copy(objKFs[0].pos);
          target.rotation.copy(objKFs[0].rot);
          target.scale.copy(objKFs[0].scale);
        } else if (time >= objKFs[objKFs.length - 1].time) {
          const last = objKFs[objKFs.length - 1];
          target.position.copy(last.pos);
          target.rotation.copy(last.rot);
          target.scale.copy(last.scale);
        } else {
          for (let i = 0; i < objKFs.length - 1; i++) {
            let k1 = objKFs[i], k2 = objKFs[i+1];
            if (time >= k1.time && time <= k2.time) {
              let alpha = (time - k1.time) / (k2.time - k1.time);
              target.position.lerpVectors(k1.pos, k2.pos, alpha);
              target.scale.lerpVectors(k1.scale, k2.scale, alpha);
              target.rotation.x = THREE.MathUtils.lerp(k1.rot.x, k2.rot.x, alpha);
              target.rotation.y = THREE.MathUtils.lerp(k1.rot.y, k2.rot.y, alpha);
              target.rotation.z = THREE.MathUtils.lerp(k1.rot.z, k2.rot.z, alpha);
              break;
            }
          }
        }
      };

      animateTarget(obj);
      obj.traverse(child => { if (child.isBone) animateTarget(child); });
    });
  }

  function drawTimeline() {
    const container = document.getElementById('tl-canvas-container');
    const tlCanvas = document.getElementById('tl-canvas');
    const w = tlCanvas.width = container.clientWidth;
    const h = tlCanvas.height = container.clientHeight;
    const ctx = tlCanvas.getContext('2d');

    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, w, h);

    // Track Background rows
    const trackHeight = 32;
    objects.forEach((obj, idx) => {
      let y = idx * trackHeight;
      ctx.fillStyle = (selectedObj === obj) ? 'rgba(0, 122, 255, 0.12)' : (idx % 2 === 0 ? '#141414' : '#111');
      ctx.fillRect(0, y, w, trackHeight);
      ctx.strokeStyle = '#222';
      ctx.beginPath(); ctx.moveTo(0, y + trackHeight); ctx.lineTo(w, y + trackHeight); ctx.stroke();
    });

    // Time grids
    ctx.strokeStyle = '#282828';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 5; i++) {
      let x = (i / 5) * (w - 20) + 10;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
    }

    // Keyframe diamonds for each object track
    keyframes.forEach(kf => {
      let parentObj = kf.obj;
      while (parentObj.parent && parentObj.parent !== scene && !objects.includes(parentObj)) {
        parentObj = parentObj.parent;
      }
      let objIndex = objects.indexOf(parentObj);
      if (objIndex !== -1) {
        let kfX = (kf.time / duration) * (w - 20) + 10;
        let kfY = objIndex * trackHeight + (trackHeight / 2);
        
        ctx.fillStyle = (selectedObj === parentObj) ? '#ffcc00' : '#888';
        ctx.beginPath();
        ctx.arc(kfX, kfY, 4, 0, Math.PI * 2);
        ctx.fill();
      }
    });

    // Red Playhead bar
    let playheadX = (currentTime / duration) * (w - 20) + 10;
    ctx.strokeStyle = '#ff3b30';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(playheadX, 0);
    ctx.lineTo(playheadX, h);
    ctx.stroke();

    let sec = currentTime.toFixed(2);
    document.getElementById('time-val').innerText = '00:' + (sec < 10 ? '0' : '') + sec + ' of 05:00';
  }

  function animate() {
    requestAnimationFrame(animate);
    if (isPlaying) {
      currentTime += 0.016;
      if (currentTime > duration) currentTime = 0;
      applyAnimation(currentTime);
      drawTimeline();
    }
    syncJointPositions();
    if (orbit) orbit.update();
    if (renderer && scene && camera) renderer.render(scene, camera);
  }

  function onWindowResize() {
    const vp = document.getElementById('viewport');
    camera.aspect = vp.clientWidth / vp.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(vp.clientWidth, vp.clientHeight);
    drawTimeline();
  }
</script>
</body>
</html>
