<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Mobile Studio - Permanent Grid & Active Timeline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #111; color: #fff; font-family: sans-serif; }
    #app { display: flex; flex-direction: column; width: 100vw; height: 100vh; position: relative; }
    
    /* Top Bar - No Overlap & Fully Scrollable */
    #top-bar { 
      height: 52px; background: #1a1a1a; display: flex; align-items: center; padding: 0 8px; gap: 6px; 
      overflow-x: auto; white-space: nowrap; border-bottom: 1px solid #333; z-index: 999; flex-shrink: 0;
    }
    #top-bar::-webkit-scrollbar { display: none; }
    
    .btn { 
      background: #2a2a2c; color: #fff; border: 1px solid #444; padding: 8px 12px; border-radius: 6px; 
      font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0; touch-action: manipulation;
    }
    .btn:active, .btn.active { background: #007aff !important; border-color: #007aff !important; }
    .btn-highlight { background: #4f46e5; border-color: #6366f1; }
    .btn-photo { background: #059669; border-color: #10b981; }
    .btn-danger { background: #dc2626; border-color: #ef4444; }
    
    /* 3D Viewport */
    #viewport { flex: 1; position: relative; width: 100%; background: #181818; overflow: hidden; }
    #three-canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    
    #hierarchy { 
      position: absolute; top: 10px; left: 10px; width: 130px; max-height: 140px; 
      background: rgba(20, 20, 20, 0.85); border: 1px solid #444; border-radius: 6px; padding: 6px; 
      overflow-y: auto; z-index: 100; font-size: 11px; 
    }
    .tree-item { padding: 4px 6px; border-radius: 4px; margin-bottom: 2px; background: #2b2b2b; cursor: pointer; }
    .tree-item.selected { background: #007aff; }
    
    /* Dedicated Visible Video Timeline */
    #timeline { height: 95px; background: #161616; border-top: 1px solid #333; display: flex; flex-direction: column; z-index: 999; flex-shrink: 0; }
    #tl-controls { height: 38px; background: #222; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; }
    #tl-slider-wrap { flex: 1; position: relative; background: #0a0a0a; touch-action: none; cursor: pointer; }
    #tl-canvas { width: 100%; height: 100%; display: block; }
    
    #toast { 
      position: absolute; bottom: 105px; left: 50%; transform: translateX(-50%); 
      background: rgba(0,0,0,0.85); color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 12px; 
      display: none; z-index: 2000; pointer-events: none; border: 1px solid #555;
    }
    input[type="file"] { display: none !important; }
  </style>

  <!-- External Safe Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

<div id="app">
  <!-- Scrollable Top Bar with All Permanent Buttons -->
  <div id="top-bar">
    <button class="btn btn-highlight" id="btn-upload-model">📦 Model Upload</button>
    <button class="btn btn-photo" id="btn-upload-photo">🖼 Image Upload</button>
    <button class="btn active" id="btn-mode-trans">✢ Move</button>
    <button class="btn" id="btn-mode-rot">🔄 Rotate</button>
    <button class="btn" id="btn-add-cube">🧊 Cube</button>
    <button class="btn" id="btn-add-char">🧍 Rig</button>
    <button class="btn btn-danger" id="btn-delete">🗑 Delete</button>
  </div>

  <div id="viewport">
    <canvas id="three-canvas"></canvas>
    <div id="hierarchy">
      <div style="font-weight: bold; margin-bottom: 4px; border-bottom: 1px solid #555;">Objects</div>
      <div id="tree-root"></div>
    </div>
    <div id="toast">Engine Ready</div>
  </div>

  <!-- Interactive Timeline Strip -->
  <div id="timeline">
    <div id="tl-controls">
      <button class="btn" id="btn-play">▶ Play</button>
      <span id="time-val" style="font-size:12px; font-family:monospace; color:#007aff; font-weight:bold;">0.00s / 5.00s</span>
      <button class="btn btn-highlight" id="btn-addkey">+ Keyframe</button>
    </div>
    <div id="tl-slider-wrap">
      <canvas id="tl-canvas"></canvas>
    </div>
  </div>
</div>

<input type="file" id="file-model" accept=".glb,.gltf">
<input type="file" id="file-photo" accept="image/*">

<script>
  let scene, camera, renderer, orbit, transform;
  let objects = [], selectedObj = null;
  let raycaster = new THREE.Raycaster();
  let mouse = new THREE.Vector2();
  let isPlaying = false, currentTime = 0, duration = 5.0;

  const toast = document.getElementById('toast');
  const treeRoot = document.getElementById('tree-root');
  const tlWrap = document.getElementById('tl-slider-wrap');
  const tlCanvas = document.getElementById('tl-canvas');
  const tlCtx = tlCanvas.getContext('2d');

  function showMsg(m) {
    toast.innerText = m;
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 2000);
  }

  function initApp() {
    const viewport = document.getElementById('viewport');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x181818);

    camera = new THREE.PerspectiveCamera(60, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
    camera.position.set(0, 2, 4);

    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three-canvas'), antialias: true });
    renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // Orbit Controls
    orbit = new THREE.OrbitControls(camera, renderer.domElement);
    orbit.enableDamping = true;
    orbit.target.set(0, 0.8, 0);

    // Transform Gizmo Controls
    transform = new THREE.TransformControls(camera, renderer.domElement);
    transform.size = 0.8;
    transform.addEventListener('dragging-changed', (e) => {
      orbit.enabled = !e.value;
    });
    scene.add(transform);

    // Permanent Lights
    const light1 = new THREE.DirectionalLight(0xffffff, 1.2);
    light1.position.set(5, 10, 7);
    scene.add(light1);
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));

    // PERMANENT GRID (Guaranteed to stay)
    const grid = new THREE.GridHelper(20, 20, 0x666666, 0x333333);
    grid.position.y = 0;
    scene.add(grid);

    setupEvents();
    drawTimeline();
    animate();
    showMsg('3D Engine Online!');
  }

  function selectObject(obj) {
    selectedObj = obj;
    if (obj) {
      transform.attach(obj);
    } else {
      transform.detach();
    }
    updateTree();
  }

  function addObject(obj, name) {
    obj.name = name || 'Mesh_' + (objects.length + 1);
    scene.add(obj);
    objects.push(obj);
    selectObject(obj);
  }

  function setupEvents() {
    // Touch Select
    const canvas = document.getElementById('three-canvas');
    canvas.addEventListener('pointerdown', (e) => {
      if (transform.dragging) return;
      const rect = canvas.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / canvas.clientWidth) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / canvas.clientHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(objects, true);

      if (intersects.length > 0) {
        let topObj = intersects[0].object;
        while (topObj.parent && topObj.parent !== scene) {
          topObj = topObj.parent;
        }
        selectObject(topObj);
      }
    });

    // Button Bindings
    document.getElementById('btn-upload-model').onclick = () => document.getElementById('file-model').click();
    document.getElementById('btn-upload-photo').onclick = () => document.getElementById('file-photo').click();

    document.getElementById('btn-mode-trans').onclick = function() {
      transform.setMode('translate');
      document.querySelectorAll('#top-bar .btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
    };
    
    document.getElementById('btn-mode-rot').onclick = function() {
      transform.setMode('rotate');
      document.querySelectorAll('#top-bar .btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
    };

    document.getElementById('file-model').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      showMsg('Loading Model...');
      new THREE.GLTFLoader().load(URL.createObjectURL(file), (gltf) => {
        addObject(gltf.scene, file.name);
        showMsg('Model Added!');
      });
    };

    document.getElementById('file-photo').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      new THREE.TextureLoader().load(URL.createObjectURL(file), (tex) => {
        if (selectedObj) {
          selectedObj.traverse(child => { if(child.isMesh) child.material.map = tex; });
          showMsg('Texture Applied!');
        } else {
          const plane = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 1.5), new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide }));
          plane.position.set(0, 1, 0);
          addObject(plane, 'Photo Plane');
        }
      });
    };

    document.getElementById('btn-add-cube').onclick = () => {
      const cube = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshStandardMaterial({ color: 0x007aff }));
      cube.position.set(0, 0.4, 0);
      addObject(cube, 'Cube');
    };

    document.getElementById('btn-add-char').onclick = () => {
      const hips = new THREE.Bone(); hips.position.set(0,0.8,0);
      const spine = new THREE.Bone(); spine.position.set(0,0.4,0);
      hips.add(spine);
      const helper = new THREE.SkeletonHelper(hips);
      scene.add(hips); scene.add(helper);
      addObject(hips, 'Skeleton Rig');
    };

    document.getElementById('btn-delete').onclick = () => {
      if (selectedObj) {
        transform.detach();
        scene.remove(selectedObj);
        objects = objects.filter(o => o !== selectedObj);
        selectObject(null);
        showMsg('Deleted');
      }
    };

    document.getElementById('btn-play').onclick = () => {
      isPlaying = !isPlaying;
      document.getElementById('btn-play').innerText = isPlaying ? '⏸ Pause' : '▶ Play';
    };

    // Timeline Scrub Control
    const scrubTimeline = (e) => {
      const rect = tlWrap.getBoundingClientRect();
      const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
      let ratio = Math.max(0, Math.min(1, x / rect.width));
      currentTime = ratio * duration;
      drawTimeline();
    };

    tlWrap.addEventListener('pointerdown', (e) => { scrubTimeline(e); });
    tlWrap.addEventListener('pointermove', (e) => { if(e.buttons > 0) scrubTimeline(e); });

    window.addEventListener('resize', () => {
      const vp = document.getElementById('viewport');
      camera.aspect = vp.clientWidth / vp.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(vp.clientWidth, vp.clientHeight);
      drawTimeline();
    });
  }

  function updateTree() {
    treeRoot.innerHTML = '';
    objects.forEach(obj => {
      const item = document.createElement('div');
      item.className = 'tree-item' + (selectedObj === obj ? ' selected' : '');
      item.innerText = '📦 ' + obj.name;
      item.onclick = (e) => { e.stopPropagation(); selectObject(obj); };
      treeRoot.appendChild(item);
    });
  }

  // Draw Clean Visible Video Timeline
  function drawTimeline() {
    const w = tlCanvas.width = tlWrap.clientWidth;
    const h = tlCanvas.height = 55;
    
    // Background Track
    tlCtx.fillStyle = '#111';
    tlCtx.fillRect(0, 0, w, h);
    
    // Time ticks
    tlCtx.strokeStyle = '#333';
    tlCtx.lineWidth = 1;
    for(let i = 0; i <= 10; i++) {
      let tx = (i / 10) * w;
      tlCtx.beginPath(); tlCtx.moveTo(tx, 0); tlCtx.lineTo(tx, h); tlCtx.stroke();
    }
    
    // Playhead / Scrubber Line
    let px = (currentTime / duration) * w;
    tlCtx.strokeStyle = '#ff3b30'; 
    tlCtx.lineWidth = 3;
    tlCtx.beginPath(); tlCtx.moveTo(px, 0); tlCtx.lineTo(px, h); tlCtx.stroke();
    
    // Scrubber Knob
    tlCtx.fillStyle = '#ff3b30';
    tlCtx.beginPath();
    tlCtx.arc(px, 8, 6, 0, Math.PI * 2);
    tlCtx.fill();

    document.getElementById('time-val').innerText = currentTime.toFixed(2) + 's / ' + duration.toFixed(2) + 's';
  }

  function animate() {
    requestAnimationFrame(animate);
    if (isPlaying) {
      currentTime += 0.016;
      if (currentTime > duration) currentTime = 0;
      drawTimeline();
    }
    orbit.update();
    renderer.render(scene, camera);
  }

  window.onload = initApp;
</script>
</body>
</html>
