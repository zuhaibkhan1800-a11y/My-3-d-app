<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Prisma 3D Auto-Rig Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100vw; height: 100dvh; overflow: hidden; background: #121215; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
    #app { display: flex; flex-direction: column; width: 100%; height: 100dvh; position: relative; }

    #top-bar { height: 44px; background: #18181c; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid #2a2a32; z-index: 10; }
    .brand-title { font-size: 12px; font-weight: bold; color: #007aff; }
    .icon-btn { background: none; border: none; color: #eee; font-size: 14px; cursor: pointer; padding: 6px; }

    #viewport { flex: 1; position: relative; background: #18181c; overflow: hidden; }
    #canvas3d { width: 100%; height: 100%; display: block; touch-action: none; }

    #rig-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.45); display: none; z-index: 100; touch-action: none; }
    #center-guide { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.7); transform: translateX(-50%); pointer-events: none; }

    #joints-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: auto; }
    .joint-node { position: absolute; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #ffffff; background: #ff9500; transform: translate(-50%, -50%); cursor: pointer; touch-action: none; z-index: 101; box-shadow: 0 0 10px rgba(0,0,0,0.8); }
    .joint-node.head { background: #30d158; }
    .joint-node.hip { background: #ff3b30; }

    #rig-tools-bar { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(24, 24, 28, 0.95); padding: 8px 16px; border-radius: 30px; border: 1px solid #3d3d45; backdrop-filter: blur(8px); z-index: 102; }
    .rig-btn { background: #2c2c35; border: none; color: #fff; padding: 8px 18px; border-radius: 20px; font-size: 11px; font-weight: bold; cursor: pointer; }
    .rig-btn.apply { background: #30d158; color: #000; }

    #timeline-panel { height: 85px; background: #141417; border-top: 1px solid #28282e; display: flex; flex-direction: column; flex-shrink: 0; z-index: 10; }
    #tl-header { height: 24px; background: #1c1c20; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 10px; color: #aaa; }
    .tl-btn.play { background: #007aff; border: none; color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 3px; cursor: pointer; }
    .tl-btn.keyframe { background: #ffcc00; border: none; color: #000; font-size: 10px; padding: 2px 8px; border-radius: 3px; font-weight: bold; cursor: pointer; }

    #tl-canvas-wrap { flex: 1; position: relative; background: #0c0c0e; overflow: hidden; }
    #tl-canvas { width: 100%; height: 100%; display: block; }

    #bottom-bar { height: 54px; background: #18181a; border-top: 1px solid #28282e; display: flex; align-items: center; justify-content: space-between; padding: 0 4px; z-index: 20; }
    .dock-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #aaa; font-size: 10px; cursor: pointer; background: none; border: none; width: 20%; height: 100%; }
    .dock-btn.active, .dock-btn:active { color: #007aff; }
    .dock-btn span { font-size: 18px; }

    #toast { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 11px; display: none; z-index: 1000; border: 1px solid #444; pointer-events: none; }
    input[type="file"] { display: none !important; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
</head>
<body>

<div id="app">
  <div id="top-bar">
    <button class="icon-btn" onclick="resetCamera()">🏠 Center</button>
    <div class="brand-title">PRISMA 3D AUTO-RIG ENGINE</div>
    <button class="icon-btn" onclick="triggerImport()">📂 Import</button>
  </div>

  <div id="viewport">
    <canvas id="canvas3d"></canvas>

    <div id="rig-overlay">
      <div id="center-guide"></div>
      <div id="joints-container"></div>
      <div id="rig-tools-bar">
        <button class="rig-btn" onclick="closeRigOverlay()">Cancel</button>
        <button class="rig-btn apply" onclick="applyAutoRigging()">✓ Apply Rig</button>
      </div>
    </div>

    <div id="toast">Ready</div>
  </div>

  <div id="timeline-panel">
    <div id="tl-header">
      <button class="tl-btn play" onclick="togglePlay()">▶ Play</button>
      <span id="time-display">00:00.00 / 05:00</span>
      <button class="tl-btn keyframe" onclick="addKeyframe()">🔑 Keyframe</button>
    </div>
    <div id="tl-canvas-wrap" onclick="seekTimeline(event)">
      <canvas id="tl-canvas"></canvas>
    </div>
  </div>

  <div id="bottom-bar">
    <button class="dock-btn active" id="btn-rotate" onclick="setMode('rotate')"><span>🔄</span>Rotate</button>
    <button class="dock-btn" id="btn-move" onclick="setMode('translate')"><span>✢</span>Move</button>
    <button class="dock-btn" onclick="openRigOverlay()"><span>🦴</span>Auto Rig</button>
    <button class="dock-btn" onclick="triggerImport()"><span>📂</span>Import</button>
    <button class="dock-btn" onclick="deleteSelected()"><span>🗑</span>Delete</button>
  </div>
</div>

<input type="file" id="file-input" accept=".obj,.gltf,.glb">

<script>
  let scene, camera, renderer, orbitControls, transformControls;
  let activeModel = null;
  let characterGroup = null;
  let isPlaying = false, currentTime = 0, duration = 5.0;

  let jointSpheres = [];
  let boneLines = [];
  let jointsDataMap = {};
  let selectedJoint = null;
  let skinWeightsMap = new Map();

  const defaultJoints = [
    { id: 'head', name: 'Head', x: 50, y: 16, parent: 'neck', class: 'head' },
    { id: 'neck', name: 'Neck', x: 50, y: 24, parent: 'hips', class: '' },
    { id: 'shoulder_r', name: 'R Shoulder', x: 38, y: 28, parent: 'neck', class: '' },
    { id: 'elbow_r', name: 'R Elbow', x: 25, y: 28, parent: 'shoulder_r', class: '' },
    { id: 'wrist_r', name: 'R Wrist', x: 12, y: 28, parent: 'elbow_r', class: '' },
    { id: 'shoulder_l', name: 'L Shoulder', x: 62, y: 28, parent: 'neck', class: '' },
    { id: 'elbow_l', name: 'L Elbow', x: 75, y: 28, parent: 'shoulder_l', class: '' },
    { id: 'wrist_l', name: 'L Wrist', x: 88, y: 28, parent: 'elbow_l', class: '' },
    { id: 'hips', name: 'Hips', x: 50, y: 52, parent: null, class: 'hip' },
    { id: 'knee_r', name: 'R Knee', x: 42, y: 72, parent: 'hips', class: '' },
    { id: 'ankle_r', name: 'R Ankle', x: 42, y: 90, parent: 'knee_r', class: '' },
    { id: 'knee_l', name: 'L Knee', x: 58, y: 72, parent: 'hips', class: '' },
    { id: 'ankle_l', name: 'L Ankle', x: 58, y: 90, parent: 'knee_l', class: '' }
  ];

  function showToast(msg) {
    const t = document.getElementById('toast');
    if (!t) return;
    t.innerText = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 2000);
  }

  function init3DEngine() {
    const container = document.getElementById('viewport');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x18181c);

    camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 1.2, 3.2);

    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
    orbitControls.enableDamping = true;
    orbitControls.target.set(0, 1.0, 0);

    transformControls = new THREE.TransformControls(camera, renderer.domElement);
    transformControls.size = 0.75;
    transformControls.setMode('rotate');

    transformControls.addEventListener('dragging-changed', (e) => { 
      orbitControls.enabled = !e.value; 
    });

    transformControls.addEventListener('change', () => {
      updateMeshDeformation();
    });

    scene.add(transformControls);

    scene.add(new THREE.AmbientLight(0xffffff, 0.85));
    const dl = new THREE.DirectionalLight(0xffffff, 1.0);
    dl.position.set(3, 8, 5);
    scene.add(dl);
    scene.add(new THREE.GridHelper(10, 10, 0x3d3d45, 0x222228));

    characterGroup = new THREE.Group();
    scene.add(characterGroup);

    renderer.domElement.addEventListener('pointerdown', onSceneClick);

    showToast("Engine Ready. Tap 'Import'");
    startRenderLoop();
  }

  function onSceneClick(event) {
    if (transformControls.dragging || transformControls.hovered) return;
    if (jointSpheres.length === 0) return;

    const rect = renderer.domElement.getBoundingClientRect();
    const mouse = new THREE.Vector2(
      ((event.clientX - rect.left) / rect.width) * 2 - 1,
      -((event.clientY - rect.top) / rect.height) * 2 + 1
    );

    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(mouse, camera);

    const intersects = raycaster.intersectObjects(jointSpheres, false);

    if (intersects.length > 0) {
      selectJoint(intersects[0].object);
    }
  }

  function selectJoint(sphereMesh) {
    jointSpheres.forEach(s => s.material.color.setHex(0x007aff));

    selectedJoint = sphereMesh;
    selectedJoint.material.color.setHex(0xff9500);

    transformControls.detach();
    transformControls.attach(selectedJoint);
    showToast(`Selected Joint: ${selectedJoint.userData.id}`);
  }

  function triggerImport() { document.getElementById('file-input').click(); }

  document.getElementById('file-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    showToast("Loading 3D Model...");

    const fileName = file.name.toLowerCase();
    const reader = new FileReader();

    if (fileName.endsWith('.obj')) {
      reader.onload = (evt) => {
        try {
          const loader = new THREE.OBJLoader();
          loadModelToScene(loader.parse(evt.target.result));
        } catch (err) { showToast("OBJ Load Error!"); }
      };
      reader.readAsText(file);
    } else if (fileName.endsWith('.gltf') || fileName.endsWith('.glb')) {
      reader.onload = (evt) => {
        try {
          const loader = new THREE.GLTFLoader();
          loader.parse(evt.target.result, '', (gltf) => loadModelToScene(gltf.scene), () => showToast("GLTF Error!"));
        } catch (err) { showToast("GLTF Load Error!"); }
      };
      reader.readAsArrayBuffer(file);
    }
  });

  function loadModelToScene(loadedObject) {
    if (activeModel) characterGroup.remove(activeModel);
    clearRig();

    activeModel = loadedObject;

    characterGroup.position.set(0, 0, 0);
    characterGroup.rotation.set(0, 0, 0);
    characterGroup.scale.set(1, 1, 1);

    const box = new THREE.Box3().setFromObject(activeModel);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());

    activeModel.position.sub(center); 
    activeModel.position.y += size.y / 2;

    const maxDim = Math.max(size.x, size.y, size.z);
    if (maxDim > 0) {
      const scale = 2.0 / maxDim;
      activeModel.scale.set(scale, scale, scale);
    }

    characterGroup.add(activeModel);
    transformControls.detach();

    showToast("Model Loaded! Tap 'Auto Rig'");
  }

  function clearRig() {
    transformControls.detach();
    jointSpheres.forEach(s => scene.remove(s));
    boneLines.forEach(l => scene.remove(l));
    jointSpheres = [];
    boneLines = [];
    jointsDataMap = {};
    selectedJoint = null;
    skinWeightsMap.clear();
  }

  function openRigOverlay() {
    if (!activeModel) { showToast("Import a 3D Model First!"); return; }

    resetCamera();

    const overlay = document.getElementById('rig-overlay');
    const container = document.getElementById('joints-container');
    container.innerHTML = '';
    overlay.style.display = 'block';

    defaultJoints.forEach(j => {
      const node = document.createElement('div');
      node.className = `joint-node ${j.class}`;
      node.style.left = `${j.x}%`;
      node.style.top = `${j.y}%`;
      node.dataset.id = j.id;

      makeNodeDraggable(node);
      container.appendChild(node);
    });

    showToast("Align Joints over Model");
  }

  function makeNodeDraggable(elm) {
    let active = false, initialX, initialY;

    elm.addEventListener('pointerdown', (e) => {
      active = true;
      initialX = e.clientX - elm.offsetLeft;
      initialY = e.clientY - elm.offsetTop;
    });

    window.addEventListener('pointermove', (e) => {
      if (active) {
        e.preventDefault();
        elm.style.left = (e.clientX - initialX) + 'px';
        elm.style.top = (e.clientY - initialY) + 'px';
      }
    });

    window.addEventListener('pointerup', () => { active = false; });
  }

  function closeRigOverlay() {
    document.getElementById('rig-overlay').style.display = 'none';
  }

  function applyAutoRigging() {
    if (!activeModel) { closeRigOverlay(); return; }

    clearRig();

    const container = document.getElementById('joints-container');
    const nodes = container.querySelectorAll('.joint-node');
    const rect = container.getBoundingClientRect();

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    // 1. Create Joint Spheres
    nodes.forEach(node => {
      const id = node.dataset.id;
      const nodeRect = node.getBoundingClientRect();
      const x = nodeRect.left + nodeRect.width / 2;
      const y = nodeRect.top + nodeRect.height / 2;

      mouse.x = ((x - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((y - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(activeModel, true);

      let targetPos = new THREE.Vector3();
      if (intersects.length > 0) {
        targetPos.copy(intersects[0].point);
      } else {
        const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
        raycaster.ray.intersectPlane(plane, targetPos);
      }

      const sphereGeo = new THREE.SphereGeometry(0.04, 16, 16);
      const sphereMat = new THREE.MeshBasicMaterial({ color: 0x007aff, depthTest: false });
      const sphereMesh = new THREE.Mesh(sphereGeo, sphereMat);
      sphereMesh.position.copy(targetPos);
      sphereMesh.renderOrder = 999;
      sphereMesh.userData = { id: id, restPosition: targetPos.clone(), restQuaternion: sphereMesh.quaternion.clone() };

      scene.add(sphereMesh);
      jointSpheres.push(sphereMesh);

      const parentId = defaultJoints.find(dj => dj.id === id).parent;
      jointsDataMap[id] = { mesh: sphereMesh, parent: parentId, restPos: targetPos.clone() };
    });

    // 2. Create Bone Connecting Lines
    defaultJoints.forEach(j => {
      if (j.parent && jointsDataMap[j.parent] && jointsDataMap[j.id]) {
        const pMesh = jointsDataMap[j.parent].mesh;
        const cMesh = jointsDataMap[j.id].mesh;

        const lineGeo = new THREE.BufferGeometry().setFromPoints([pMesh.position, cMesh.position]);
        const lineMat = new THREE.LineBasicMaterial({ color: 0x00ffcc, linewidth: 3, depthTest: false });
        const line = new THREE.Line(lineGeo, lineMat);
        line.renderOrder = 998;
        scene.add(line);

        boneLines.push({ line, pMesh, cMesh });
      }
    });

    // 3. Compute Smooth Linear Blend Skinning Weights
    activeModel.updateMatrixWorld(true);
    activeModel.traverse(child => {
      if (child.isMesh && child.geometry) {
        const posAttr = child.geometry.attributes.position;
        const count = posAttr.count;

        const origPositions = new Float32Array(posAttr.array);
        const vertexWeights = [];

        for (let i = 0; i < count; i++) {
          const vLocal = new THREE.Vector3(posAttr.getX(i), posAttr.getY(i), posAttr.getZ(i));
          const vWorld = vLocal.clone().applyMatrix4(child.matrixWorld);

          let weights = [];
          let totalWeight = 0;

          jointSpheres.forEach(joint => {
            const dist = vWorld.distanceTo(joint.userData.restPosition);
            const weight = 1 / Math.pow(dist + 0.05, 3); // Smooth Falloff
            weights.push({ jointId: joint.userData.id, weight: weight });
            totalWeight += weight;
          });

          // Normalize weights
          weights.forEach(w => w.weight /= totalWeight);
          // Keep top 3 influencing joints for fast smooth blending
          weights.sort((a, b) => b.weight - a.weight);
          weights = weights.slice(0, 3);

          vertexWeights.push(weights);
        }

        skinWeightsMap.set(child, { origPositions, vertexWeights });
      }
    });

    closeRigOverlay();
    if (jointSpheres.length > 0) selectJoint(jointSpheres[0]);

    showToast("Rigging Complete! Move/Rotate Joints Now.");
  }

  function updateMeshDeformation() {
    // 1. Update Visual Bone Lines
    boneLines.forEach(b => {
      b.line.geometry.setFromPoints([b.pMesh.position, b.cMesh.position]);
      b.line.geometry.attributes.position.needsUpdate = true;
    });

    // 2. Apply Dynamic Skin Mesh Transformation
    activeModel.traverse(child => {
      if (child.isMesh && skinWeightsMap.has(child)) {
        const { origPositions, vertexWeights } = skinWeightsMap.get(child);
        const posAttr = child.geometry.attributes.position;
        const count = posAttr.count;

        const invWorld = new THREE.Matrix4().copy(child.matrixWorld).invert();

        for (let i = 0; i < count; i++) {
          const vOrigLocal = new THREE.Vector3(origPositions[i * 3], origPositions[i * 3 + 1], origPositions[i * 3 + 2]);
          const vOrigWorld = vOrigLocal.clone().applyMatrix4(child.matrixWorld);

          const finalWorld = new THREE.Vector3(0, 0, 0);

          const influences = vertexWeights[i];
          influences.forEach(inf => {
            const jointMesh = jointsDataMap[inf.jointId].mesh;
            const restPos = jointMesh.userData.restPosition;

            // Transformed vertex offset
            const delta = vOrigWorld.clone().sub(restPos);
            delta.applyQuaternion(jointMesh.quaternion);
            const transformedPoint = jointMesh.position.clone().add(delta);

            finalWorld.addScaledVector(transformedPoint, inf.weight);
          });

          const finalLocal = finalWorld.applyMatrix4(invWorld);
          posAttr.setXYZ(i, finalLocal.x, finalLocal.y, finalLocal.z);
        }

        posAttr.needsUpdate = true;
        child.geometry.computeVertexNormals();
      }
    });
  }

  function startRenderLoop() {
    requestAnimationFrame(startRenderLoop);
    orbitControls.update();
    renderer.render(scene, camera);
    drawTimelineCanvas();
  }

  function drawTimelineCanvas() {
    const cvs = document.getElementById('tl-canvas');
    const wrap = document.getElementById('tl-canvas-wrap');
    if (!cvs || !wrap) return;

    cvs.width = wrap.clientWidth; cvs.height = wrap.clientHeight;
    const ctx = cvs.getContext('2d');
    ctx.fillStyle = '#0c0c0e'; ctx.fillRect(0, 0, cvs.width, cvs.height);

    const px = (currentTime / duration) * cvs.width;
    ctx.strokeStyle = '#007aff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, cvs.height); ctx.stroke();
  }

  function resetCamera() { camera.position.set(0, 1.2, 3.2); orbitControls.target.set(0, 1.0, 0); }
  function togglePlay() { isPlaying = !isPlaying; }
  function setMode(m) { 
    if (transformControls) transformControls.setMode(m);
    document.getElementById('btn-rotate').classList.toggle('active', m === 'rotate');
    document.getElementById('btn-move').classList.toggle('active', m === 'translate');
  }
  function deleteSelected() { 
    if (activeModel) { 
      characterGroup.remove(activeModel); 
      activeModel = null; 
      clearRig();
      showToast("Model Deleted!");
    }
  }
  function addKeyframe() { showToast("Keyframe Added!"); }
  function seekTimeline(e) { showToast("Timeline Seeked"); }

  window.addEventListener('load', init3DEngine);
</script>
</body>
</html>
