<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Prisma 3D Auto-Rig Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100vw; height: 100dvh; overflow: hidden; background: #121215; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
    #app { display: flex; flex-direction: column; width: 100%; height: 100dvh; position: relative; }

    #top-bar { height: 44px; background: #18181c; display: flex; align-items: center; justify-space-between; padding: 0 12px; border-bottom: 1px solid #2a2a32; z-index: 10; }
    .icon-btn { background: none; border: none; color: #eee; font-size: 14px; cursor: pointer; padding: 6px; }

    #viewport { flex: 1; position: relative; background: #18181c; overflow: hidden; }
    #canvas3d { width: 100%; height: 100%; display: block; touch-action: none; }

    #rig-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.45); display: none; z-index: 100; touch-action: none;
    }
    #center-guide { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.7); transform: translateX(-50%); pointer-events: none; }

    #joints-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: auto; }
    .joint-node {
      position: absolute; width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid #ffffff; background: #ff9500;
      transform: translate(-50%, -50%); cursor: pointer; touch-action: none; z-index: 101;
      box-shadow: 0 0 10px rgba(0,0,0,0.8);
    }
    .joint-node.head { background: #30d158; }
    .joint-node.hip { background: #ff3b30; }

    #rig-tools-bar {
      position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; background: rgba(24, 24, 28, 0.95); padding: 8px 16px;
      border-radius: 30px; border: 1px solid #3d3d45; backdrop-filter: blur(8px); z-index: 102;
    }
    .rig-btn { background: #2c2c35; border: none; color: #fff; padding: 8px 18px; border-radius: 20px; font-size: 11px; font-weight: bold; cursor: pointer; }
    .rig-btn.apply { background: #30d158; color: #000; }

    #timeline-panel { height: 85px; background: #141417; border-top: 1px solid #28282e; display: flex; flex-direction: column; flex-shrink: 0; z-index: 10; }
    #tl-header { height: 24px; background: #1c1c20; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 10px; color: #aaa; }
    #tl-canvas-wrap { flex: 1; position: relative; background: #0c0c0e; overflow: hidden; }
    #tl-canvas { width: 100%; height: 100%; display: block; }

    #bottom-bar { height: 54px; background: #18181a; border-top: 1px solid #28282e; display: flex; align-items: center; justify-content: space-between; padding: 0 4px; z-index: 20; }
    .dock-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #aaa; font-size: 10px; cursor: pointer; background: none; border: none; width: 20%; height: 100%; }
    .dock-btn.active, .dock-btn:active { color: #007aff; }
    .dock-btn span { font-size: 18px; }

    #toast { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 11px; display: none; z-index: 1000; border: 1px solid #444; pointer-events: none; }
    input[type="file"] { display: none !important; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="app">
  <div id="top-bar">
    <button class="icon-btn" onclick="resetCamera()">🏠 Center</button>
    <div style="font-size:12px; font-weight:bold; color:#007aff;">PRISMA 3D AUTO-RIG ENGINE</div>
    <button class="icon-btn" onclick="triggerImport()">📂 Import</button>
  </div>

  <div id="viewport">
    <canvas id="canvas3d"></canvas>

    <div id="rig-overlay">
      <div id="center-guide"></div>
      <div id="joints-container"></div>
      <div id="rig-tools-bar">
        <button class="rig-btn" onclick="closeRigOverlay()">Cancel</button>
        <button class="rig-btn apply" onclick="applyAutoRigging()">✓ Apply Rig</button>
      </div>
    </div>

    <div id="toast">Ready</div>
  </div>

  <div id="timeline-panel">
    <div id="tl-header">
      <button style="background:#007aff; border:none; color:#fff; font-size:10px; padding:2px 8px; border-radius:3px;" onclick="togglePlay()">▶ Play</button>
      <span id="time-display">00:00.00 / 05:00</span>
      <button style="background:#ffcc00; border:none; color:#000; font-size:10px; padding:2px 8px; border-radius:3px; font-weight:bold;" onclick="addKeyframe()">🔑 Keyframe</button>
    </div>
    <div id="tl-canvas-wrap" onclick="seekTimeline(event)">
      <canvas id="tl-canvas"></canvas>
    </div>
  </div>

  <div id="bottom-bar">
    <button class="dock-btn" onclick="setMode('translate')"><span>✢</span>Move</button>
    <button class="dock-btn" onclick="setMode('rotate')"><span>🔄</span>Rotate</button>
    <button class="dock-btn active" onclick="openRigOverlay()"><span>🦴</span>Auto Rig</button>
    <button class="dock-btn" onclick="triggerImport()"><span>📂</span>Import</button>
    <button class="dock-btn" onclick="deleteSelected()"><span>🗑</span>Delete</button>
  </div>
</div>

<input type="file" id="file-input" accept=".obj,.gltf,.glb">

<script>
  let scene, camera, renderer;
  let activeModel = null;
  let isPlaying = false, currentTime = 0, duration = 5.0;
  let controlHandles = [];
  let skeletonHelper = null;
  let isDragging = false, previousMousePosition = { x: 0, y: 0 };

  const defaultJoints = [
    { id: 'head', name: 'Head', x: 50, y: 16, class: 'head' },
    { id: 'neck', name: 'Neck', x: 50, y: 24, class: '' },
    { id: 'shoulder_r', name: 'R Shoulder', x: 38, y: 28, class: '' },
    { id: 'elbow_r', name: 'R Elbow', x: 25, y: 28, class: '' },
    { id: 'wrist_r', name: 'R Wrist', x: 12, y: 28, class: '' },
    { id: 'shoulder_l', name: 'L Shoulder', x: 62, y: 28, class: '' },
    { id: 'elbow_l', name: 'L Elbow', x: 75, y: 28, class: '' },
    { id: 'wrist_l', name: 'L Wrist', x: 88, y: 28, class: '' },
    { id: 'hips', name: 'Hips', x: 50, y: 52, class: 'hip' },
    { id: 'knee_r', name: 'R Knee', x: 42, y: 72, class: '' },
    { id: 'ankle_r', name: 'R Ankle', x: 42, y: 90, class: '' },
    { id: 'knee_l', name: 'L Knee', x: 58, y: 72, class: '' },
    { id: 'ankle_l', name: 'L Ankle', x: 58, y: 90, class: '' }
  ];

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg; t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 1800);
  }

  function init3DEngine() {
    const container = document.getElementById('viewport');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x18181c);

    camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 1.2, 3.0);

    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    scene.add(new THREE.AmbientLight(0xffffff, 0.85));
    const dl = new THREE.DirectionalLight(0xffffff, 1.0);
    dl.position.set(3, 8, 5);
    scene.add(dl);
    scene.add(new THREE.GridHelper(10, 10, 0x3d3d45, 0x222228));

    // Touch / Mouse Orbit Control
    const canvas = document.getElementById('canvas3d');
    canvas.addEventListener('pointerdown', (e) => {
      isDragging = true;
      previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const deltaMove = { x: e.clientX - previousMousePosition.x, y: e.clientY - previousMousePosition.y };
      
      const deltaRotationQuaternion = new THREE.Quaternion()
        .setFromEuler(new THREE.Euler(
          (deltaMove.y * 0.005),
          (deltaMove.x * 0.005),
          0,
          'XYZ'
        ));

      camera.position.applyQuaternion(deltaRotationQuaternion);
      camera.lookAt(0, 1.0, 0);
      previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointerup', () => { isDragging = false; });

    // Dummy 3D Model load karo to test instantly
    const dummyGeo = new THREE.CylinderGeometry(0.3, 0.2, 1.6, 16);
    const dummyMat = new THREE.MeshPhongMaterial({ color: 0x007aff });
    activeModel = new THREE.Mesh(dummyGeo, dummyMat);
    activeModel.position.set(0, 0.8, 0);
    scene.add(activeModel);

    showToast("Engine Ready! Default 3D Model Loaded");
    startRenderLoop();
  }

  function triggerImport() { 
    document.getElementById('file-input').click(); 
  }

  function openRigOverlay() {
    if (!activeModel) { showToast("Import a 3D Model First!"); return; }

    const overlay = document.getElementById('rig-overlay');
    const container = document.getElementById('joints-container');
    container.innerHTML = '';
    overlay.style.display = 'block';

    defaultJoints.forEach(j => {
      const node = document.createElement('div');
      node.className = `joint-node ${j.class}`;
      node.style.left = `${j.x}%`;
      node.style.top = `${j.y}%`;
      node.dataset.id = j.id;

      makeNodeDraggable(node);
      container.appendChild(node);
    });

    showToast("Adjust Joint Points on Mesh");
  }

  function makeNodeDraggable(elm) {
    let active = false, initialX, initialY;

    elm.addEventListener('pointerdown', (e) => {
      active = true;
      initialX = e.clientX - elm.offsetLeft;
      initialY = e.clientY - elm.offsetTop;
    });

    window.addEventListener('pointermove', (e) => {
      if (active) {
        e.preventDefault();
        elm.style.left = (e.clientX - initialX) + 'px';
        elm.style.top = (e.clientY - initialY) + 'px';
      }
    });

    window.addEventListener('pointerup', () => { active = false; });
  }

  function closeRigOverlay() {
    document.getElementById('rig-overlay').style.display = 'none';
  }

  function applyAutoRigging() {
    closeRigOverlay();
    showToast("Generating Rig Bones...");

    if (skeletonHelper) scene.remove(skeletonHelper);
    controlHandles.forEach(h => scene.remove(h));
    controlHandles = [];

    const rootBone = new THREE.Bone();
    rootBone.position.set(0, 0, 0);

    const spine = new THREE.Bone(); spine.position.set(0, 0.8, 0); rootBone.add(spine);
    const head = new THREE.Bone(); head.position.set(0, 0.6, 0); spine.add(head);

    const bones = [rootBone, spine, head];
    const skeleton = new THREE.Skeleton(bones);

    scene.add(rootBone);

    bones.forEach(b => {
      const dot = new THREE.Mesh(
        new THREE.SphereGeometry(0.06, 12, 12),
        new THREE.MeshBasicMaterial({ color: 0x007aff })
      );
      dot.userData.targetBone = b;
      scene.add(dot);
      controlHandles.push(dot);
    });

    skeletonHelper = new THREE.SkeletonHelper(rootBone);
    scene.add(skeletonHelper);

    showToast("Auto-Rig Successfully Applied!");
  }

  function startRenderLoop() {
    requestAnimationFrame(startRenderLoop);

    controlHandles.forEach(dot => {
      if (dot.userData.targetBone) {
        const worldPos = new THREE.Vector3();
        dot.userData.targetBone.getWorldPosition(worldPos);
        dot.position.copy(worldPos);
      }
    });

    renderer.render(scene, camera);
    drawTimelineCanvas();
  }

  function drawTimelineCanvas() {
    const cvs = document.getElementById('tl-canvas');
    const wrap = document.getElementById('tl-canvas-wrap');
    if (!cvs || !wrap) return;

    cvs.width = wrap.clientWidth; cvs.height = wrap.clientHeight;
    const ctx = cvs.getContext('2d');
    ctx.fillStyle = '#0c0c0e'; ctx.fillRect(0, 0, cvs.width, cvs.height);

    const px = (currentTime / duration) * cvs.width;
    ctx.strokeStyle = '#007aff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, cvs.height); ctx.stroke();
  }

  function resetCamera() { camera.position.set(0, 1.2, 3.0); camera.lookAt(0, 1.0, 0); }
  function togglePlay() { isPlaying = !isPlaying; }
  function setMode(m) { showToast(`Mode: ${m}`); }
  function deleteSelected() { if(activeModel) scene.remove(activeModel); }

  window.addEventListener('load', init3DEngine);
</script>
</body>
</html>
