<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Mobile Rig & Animator - FailSafe Studio</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body, html { 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background-color: #121212; 
      font-family: system-ui, -apple-system, sans-serif; 
      color: #fff; 
    }
    #app-container { 
      display: flex; 
      flex-direction: column; 
      width: 100vw; 
      height: 100vh; 
      position: relative; 
      overflow: hidden;
    }
    
    /* Top Bar Header UI */
    #top-bar { 
      height: 56px; 
      background: #1f1f1f; 
      display: flex; 
      align-items: center; 
      padding: 0 8px; 
      gap: 6px; 
      overflow-x: auto; 
      white-space: nowrap; 
      border-bottom: 1px solid #333; 
      z-index: 999999; 
      position: relative;
      flex-shrink: 0;
    }
    #top-bar::-webkit-scrollbar { display: none; }
    
    /* Interactive Buttons */
    .btn { 
      background: #2c2c2e; 
      color: #fff; 
      border: 1px solid #444; 
      padding: 8px 12px; 
      border-radius: 6px; 
      font-size: 12px; 
      font-weight: 600; 
      cursor: pointer; 
      display: inline-flex; 
      align-items: center; 
      gap: 4px; 
      flex-shrink: 0; 
      z-index: 1000000;
      pointer-events: auto !important;
      touch-action: manipulation;
    }
    .btn:active, .btn.active { 
      background: #007aff !important; 
      border-color: #007aff !important; 
    }
    .btn-highlight { background: #6366f1; border-color: #818cf8; font-weight: bold; }
    .btn-photo { background: #059669; border-color: #10b981; font-weight: bold; }
    .btn-danger { background: #d32f2f; border-color: #d32f2f; }
    .btn-success { background: #2e7d32; border-color: #2e7d32; }
    .btn-preset { background: #f57c00; border-color: #f57c00; }
    .btn-mode { background: #3a3a3c; border-color: #555; }
    
    /* Viewport Frame */
    #viewport-container { 
      flex: 1; 
      position: relative; 
      width: 100%; 
      background: #1e1e1e; 
      overflow: hidden; 
      z-index: 10;
    }
    #three-canvas { 
      width: 100%; 
      height: 100%; 
      display: block; 
      touch-action: none; 
    }
    
    /* Left Panel Hierarchy */
    #hierarchy-panel { 
      position: absolute; 
      top: 10px; 
      left: 10px; 
      width: 140px; 
      max-height: 180px; 
      background: rgba(25, 25, 25, 0.9); 
      border: 1px solid #444; 
      border-radius: 8px; 
      padding: 6px; 
      overflow-y: auto; 
      z-index: 1000; 
      font-size: 11px; 
      pointer-events: auto;
    }
    .tree-item { 
      padding: 5px 6px; 
      border-radius: 4px; 
      cursor: pointer; 
      margin-bottom: 3px; 
      background: #2a2a2a; 
      text-overflow: ellipsis; 
      overflow: hidden; 
      white-space: nowrap; 
    }
    .tree-item.selected { background: #007aff; font-weight: bold; }
    
    /* Bottom Timeline Control */
    #timeline-container { 
      height: 120px; 
      background: #1a1a1a; 
      border-top: 1px solid #333; 
      display: flex; 
      flex-direction: column; 
      z-index: 999999; 
      position: relative;
      flex-shrink: 0;
    }
    #timeline-controls { 
      height: 38px; 
      background: #242424; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding: 0 8px; 
      gap: 6px; 
      overflow-x: auto; 
    }
    #timeline-controls::-webkit-scrollbar { display: none; }
    .playback-group { display: flex; gap: 4px; flex-shrink: 0; }
    
    #timeline-slider-wrap { 
      flex: 1; 
      position: relative; 
      background: #151515; 
      touch-action: none; 
      cursor: pointer;
    }
    #timeline-canvas { width: 100%; height: 100%; display: block; }
    
    /* Notification Toast */
    #toast { 
      position: absolute; 
      bottom: 130px; 
      left: 50%; 
      transform: translateX(-50%); 
      background: rgba(0,0,0,0.85); 
      color: #fff; 
      padding: 6px 14px; 
      border-radius: 20px; 
      font-size: 12px; 
      display: none; 
      z-index: 2000000; 
      pointer-events: none; 
    }
    
    input[type="file"] { display: none !important; }
  </style>

  <!-- Stable UNPKG ThreeJS Scripts -->
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/TransformControls.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
</head>
<body>

<div id="app-container">
  <div id="top-bar">
    <button class="btn btn-highlight" id="btn-upload-model">📦 Model Upload</button>
    <button class="btn btn-photo" id="btn-upload-photo">🖼 Photo Upload</button>
    
    <div style="width: 1px; height: 24px; background: #555; margin: 0 2px;"></div>
    
    <button id="btn-translate" class="btn btn-mode active">✢ Move</button>
    <button id="btn-rotate" class="btn btn-mode">🔄 Rotate</button>
    <button id="btn-scale" class="btn btn-mode">⤢ Scale</button>

    <div style="width: 1px; height: 24px; background: #555; margin: 0 2px;"></div>
    
    <button class="btn" id="btn-add-cube">🧊 Cube</button>
    <button class="btn" id="btn-add-char">🧍 Character</button>
    <button class="btn btn-preset" id="btn-autorig">🦴 Auto-Rig Full</button>
    <button class="btn btn-danger" id="btn-delete">🗑 Delete</button>
  </div>

  <div id="viewport-container">
    <canvas id="three-canvas"></canvas>
    
    <div id="hierarchy-panel">
      <div style="font-weight: bold; margin-bottom: 4px; border-bottom: 1px solid #555;">Hierarchy</div>
      <div id="tree-root"></div>
    </div>
    
    <div id="toast">Ready</div>
  </div>

  <div id="timeline-container">
    <div id="timeline-controls">
      <div class="playback-group">
        <button class="btn" id="btn-play">▶ Play</button>
        <button class="btn" id="btn-pause">⏸ Pause</button>
        <button class="btn" id="btn-stop">⏹ Stop</button>
      </div>
      <span id="time-display" style="font-size: 11px; font-family: monospace;">0.00s / 5.00s</span>
      <div class="playback-group">
        <button class="btn btn-preset" id="btn-walk">🚶 Walk</button>
        <button class="btn btn-preset" id="btn-jump">🦘 Jump</button>
      </div>
      <div class="playback-group">
        <button class="btn btn-success" id="btn-addkey">+ Key</button>
      </div>
    </div>
    <div id="timeline-slider-wrap">
      <canvas id="timeline-canvas"></canvas>
    </div>
  </div>
</div>

<input type="file" id="input-model" accept=".glb,.gltf,.obj">
<input type="file" id="input-photo" accept="image/*">

<script>
  let scene, camera, renderer, orbitControls, transformControls;
  let objectsList = [], selectedObject = null;
  let currentTime = 0, duration = 5.0, isPlaying = false, keyframes = {};
  let characterMesh = null, skeletonBones = [], skeletonHelper = null;

  const canvas3D = document.getElementById('three-canvas');
  const treeRoot = document.getElementById('tree-root');
  const toastEl = document.getElementById('toast');
  const timeDisplay = document.getElementById('time-display');
  const tlCanvas = document.getElementById('timeline-canvas');
  const tlCtx = tlCanvas.getContext('2d');

  function showToast(msg) {
    toastEl.innerText = msg;
    toastEl.style.display = 'block';
    setTimeout(() => { toastEl.style.display = 'none'; }, 2000);
  }

  function init() {
    if (typeof THREE === 'undefined') {
      showToast('Network Error: Refresh page');
      return;
    }

    const container = document.getElementById('viewport-container');
    
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);

    camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 2, 4);

    renderer = new THREE.WebGLRenderer({ canvas: canvas3D, antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    if (typeof THREE.OrbitControls !== 'undefined') {
      orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
      orbitControls.enableDamping = true;
      orbitControls.target.set(0, 1, 0);
    }

    if (typeof THREE.TransformControls !== 'undefined') {
      transformControls = new THREE.TransformControls(camera, renderer.domElement);
      transformControls.size = 0.75;
      transformControls.addEventListener('dragging-changed', function (event) {
        if (orbitControls) orbitControls.enabled = !event.value;
      });
      scene.add(transformControls);
    }

    const light1 = new THREE.DirectionalLight(0xffffff, 1);
    light1.position.set(5, 10, 7);
    scene.add(light1);
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));

    const grid = new THREE.GridHelper(10, 10, 0x555555, 0x333333);
    scene.add(grid);

    attachButtonListeners();
    setupScrubber();
    window.addEventListener('resize', onResize);
    animate();
    showToast('Engine Ready');
  }

  function attachButtonListeners() {
    const bind = (id, fn) => {
      const el = document.getElementById(id);
      if (el) el.onclick = (e) => { e.stopPropagation(); fn(e); };
    };

    bind('btn-upload-model', () => document.getElementById('input-model').click());
    bind('btn-upload-photo', () => document.getElementById('input-photo').click());
    
    document.getElementById('input-model').onchange = handleModelUpload;
    document.getElementById('input-photo').onchange = handlePhotoUpload;

    bind('btn-translate', () => setTransformMode('translate'));
    bind('btn-rotate', () => setTransformMode('rotate'));
    bind('btn-scale', () => setTransformMode('scale'));

    bind('btn-add-cube', addCube);
    bind('btn-add-char', addCharacter);
    bind('btn-autorig', autoRigFull);
    bind('btn-delete', deleteSelected);

    bind('btn-play', () => isPlaying = true);
    bind('btn-pause', () => isPlaying = false);
    bind('btn-stop', () => { isPlaying = false; currentTime = 0; drawTimeline(); });

    bind('btn-walk', presetWalk);
    bind('btn-jump', presetJump);
    bind('btn-addkey', addKeyframe);
  }

  function setTransformMode(mode) {
    if (transformControls) {
      transformControls.setMode(mode);
      document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
      document.getElementById('btn-' + mode).classList.add('active');
      showToast('Mode: ' + mode.toUpperCase());
    }
  }

  function selectObject(obj) {
    selectedObject = obj;
    if (obj && transformControls) {
      transformControls.attach(obj);
      showToast('Selected: ' + obj.name);
    } else if (transformControls) {
      transformControls.detach();
    }
    updateHierarchyUI();
    drawTimeline();
  }

  function addObject(obj, name) {
    obj.name = name || 'Object_' + (objectsList.length + 1);
    scene.add(obj);
    objectsList.push(obj);
    keyframes[obj.uuid] = [];
    selectObject(obj);
  }

  function handleModelUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    const ext = file.name.split('.').pop().toLowerCase();
    showToast('Loading Model...');

    if ((ext === 'glb' || ext === 'gltf') && typeof THREE.GLTFLoader !== 'undefined') {
      new THREE.GLTFLoader().load(url, (gltf) => {
        addObject(gltf.scene, file.name);
        characterMesh = gltf.scene;
        showToast('Model Loaded!');
      }, undefined, () => showToast('Error loading GLTF'));
    } else if (ext === 'obj' && typeof THREE.OBJLoader !== 'undefined') {
      new THREE.OBJLoader().load(url, (obj) => {
        addObject(obj, file.name);
        characterMesh = obj;
        showToast('Model Loaded!');
      }, undefined, () => showToast('Error loading OBJ'));
    } else {
      showToast('Loader not supported!');
    }
  }

  function handlePhotoUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);

    new THREE.TextureLoader().load(url, (texture) => {
      if (selectedObject) {
        selectedObject.traverse((child) => {
          if (child.isMesh) {
            child.material.map = texture;
            child.material.needsUpdate = true;
          }
        });
        showToast('Photo Applied!');
      } else {
        const planeGeo = new THREE.PlaneGeometry(1.5, 1.5);
        const planeMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
        const planeMesh = new THREE.Mesh(planeGeo, planeMat);
        planeMesh.position.set(0, 1, 0);
        addObject(planeMesh, 'Photo Plane');
      }
    });
  }

  function addCube() {
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(0.8, 0.8, 0.8),
      new THREE.MeshStandardMaterial({ color: 0x007aff })
    );
    mesh.position.set(0, 0.4, 0);
    addObject(mesh, 'Cube');
  }

  function addCharacter() {
    const group = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: 0xe5e5ea });

    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.2, 1.0, 16), mat);
    body.position.y = 1.0;
    group.add(body);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), mat);
    head.position.y = 1.7;
    group.add(head);

    characterMesh = group;
    addObject(group, 'Character Body');
  }

  function autoRigFull() {
    if (skeletonHelper) scene.remove(skeletonHelper);

    const hips = new THREE.Bone(); hips.name = "Hips"; hips.position.set(0, 0.9, 0);
    const chest = new THREE.Bone(); chest.name = "Chest"; chest.position.set(0, 0.4, 0);
    const neck = new THREE.Bone(); neck.name = "Neck"; neck.position.set(0, 0.3, 0);
    const head = new THREE.Bone(); head.name = "Head"; head.position.set(0, 0.2, 0);
    hips.add(chest); chest.add(neck); neck.add(head);

    const lShoulder = new THREE.Bone(); lShoulder.name = "L_Shoulder"; lShoulder.position.set(0.25, 0.3, 0);
    const lElbow = new THREE.Bone(); lElbow.name = "L_Elbow"; lElbow.position.set(0.25, 0, 0);
    chest.add(lShoulder); lShoulder.add(lElbow);

    const rShoulder = new THREE.Bone(); rShoulder.name = "R_Shoulder"; rShoulder.position.set(-0.25, 0.3, 0);
    const rElbow = new THREE.Bone(); rElbow.name = "R_Elbow"; rElbow.position.set(-0.25, 0, 0);
    chest.add(rShoulder); rShoulder.add(rElbow);

    const lHip = new THREE.Bone(); lHip.name = "L_Thigh"; lHip.position.set(0.15, -0.1, 0);
    const lKnee = new THREE.Bone(); lKnee.name = "L_Knee"; lKnee.position.set(0, -0.4, 0);
    hips.add(lHip); lHip.add(lKnee);

    const rHip = new THREE.Bone(); rHip.name = "R_Thigh"; rHip.position.set(-0.15, -0.1, 0);
    const rKnee = new THREE.Bone(); rKnee.name = "R_Knee"; rKnee.position.set(0, -0.4, 0);
    hips.add(rHip); rHip.add(rKnee);

    skeletonBones = [hips, chest, neck, head, lShoulder, lElbow, rShoulder, rElbow, lHip, lKnee, rHip, rKnee];
    skeletonBones.forEach(b => { keyframes[b.uuid] = []; });

    scene.add(hips);
    skeletonHelper = new THREE.SkeletonHelper(hips);
    scene.add(skeletonHelper);

    showToast('Full Body Rig Created!');
    selectObject(hips);
  }

  function deleteSelected() {
    if (selectedObject) {
      if (transformControls) transformControls.detach();
      scene.remove(selectedObject);
      objectsList = objectsList.filter(o => o !== selectedObject);
      skeletonBones = skeletonBones.filter(b => b !== selectedObject);
      selectObject(null);
      showToast('Deleted');
    }
  }

  function addKeyframe() {
    if (!selectedObject) return showToast('Select an Object or Bone!');
    const list = keyframes[selectedObject.uuid] || [];
    list.push({
      time: parseFloat(currentTime.toFixed(2)),
      pos: selectedObject.position.clone(),
      rot: selectedObject.rotation.clone(),
      scl: selectedObject.scale.clone()
    });
    keyframes[selectedObject.uuid] = list;
    drawTimeline();
    showToast('Keyframe added!');
  }

  function presetWalk() {
    const lHip = skeletonBones.find(b => b.name === 'L_Thigh');
    const rHip = skeletonBones.find(b => b.name === 'R_Thigh');
    if (!lHip || !rHip) return showToast('Click "Auto-Rig Full" first!');

    keyframes[lHip.uuid] = [
      { time: 0, pos: lHip.position.clone(), rot: new THREE.Euler(0.6, 0, 0), scl: lHip.scale.clone() },
      { time: 2.5, pos: lHip.position.clone(), rot: new THREE.Euler(-0.6, 0, 0), scl: lHip.scale.clone() },
      { time: 5.0, pos: lHip.position.clone(), rot: new THREE.Euler(0.6, 0, 0), scl: lHip.scale.clone() }
    ];

    keyframes[rHip.uuid] = [
      { time: 0, pos: rHip.position.clone(), rot: new THREE.Euler(-0.6, 0, 0), scl: rHip.scale.clone() },
      { time: 2.5, pos: rHip.position.clone(), rot: new THREE.Euler(0.6, 0, 0), scl: rHip.scale.clone() },
      { time: 5.0, pos: rHip.position.clone(), rot: new THREE.Euler(-0.6, 0, 0), scl: rHip.scale.clone() }
    ];

    showToast('Walk Preset Loaded!');
    drawTimeline();
  }

  function presetJump() {
    if (!characterMesh) return showToast('Add or Upload a Character first!');
    keyframes[characterMesh.uuid] = [
      { time: 0, pos: new THREE.Vector3(0, 0, 0), rot: new THREE.Euler(0,0,0), scl: new THREE.Vector3(1,1,1) },
      { time: 2.5, pos: new THREE.Vector3(0, 1.2, 0), rot: new THREE.Euler(0,0,0), scl: new THREE.Vector3(1,1,1) },
      { time: 5.0, pos: new THREE.Vector3(0, 0, 0), rot: new THREE.Euler(0,0,0), scl: new THREE.Vector3(1,1,1) }
    ];

    showToast('Jump Preset Loaded!');
    drawTimeline();
  }

  function updateHierarchyUI() {
    treeRoot.innerHTML = '';
    objectsList.forEach(obj => {
      const item = document.createElement('div');
      item.className = 'tree-item' + (selectedObject === obj ? ' selected' : '');
      item.innerText = '📦 ' + obj.name;
      item.onclick = (e) => { e.stopPropagation(); selectObject(obj); };
      treeRoot.appendChild(item);
    });

    skeletonBones.forEach(bone => {
      const item = document.createElement('div');
      item.className = 'tree-item' + (selectedObject === bone ? ' selected' : '');
      item.innerText = '🦴 ' + bone.name;
      item.onclick = (e) => { e.stopPropagation(); selectObject(bone); };
      treeRoot.appendChild(item);
    });
  }

  function setupScrubber() {
    let active = false;
    function updateScrub(e) {
      const rect = tlCanvas.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      currentTime = Math.max(0, Math.min(duration, (x / rect.width) * duration));
      updateAnimations();
      drawTimeline();
    }

    const wrap = document.getElementById('timeline-slider-wrap');
    wrap.addEventListener('mousedown', (e) => { active = true; updateScrub(e); });
    window.addEventListener('mousemove', (e) => { if(active) updateScrub(e); });
    window.addEventListener('mouseup', () => active = false);

    wrap.addEventListener('touchstart', (e) => { active = true; updateScrub(e); }, {passive: true});
    window.addEventListener('touchmove', (e) => { if(active) updateScrub(e); }, {passive: true});
    window.addEventListener('touchend', () => active = false);
  }

  function updateAnimations() {
    const all = [...objectsList, ...skeletonBones];
    all.forEach(obj => {
      const list = keyframes[obj.uuid];
      if (list && list.length > 1) {
        for (let i = 0; i < list.length - 1; i++) {
          const k1 = list[i], k2 = list[i+1];
          if (currentTime >= k1.time && currentTime <=
