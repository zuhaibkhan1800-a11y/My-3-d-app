<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Editor Fix</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body { width: 100%; height: 100dvh; overflow: hidden; background: #0d0d0d; color: #fff; font-family: sans-serif; }
    #app { display: flex; flex-direction: column; width: 100%; height: 100dvh; }
    
    #top-bar { height: 48px; background: #181818; display: flex; align-items: center; justify-content: space-between; padding: 0 6px; border-bottom: 1px solid #282828; z-index: 10; }
    .top-bar-left, .top-bar-right { display: flex; align-items: center; gap: 4px; }
    
    .icon-btn { background: #252525; border: 1px solid #3d3d3d; color: #fff; font-size: 11px; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
    .icon-btn:active { background: #007aff; }
    
    #viewport { flex: 1; position: relative; background: #121212; width: 100%; }
    #three-canvas { width: 100%; height: 100%; display: block; position: absolute; top: 0; left: 0; }
    
    #hierarchy { position: absolute; top: 10px; left: 10px; width: 110px; background: rgba(18,18,18,0.85); border: 1px solid #333; border-radius: 6px; padding: 6px; z-index: 5; font-size: 10px; }
    
    #timeline-panel { height: 80px; background: #141414; border-top: 1px solid #282828; display: flex; flex-direction: column; z-index: 10; }
    #tl-header { height: 24px; background: #1c1c1c; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-size: 10px; }
    #tl-tracks { flex: 1; position: relative; background: #111; }
    #tl-canvas { width: 100%; height: 100%; display: block; }
    
    #bottom-toolbar { height: 50px; background: #181818; border-top: 1px solid #282828; display: flex; align-items: center; justify-content: space-around; z-index: 10; }
    .tool-item { display: flex; flex-direction: column; align-items: center; gap: 2px; color: #aaa; font-size: 10px; cursor: pointer; }
    
    #toast { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: #000; color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 11px; display: none; z-index: 100; border: 1px solid #555; }
  </style>

  <!-- Essential Standalone Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

<div id="app">
  <div id="top-bar">
    <div class="top-bar-left">
      <button class="icon-btn" onclick="resetCam()">🏠 Home</button>
      <button class="icon-btn" onclick="setMode('translate')">✢ Move</button>
      <button class="icon-btn" onclick="setMode('rotate')">🔄 Rotate</button>
      <button class="icon-btn" onclick="setMode('scale')">📐 Scale</button>
    </div>
    <div class="top-bar-right">
      <button class="icon-btn" style="color:#34c759;" onclick="addRig()">🦴 Bone Rig</button>
      <button class="icon-btn" style="color:#ffcc00;" onclick="addKF()">🔑 Keyframe</button>
      <button class="icon-btn" style="color:#ff3b30;" onclick="delObj()">🗑 Delete</button>
    </div>
  </div>

  <div id="viewport">
    <canvas id="three-canvas"></canvas>
    <div id="hierarchy">
      <b>Objects</b>
      <div id="tree-root" style="margin-top:4px;">No Objects</div>
    </div>
    <div id="toast">Ready</div>
  </div>

  <div id="timeline-panel">
    <div id="tl-header">
      <button id="play-btn" onclick="togglePlay()" style="padding: 2px 6px;">▶ Play</button>
      <span id="time-display">00:00.00</span>
    </div>
    <div id="tl-tracks">
      <canvas id="tl-canvas"></canvas>
    </div>
  </div>

  <div id="bottom-toolbar">
    <div class="tool-item" onclick="addCube()"><span>🧊</span>Cube</div>
    <div class="tool-item" onclick="showMsg('Model Upload Ready')"><span>📦</span>Models</div>
    <div class="tool-item" onclick="showMsg('Light Added')"><span>💡</span>Light</div>
  </div>
</div>

<script>
  let scene, camera, renderer, orbit, transform;
  let objects = [], selectedObj = null;
  let isPlaying = false, currentTime = 0;

  function showMsg(m) {
    const t = document.getElementById('toast');
    t.innerText = m; t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 2000);
  }

  window.addEventListener('load', () => {
    try {
      const vp = document.getElementById('viewport');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a1a);

      camera = new THREE.PerspectiveCamera(60, vp.clientWidth / vp.clientHeight, 0.1, 1000);
      camera.position.set(0, 2, 5);

      renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three-canvas'), antialias: true });
      renderer.setSize(vp.clientWidth, vp.clientHeight);

      orbit = new THREE.OrbitControls(camera, renderer.domElement);
      orbit.enableDamping = true;

      transform = new THREE.TransformControls(camera, renderer.domElement);
      transform.addEventListener('dragging-changed', e => orbit.enabled = !e.value);
      scene.add(transform);

      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(5, 10, 5);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0x404040, 1.5));

      const grid = new THREE.GridHelper(10, 10, 0x444444, 0x222222);
      scene.add(grid);

      // Default cube
      addCube();

      render();
      showMsg("App Loaded Successfully!");
    } catch(err) {
      alert("Render Error: " + err.message);
    }
  });

  function addCube() {
    const geo = new THREE.BoxGeometry(1, 1, 1);
    const mat = new THREE.MeshStandardMaterial({ color: 0x007aff });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.y = 0.5;
    scene.add(mesh);
    objects.push(mesh);
    selectObj(mesh);
  }

  function selectObj(obj) {
    selectedObj = obj;
    if(obj) transform.attach(obj);
    else transform.detach();
    document.getElementById('tree-root').innerText = obj ? "📦 Object 1" : "No Objects";
  }

  function setMode(m) { if(transform) transform.setMode(m); }
  function resetCam() { camera.position.set(0, 2, 5); orbit.target.set(0,0,0); }
  function delObj() { if(selectedObj) { scene.remove(selectedObj); selectObj(null); showMsg("Deleted"); } }
  function addKF() { showMsg("Keyframe Added!"); }
  function addRig() { showMsg("Bone Rig Added!"); }
  function togglePlay() { isPlaying = !isPlaying; document.getElementById('play-btn').innerText = isPlaying ? "⏸ Pause" : "▶ Play"; }

  function render() {
    requestAnimationFrame(render);
    if(orbit) orbit.update();
    if(renderer && scene && camera) renderer.render(scene, camera);
  }
</script>
</body>
</html>
