<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mobile 3D Animation Editor (Prisma3D Style)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* TOP TOOLBAR */
    #top-bar {
      height: 50px;
      background: #252525;
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 6px;
      overflow-x: auto;
      white-space: nowrap;
      border-bottom: 1px solid #333;
      z-index: 10;
    }
    #top-bar::-webkit-scrollbar { display: none; }

    .btn {
      background: #3a3a3c;
      color: #fff;
      border: 1px solid #48484a;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .btn:active, .btn.active {
      background: #007aff;
      border-color: #007aff;
    }
    .btn-danger {
      background: #8e0000;
      border-color: #aa0000;
    }

    /* 3D VIEWPORT */
    #viewport-container {
      flex: 1;
      position: relative;
      width: 100%;
      background: #121212;
      overflow: hidden;
    }
    #three-canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    /* FLOATING OVERLAYS */
    #overlay-controls {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 5;
    }

    #hierarchy-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 160px;
      max-height: 200px;
      background: rgba(30, 30, 30, 0.85);
      border: 1px solid #444;
      border-radius: 8px;
      padding: 8px;
      overflow-y: auto;
      z-index: 5;
      font-size: 11px;
    }
    .tree-item {
      padding: 4px;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tree-item.selected {
      background: #007aff;
    }

    /* BOTTOM TIMELINE */
    #timeline-container {
      height: 160px;
      background: #1e1e1e;
      border-top: 1px solid #333;
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    #timeline-controls {
      height: 40px;
      background: #282828;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      gap: 6px;
      border-bottom: 1px solid #333;
    }

    .playback-group {
      display: flex;
      gap: 4px;
    }

    #timeline-slider-wrap {
      flex: 1;
      height: 120px;
      position: relative;
      overflow-x: auto;
      overflow-y: hidden;
      background: #181818;
    }

    #timeline-canvas {
      height: 100%;
      display: block;
    }

    input[type="file"] {
      display: none;
    }

    #toast {
      position: absolute;
      bottom: 180px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      display: none;
      z-index: 20;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
</head>
<body>

<div id="app-container">
  <div id="top-bar">
    <button class="btn" id="btn-photo">📷 Photo</button>
    <button class="btn" id="btn-model">📦 3D Model</button>
    <div style="width: 1px; height: 20px; background: #444; margin: 0 4px;"></div>
    <button class="btn active" id="mode-select">Select</button>
    <button class="btn" id="mode-move">Move</button>
    <button class="btn" id="mode-rotate">Rotate</button>
    <button class="btn" id="mode-scale">Scale</button>
    <div style="width: 1px; height: 20px; background: #444; margin: 0 4px;"></div>
    <button class="btn" id="btn-undo">↩ Undo</button>
    <button class="btn" id="btn-redo">↪ Redo</button>
    <button class="btn btn-danger" id="btn-delete">🗑 Delete</button>
  </div>

  <div id="viewport-container">
    <canvas id="three-canvas"></canvas>

    <div id="hierarchy-panel">
      <div style="font-weight: bold; margin-bottom: 6px; border-bottom: 1px solid #555; padding-bottom: 2px;">Scene Hierarchy</div>
      <div id="tree-root"></div>
    </div>

    <div id="overlay-controls">
      <button class="btn" id="btn-cam-reset">🎯 Reset Cam</button>
      <button class="btn" id="btn-cam-front">Front</button>
      <button class="btn" id="btn-cam-top">Top</button>
    </div>

    <div id="toast">Message</div>
  </div>

  <div id="timeline-container">
    <div id="timeline-controls">
      <div class="playback-group">
        <button class="btn" id="btn-play">▶</button>
        <button class="btn" id="btn-pause">⏸</button>
        <button class="btn" id="btn-stop">⏹</button>
        <button class="btn" id="btn-loop">🔁</button>
      </div>
      
      <span id="time-display" style="font-size: 11px; font-family: monospace;">0.00s / 5.00s</span>

      <div class="playback-group">
        <button class="btn" id="btn-add-key" style="background: #28a745; border-color: #28a745;">+ Keyframe</button>
        <button class="btn" id="btn-del-key" style="background: #dc3545; border-color: #dc3545;">- Keyframe</button>
      </div>
    </div>

    <div id="timeline-slider-wrap">
      <canvas id="timeline-canvas"></canvas>
    </div>
  </div>
</div>

<input type="file" id="input-photo" accept="image/jpeg,image/png,image/webp">
<input type="file" id="input-model" accept=".glb,.gltf,.obj">

<script>
  let scene, camera, renderer, orbit, transformControls;
  let objectsList = [];
  let selectedObject = null;

  let currentTime = 0;
  let duration = 5.0;
  let isPlaying = false;
  let isLooping = true;
  let keyframes = [];

  let historyStack = [];
  let historyIndex = -1;

  const canvas3D = document.getElementById('three-canvas');
  const treeRoot = document.getElementById('tree-root');
  const toastEl = document.getElementById('toast');
  const timeDisplay = document.getElementById('time-display');

  function init3D() {
    const container = document.getElementById('viewport-container');
    
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);

    camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(3, 3, 5);

    renderer = new THREE.WebGLRenderer({ canvas: canvas3D, antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;

    orbit = new THREE.OrbitControls(camera, renderer.domElement);
    orbit.enableDamping = true;
    orbit.dampingFactor = 0.05;

    transformControls = new THREE.TransformControls(camera, renderer.domElement);
    transformControls.size = 0.75;
    scene.add(transformControls);

    transformControls.addEventListener('dragging-changed', (event) => {
      orbit.enabled = !event.value;
    });

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 7);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const grid = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
    grid.position.y = -0.01;
    scene.add(grid);

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    canvas3D.addEventListener('pointerdown', (e) => {
      if (transformControls.dragging) return;

      const rect = canvas3D.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(objectsList, true);

      if (intersects.length > 0) {
        let hitObj = intersects[0].object;
        while (hitObj.parent && hitObj.parent !== scene && !objectsList.includes(hitObj)) {
          hitObj = hitObj.parent;
        }
        selectObject(hitObj);
      }
    });

    window.addEventListener('resize', onWindowResize);
    animate();
  }

  function onWindowResize() {
    const container = document.getElementById('viewport-container');
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
    drawTimeline();
  }

  function showToast(msg) {
    toastEl.innerText = msg;
    toastEl.style.display = 'block';
    setTimeout(() => { toastEl.style.display = 'none'; }, 2000);
  }

  function selectObject(obj) {
    selectedObject = obj;
    if (obj) {
      transformControls.attach(obj);
    } else {
      transformControls.detach();
    }
    updateHierarchyUI();
  }

  function addObjectToScene(obj, name) {
    obj.name = name || 'Object_' + (objectsList.length + 1);
    scene.add(obj);
    objectsList.push(obj);
    selectObject(obj);
    updateHierarchyUI();
    saveState();
  }

  function updateHierarchyUI() {
    treeRoot.innerHTML = '';
    objectsList.forEach((obj) => {
      const item = document.createElement('div');
      item.className = 'tree-item' + (selectedObject === obj ? ' selected' : '');
      item.innerText = obj.name;
      item.onclick = (e) => {
        e.stopPropagation();
        selectObject(obj);
      };
      treeRoot.appendChild(item);
    });
  }

  document.getElementById('btn-photo').onclick = () => document.getElementById('input-photo').click();
  document.getElementById('btn-model').onclick = () => document.getElementById('input-model').click();

  document.getElementById('input-photo').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (evt) => {
      const loader = new THREE.TextureLoader();
      loader.load(evt.target.result, (texture) => {
        const aspect = texture.image.width / texture.image.height;
        const geometry = new THREE.PlaneGeometry(2 * aspect, 2);
        const material = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(0, 1, 0);
        addObjectToScene(mesh, file.name.split('.')[0]);
        showToast('Photo Imported Successfully');
      });
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  });

  document.getElementById('input-model').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const fileName = file.name;
    const ext = fileName.split('.').pop().toLowerCase();
    const url = URL.createObjectURL(file);

    if (ext === 'glb' || ext === 'gltf') {
      const loader = new THREE.GLTFLoader();
      loader.load(url, (gltf) => {
        const model = gltf.scene;
        model.position.set(0, 0, 0);
        addObjectToScene(model, fileName.split('.')[0]);
        showToast('GLTF/GLB Model Imported');
      }, undefined, () => {
        showToast('Could not load this 3D model.');
      });
    } else if (ext === 'obj') {
      const loader = new THREE.OBJLoader();
      loader.load(url, (obj) => {
        addObjectToScene(obj, fileName.split('.')[0]);
        showToast('OBJ Model Imported');
      }, undefined, () => {
        showToast('Could not load this 3D model.');
      });
    } else {
      showToast('Unsupported file format.');
    }
    e.target.value = '';
  });

  function setMode(mode, btnId) {
    ['mode-select', 'mode-move', 'mode-rotate', 'mode-scale'].forEach(id => {
      document.getElementById(id).classList.remove('active');
    });
    document.getElementById(btnId).classList.add('active');

    if (mode === 'select') {
      transformControls.detach();
    } else {
      if (selectedObject) transformControls.attach(selectedObject);
      transformControls.setMode(mode);
    }
  }

  document.getElementById('mode-select').onclick = () => setMode('select', 'mode-select');
  document.getElementById('mode-move').onclick = () => setMode('translate', 'mode-move');
  document.getElementById('mode-rotate').onclick = () => setMode('rotate', 'mode-rotate');
  document.getElementById('mode-scale').onclick = () => setMode('scale', 'mode-scale');

  document.getElementById('btn-delete').onclick = () => {
    if (selectedObject) {
      scene.remove(selectedObject);
      objectsList = objectsList.filter(o => o !== selectedObject);
      keyframes = keyframes.filter(k => k.objUuid !== selectedObject.uuid);
      selectObject(null);
      drawTimeline();
      saveState();
      showToast('Object Deleted');
    }
  };

  document.getElementById('btn-cam-reset').onclick = () => {
    camera.position.set(3, 3, 5);
    orbit.target.set(0, 0, 0);
    orbit.update();
  };
  document.getElementById('btn-cam-front').onclick = () => {
    camera.position.set(0, 1, 5);
    orbit.target.set(0, 1, 0);
    orbit.update();
  };
  document.getElementById('btn-cam-top').onclick = () => {
    camera.position.set(0, 7, 0);
    orbit.target.set(0, 0, 0);
    orbit.update();
  };

  const tlCanvas = document.getElementById('timeline-canvas');
  const tlCtx = tlCanvas.getContext('2d');
  const tlWrap = document.getElementById('timeline-slider-wrap');

  function resizeTimeline() {
    tlCanvas.width = Math.max(tlWrap.clientWidth, 800);
    tlCanvas.height = tlWrap.clientHeight;
    drawTimeline();
  }

  function drawTimeline() {
    const w = tlCanvas.width;
    const h = tlCanvas.height;

    tlCtx.fillStyle = '#181818';
    tlCtx.fillRect(0, 0, w, h);

    tlCtx.strokeStyle = '#444';
    tlCtx.fillStyle = '#888';
    tlCtx.font = '10px monospace';

    const pxPerSec = (w - 40) / duration;

    for (let sec = 0; sec <= duration; sec += 0.5) {
      const x = 20 + sec * pxPerSec;
      tlCtx.beginPath();
      tlCtx.moveTo(x, 0);
      tlCtx.lineTo(x, sec % 1 === 0 ? 15 : 8);
      tlCtx.stroke();

      if (sec % 1 === 0) {
        tlCtx.fillText(sec + 's', x - 6, 26);
      }
    }

    tlCtx.strokeStyle = '#282828';
    tlCtx.beginPath();
    tlCtx.moveTo(0, 35);
    tlCtx.lineTo(w, 35);
    tlCtx.stroke();

    keyframes.forEach(kf => {
      const x = 20 + kf.time * pxPerSec;
      const y = 60;

      tlCtx.fillStyle = (selectedObject && kf.objUuid === selectedObject.uuid) ? '#007aff' : '#ff9500';
      tlCtx.beginPath();
      tlCtx.moveTo(x, y - 6);
      tlCtx.lineTo(x + 6, y);
      tlCtx.lineTo(x, y + 6);
      tlCtx.lineTo(x - 6, y);
      tlCtx.closePath();
      tlCtx.fill();
    });

    const playheadX = 20 + currentTime * pxPerSec;
    tlCtx.strokeStyle = '#ff3b30';
    tlCtx.lineWidth = 2;
    tlCtx.beginPath();
    tlCtx.moveTo(playheadX, 0);
    tlCtx.lineTo(playheadX, h);
    tlCtx.stroke();
    tlCtx.lineWidth = 1;

    timeDisplay.innerText = `${currentTime.toFixed(2)}s / ${duration.toFixed(2)}s`;
  }

  let isDraggingPlayhead = false;

  tlCanvas.addEventListener('pointerdown', (e) => {
    isDraggingPlayhead = true;
    updateTimeFromPointer(e);
  });

  window.addEventListener('pointermove', (e) => {
    if (isDraggingPlayhead) updateTimeFromPointer(e);
  });

  window.addEventListener('pointerup', () => { isDraggingPlayhead = false; });

  function updateTimeFromPointer(e) {
    const rect = tlCanvas.getBoundingClientRect();
    const x = e.clientX - rect.left - 20;
    const pxPerSec = (tlCanvas.width - 40) / duration;
    currentTime = Math.max(0, Math.min(duration, x / pxPerSec));
    evaluateAnimationAtTime(currentTime);
    drawTimeline();
  }

  document.getElementById('btn-add-key').onclick = () => {
    if (!selectedObject) {
      showToast('Select an object first!');
      return;
    }

    keyframes = keyframes.filter(k => !(k.objUuid === selectedObject.uuid && Math.abs(k.time - currentTime) < 0.05));

    keyframes.push({
      objUuid: selectedObject.uuid,
      time: currentTime,
      pos: selectedObject.position.toArray(),
      rot: selectedObject.quaternion.toArray(),
      scale: selectedObject.scale.toArray()
    });

    drawTimeline();
    saveState();
    showToast(`Keyframe added at ${currentTime.toFixed(2)}s`);
  };

  document.getElementById('btn-del-key').onclick = () => {
    if (!selectedObject) return;
    const initialCount = keyframes.length;
    keyframes = keyframes.filter(k => !(k.objUuid === selectedObject.uuid && Math.abs(k.time - currentTime) < 0.1));
    
    if (keyframes.length < initialCount) {
      showToast('Keyframe deleted');
      drawTimeline();
      saveState();
    }
  };

  function evaluateAnimationAtTime(t) {
    objectsList.forEach(obj => {
      const objKeys = keyframes.filter(k => k.objUuid === obj.uuid).sort((a, b) => a.time - b.time);
      if (objKeys.length === 0) return;

      if (t <= objKeys[0].time) {
        obj.position.fromArray(objKeys[0].pos);
        obj.quaternion.fromArray(objKeys[0].rot);
        obj.scale.fromArray(objKeys[0].scale);
      } else if (t >= objKeys[objKeys.length - 1].time) {
        const last = objKeys[objKeys.length - 1];
        obj.position.fromArray(last.pos);
        obj.quaternion.fromArray(last.rot);
        obj.scale.fromArray(last.scale);
      } else {
        let prevKey = objKeys[0];
        let nextKey = objKeys[1];

        for (let i = 0; i < objKeys.length - 1; i++) {
          if (t >= objKeys[i].time && t <= objKeys[i + 1].time) {
            prevKey = objKeys[i];
            nextKey = objKeys[i + 1];
            break;
          }
        }

        const alpha = (t - prevKey.time) / (nextKey.time - prevKey.time);

        const p1 = new THREE.Vector3().fromArray(prevKey.pos);
        const p2 = new THREE.Vector3().fromArray(nextKey.pos);
        obj.position.lerpVectors(p1, p2, alpha);

        const q1 = new THREE.Quaternion().fromArray(prevKey.rot);
        const q2 = new THREE.Quaternion().fromArray(nextKey.rot);
        obj.quaternion.slerpQuaternions(q1, q2, alpha);

        const s1 = new THREE.Vector3().fromArray(prevKey.scale);
        const s2 = new THREE.Vector3().fromArray(nextKey.scale);
        obj.scale.lerpVectors(s1, s2, alpha);
      }
    });
  }

  let lastClockTime = performance.now();

  document.getElementById('btn-play').onclick = () => { isPlaying = true; lastClockTime = performance.now(); };
  document.getElementById('btn-pause').onclick = () => { isPlaying = false; };
  document.getElementById('btn-stop').onclick = () => { isPlaying = false; currentTime = 0; evaluateAnimationAtTime(0); drawTimeline(); };
  document.getElementById('btn-loop').onclick = (e) => {
    isLooping = !isLooping;
    e.target.style.background = isLooping ? '#007aff' : '#3a3a3c';
  };

  function animate() {
    requestAnimationFrame(animate);

    if (isPlaying) {
      const now = performance.now();
      const delta = (now
