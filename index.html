<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Prisma 3D Editor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100vw; height: 100dvh; overflow: hidden; background: #0f0f11; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
    
    #app { display: flex; flex-direction: column; width: 100%; height: 100dvh; position: relative; }

    /* Top Bar */
    #top-bar { height: 44px; background: #18181a; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-bottom: 1px solid #28282e; flex-shrink: 0; overflow-x: auto; scrollbar-width: none; }
    #top-bar::-webkit-scrollbar { display: none; }
    
    .btn { background: #25252a; border: 1px solid #3d3d45; color: #eee; font-size: 11px; padding: 5px 10px; border-radius: 5px; cursor: pointer; flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px; }
    .btn:active { background: #007aff; color: #fff; }
    .btn-green { background: rgba(52, 199, 89, 0.2); color: #34c759; border-color: #34c759; }
    .btn-green.active { background: #34c759; color: #000; font-weight: bold; }
    .btn-yellow { background: rgba(255, 204, 0, 0.2); color: #ffcc00; border-color: #ffcc00; }
    .btn-red { background: rgba(255, 59, 48, 0.2); color: #ff3b30; border-color: #ff3b30; }

    /* Viewport */
    #viewport { flex: 1; position: relative; background: #121215; min-height: 0; overflow: hidden; }
    #canvas3d { width: 100%; height: 100%; display: block; touch-action: none; }
    
    #hierarchy { position: absolute; top: 8px; left: 8px; width: 120px; max-height: 120px; background: rgba(20, 20, 24, 0.9); border: 1px solid #33333d; border-radius: 6px; padding: 6px; font-size: 10px; overflow-y: auto; z-index: 10; }
    .tree-item { padding: 4px; border-radius: 3px; margin-top: 2px; background: rgba(255,255,255,0.05); cursor: pointer; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
    .tree-item.selected { background: #007aff; color: #fff; font-weight: bold; }

    /* Timeline Panel */
    #timeline-panel { height: 85px; background: #141417; border-top: 1px solid #28282e; display: flex; flex-direction: column; flex-shrink: 0; z-index: 50; }
    #tl-header { height: 24px; background: #1c1c20; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; font-size: 10px; color: #aaa; border-bottom: 1px solid #2a2a30; }
    #tl-play-btn { background: #007aff; border: none; color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 3px; cursor: pointer; font-weight: bold; }
    
    #tl-body { flex: 1; display: flex; overflow-x: auto; background: #101012; }
    #tl-track-labels { width: 75px; background: #161619; border-right: 1px solid #28282e; flex-shrink: 0; }
    .track-label { height: 24px; display: flex; align-items: center; padding: 0 6px; font-size: 9px; color: #888; border-bottom: 1px solid #222226; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
    .track-label.active { color: #fff; background: rgba(0, 122, 255, 0.3); font-weight: bold; }
    
    #tl-canvas-container { flex: 1; position: relative; height: 100%; min-width: 100%; }
    #tl-canvas { width: 100%; height: 100%; display: block; }

    /* Bottom Toolbar */
    #bottom-toolbar { height: 50px; background: #18181a; border-top: 1px solid #28282e; display: flex; align-items: center; gap: 6px; padding: 0 8px; flex-shrink: 0; z-index: 100; overflow-x: auto; scrollbar-width: none; }
    #bottom-toolbar::-webkit-scrollbar { display: none; }
    
    .tool-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; color: #aaa; font-size: 9px; cursor: pointer; flex-shrink: 0; width: 48px; height: 100%; }
    .tool-item span { font-size: 15px; }

    #toast { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); color: #fff; padding: 4px 12px; border-radius: 12px; font-size: 10px; display: none; z-index: 1000; border: 1px solid #444; pointer-events: none; }
    input[type="file"] { display: none !important; }
  </style>
</head>
<body>

<div id="app">
  <div id="top-bar">
    <button class="btn" onclick="resetCam()">🏠 Center</button>
    <button class="btn" onclick="setMode('translate')">✢ Move</button>
    <button class="btn" onclick="setMode('rotate')">🔄 Rotate</button>
    <button id="rig-btn" class="btn btn-green" onclick="toggleRig()">🦴 Rig</button>
    <button class="btn btn-yellow" onclick="addKeyframe()">🔑 Keyframe</button>
    <button class="btn btn-red" onclick="deleteObj()">🗑 Delete</button>
  </div>

  <div id="viewport">
    <canvas id="canvas3d"></canvas>
    <div id="hierarchy">
      <div style="font-weight: bold; border-bottom: 1px solid #444; padding-bottom:2px; color:#888;">Objects</div>
      <div id="tree-root"></div>
    </div>
    <div id="toast">Ready</div>
  </div>

  <div id="timeline-panel">
    <div id="tl-header">
      <button id="tl-play-btn" onclick="togglePlay()">▶ Play</button>
      <span id="time-val" style="font-family: monospace;">00:00.00 / 05:00</span>
      <span style="font-size: 9px; color: #666;">FPS: 30</span>
    </div>
    <div id="tl-body">
      <div id="tl-track-labels"></div>
      <div id="tl-canvas-container">
        <canvas id="tl-canvas"></canvas>
      </div>
    </div>
  </div>

  <div id="bottom-toolbar">
    <div class="tool-item" onclick="addCube()"><span>🧊</span>Cube</div>
    <div class="tool-item" onclick="addSphere()"><span>🔮</span>Sphere</div>
    <div class="tool-item" onclick="addLight()"><span>💡</span>Light</div>
    <div class="tool-item" onclick="triggerImport()"><span>📂</span>Import</div>
    <div class="tool-item" onclick="triggerImgUpload()"><span>🖼️</span>Texture</div>
    <div class="tool-item" onclick="toggleBg()"><span>🌐</span>BG Toggle</div>
  </div>
</div>

<input type="file" id="img-input" accept="image/*">
<input type="file" id="import-input" accept=".obj">

<script>
  const canvas = document.getElementById('canvas3d');
  const ctx = canvas.getContext('2d');
  
  let width = 0, height = 0;
  let objects = [];
  let selectedIdx = -1;
  let keyframes = [];
  let isPlaying = false, currentTime = 0, duration = 5.0;
  let currentMode = 'translate';
  let isRigActive = false;
  let bgDark = true;

  let cameraDistance = 4.5;
  let yaw = 0.4, pitch = 0.3;
  let targetX = 0, targetY = 0, targetZ = 0;
  let isDragging = false, lastX = 0, lastY = 0;

  function resize() {
    const vp = document.getElementById('viewport');
    width = canvas.width = vp.clientWidth;
    height = canvas.height = vp.clientHeight;
    drawScene();
    drawTimeline();
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 1800);
  }

  function project(x, y, z) {
    let cosY = Math.cos(yaw), sinY = Math.sin(yaw);
    let cosP = Math.cos(pitch), sinP = Math.sin(pitch);

    let dx = x - targetX, dy = y - targetY, dz = z - targetZ;
    let rx = cosY * dx - sinY * dz;
    let rz = sinY * dx + cosY * dz;
    let ry = cosP * dy - sinP * rz;
    let finalZ = sinP * dy + cosP * rz + cameraDistance;

    if (finalZ <= 0.1) finalZ = 0.1;
    let fov = Math.min(width, height) * 0.75;
    return {
      x: width / 2 + (rx * fov) / finalZ,
      y: height / 2 - (ry * fov) / finalZ
    };
  }

  function createCube() {
    return {
      type: 'Mesh',
      name: 'Cube ' + (objects.length + 1),
      x: 0, y: 0, z: 0, ry: 0,
      color: '#007aff',
      vertices: [
        [-0.5,-0.5,-0.5],[0.5,-0.5,-0.5],[0.5,0.5,-0.5],[-0.5,0.5,-0.5],
        [-0.5,-0.5,0.5],[0.5,-0.5,0.5],[0.5,0.5,0.5],[-0.5,0.5,0.5]
      ],
      faces: [[0,1,2,3],[5,4,7,6],[4,0,3,7],[1,5,6,2],[4,5,1,0],[3,2,6,7]]
    };
  }

  function addCube() {
    objects.push(createCube());
    selectedIdx = objects.length - 1;
    resetCam();
    updateUI();
  }

  function addSphere() {
    let s = createCube();
    s.name = 'Sphere ' + (objects.length + 1);
    s.color = '#ff9500';
    objects.push(s);
    selectedIdx = objects.length - 1;
    resetCam();
    updateUI();
  }

  function addLight() {
    objects.push({ type: 'Light', name: 'Light ' + (objects.length + 1), x: 0, y: 2, z: 0, color: '#ffcc00' });
    selectedIdx = objects.length - 1;
    updateUI();
  }

  function triggerImport() { document.getElementById('import-input').click(); }
  function triggerImgUpload() { document.getElementById('img-input').click(); }

  function resetCam() {
    cameraDistance = 4.5; yaw = 0.4; pitch = 0.3;
    if (selectedIdx >= 0 && objects[selectedIdx]) {
      targetX = objects[selectedIdx].x;
      targetY = objects[selectedIdx].y;
      targetZ = objects[selectedIdx].z;
    } else {
      targetX = 0; targetY = 0; targetZ = 0;
    }
    drawScene();
  }

  function setMode(mode) { currentMode = mode; showToast("Mode: " + mode.toUpperCase()); }

  function toggleRig() {
    isRigActive = !isRigActive;
    document.getElementById('rig-btn').classList.toggle('active', isRigActive);
    drawScene();
  }

  function toggleBg() { bgDark = !bgDark; drawScene(); }

  function deleteObj() {
    if (selectedIdx >= 0) {
      objects.splice(selectedIdx, 1);
      keyframes = keyframes.filter(k => k.objIdx !== selectedIdx);
      selectedIdx = objects.length - 1;
      updateUI();
    }
  }

  function drawGrid() {
    ctx.strokeStyle = bgDark ? '#262630' : '#d0d0d8';
    ctx.lineWidth = 1;
    for (let i = -4; i <= 4; i++) {
      let p1 = project(i, -0.8, -4), p2 = project(i, -0.8, 4);
      if (p1 && p2) { ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke(); }
      let p3 = project(-4, -0.8, i), p4 = project(4, -0.8, i);
      if (p3 && p4) { ctx.beginPath(); ctx.moveTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y); ctx.stroke(); }
    }
  }

  function renderObject(obj, idx) {
    let isSelected = (idx === selectedIdx);

    if (obj.type === 'Light') {
      let p = project(obj.x, obj.y, obj.z);
      if (p) {
        ctx.fillStyle = obj.color; ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI * 2); ctx.fill();
      }
      return;
    }

    let renderVertices = obj.vertices.map(v => {
      let cosY = Math.cos(obj.ry), sinY = Math.sin(obj.ry);
      let rx = cosY * v[0] + sinY * v[2];
      let rz = -sinY * v[0] + cosY * v[2];
      return project(rx + obj.x, v[1] + obj.y, rz + obj.z);
    });

    obj.faces.forEach((face, fIdx) => {
      let p0 = renderVertices[face[0]], p1 = renderVertices[face[1]], p2 = renderVertices[face[2]];
      if (p0 && p1 && p2) {
        ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
        if (face.length === 4 && renderVertices[face[3]]) ctx.lineTo(renderVertices[face[3]].x, renderVertices[face[3]].y);
        ctx.closePath();
        ctx.fillStyle = isSelected ? (fIdx % 2 === 0 ? '#007aff' : '#2b8aff') : obj.color;
        ctx.globalAlpha = 0.85; ctx.fill();
        ctx.strokeStyle = isSelected ? '#ffffff' : '#000000';
        ctx.lineWidth = isSelected ? 1.5 : 0.8;
        ctx.globalAlpha = 1.0; ctx.stroke();
      }
    });

    if (isRigActive && isSelected) {
      let j1 = project(obj.x, obj.y + 0.5, obj.z);
      let j2 = project(obj.x, obj.y - 0.5, obj.z);
      if (j1 && j2) {
        ctx.strokeStyle = '#34c759'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(j1.x, j1.y); ctx.lineTo(j2.x, j2.y); ctx.stroke();
        [j1, j2].forEach(j => { ctx.fillStyle = '#ffcc00'; ctx.beginPath(); ctx.arc(j.x, j.y, 4, 0, Math.PI*2); ctx.fill(); });
      }
    }
  }

  function drawScene() {
    if (!width || !height) resize();
    ctx.fillStyle = bgDark ? '#121215' : '#e8e8ed';
    ctx.fillRect(0, 0, width, height);
    drawGrid();
    objects.forEach((obj, idx) => renderObject(obj, idx));
  }

  canvas.addEventListener('pointerdown', (e) => { isDragging = true; lastX = e.clientX; lastY = e.clientY; });
  canvas.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    let dx = e.clientX - lastX, dy = e.clientY - lastY;
    if (selectedIdx >= 0 && currentMode === 'translate') {
      objects[selectedIdx].x += dx * 0.005;
      objects[selectedIdx].y -= dy * 0.005;
    } else {
      yaw += dx * 0.008; pitch += dy * 0.008;
      pitch = Math.max(-1.2, Math.min(1.2, pitch));
    }
    lastX = e.clientX; lastY = e.clientY;
    drawScene();
  });
  canvas.addEventListener('pointerup', () => isDragging = false);

  function updateUI() {
    const root = document.getElementById('tree-root');
    root.innerHTML = objects.length === 0 ? '<div style="color:#555;">No Objects</div>' : '';
    objects.forEach((o, i) => {
      let div = document.createElement('div');
      div.className = 'tree-item' + (i === selectedIdx ? ' selected' : '');
      div.innerText = (o.type === 'Light' ? '💡 ' : '📦 ') + o.name;
      div.onclick = () => { selectedIdx = i; resetCam(); updateUI(); };
      root.appendChild(div);
    });
    updateTimeline();
    drawScene();
  }

  function addKeyframe() {
    if (selectedIdx < 0) return showToast("Select object first!");
    let obj = objects[selectedIdx];
    keyframes = keyframes.filter(k => !(k.objIdx === selectedIdx && Math.abs(k.time - currentTime) < 0.1));
    keyframes.push({ objIdx: selectedIdx, time: currentTime, x: obj.x, y: obj.y });
    updateTimeline();
    showToast("Keyframe Added!");
  }

  function togglePlay() {
    isPlaying = !isPlaying;
    document.getElementById('tl-play-btn').innerText = isPlaying ? '⏸ Pause' : '▶ Play';
  }

  function updateTimeline() {
    const labels = document.getElementById('tl-track-labels');
    labels.innerHTML = '';
    objects.forEach((o, i) => {
      let d = document.createElement('div');
      d.className = 'track-label' + (i === selectedIdx ? ' active' : '');
      d.innerText = (i === selectedIdx ? '▶ ' : ' ') + o.name;
      d.onclick = () => { selectedIdx = i; resetCam(); updateUI(); };
      labels.appendChild(d);
    });
    drawTimeline();
  }

  function drawTimeline() {
    const tlCanvas = document.getElementById('tl-canvas');
    const container = document.getElementById('tl-canvas-container');
    if (!tlCanvas || !container) return;

    const tw = tlCanvas.width = container.clientWidth;
    const th = tlCanvas.height = container.clientHeight;
    const tctx = tlCanvas.getContext('2d');

    tctx.fillStyle = '#101012'; tctx.fillRect(0, 0, tw, th);

    objects.forEach((o, i) => {
      tctx.fillStyle = (i === selectedIdx) ? 'rgba(0,122,255,0.2)' : '#141417';
      tctx.fillRect(0, i * 24, tw, 24);
    });

    keyframes.forEach(k => {
      let x = (k.time / duration) * (tw - 20) + 10;
      let y = k.objIdx * 24 + 12;
      tctx.fillStyle = '#ffcc00'; tctx.beginPath(); tctx.arc(x, y, 3.5, 0, Math.PI*2); tctx.fill();
    });

    let px = (currentTime / duration) * (tw - 20) + 10;
    tctx.strokeStyle = '#ff3b30'; tctx.lineWidth = 2;
    tctx.beginPath(); tctx.moveTo(px, 0); tctx.lineTo(px, th); tctx.stroke();

    document.getElementById('time-val').innerText = '00:' + (currentTime < 10 ? '0' : '') + currentTime.toFixed(2) + ' / 05:00';
  }

  function loop() {
    if (isPlaying) {
      currentTime += 0.016;
      if (currentTime > duration) currentTime = 0;
      drawScene();
      drawTimeline();
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('DOMContentLoaded', () => {
    addCube();
    resize();
    loop();
  });
</script>
</body>
</html>
