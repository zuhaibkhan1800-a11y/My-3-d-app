<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Prisma 3D - Pre-Rigged GLB Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100vw; height: 100dvh; overflow: hidden; background: #1b1b20; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
    #app { display: flex; flex-direction: column; width: 100%; height: 100dvh; position: relative; }

    #top-bar { height: 44px; background: #222228; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid #33333d; z-index: 10; }
    .brand-title { font-size: 11px; font-weight: bold; color: #007aff; letter-spacing: 0.5px; }
    .icon-btn { background: none; border: none; color: #eee; font-size: 13px; cursor: pointer; padding: 6px; }

    #viewport { flex: 1; position: relative; background: #2d2d35; overflow: hidden; }
    #canvas3d { width: 100%; height: 100%; display: block; touch-action: none; }

    #bottom-bar { height: 54px; background: #222228; border-top: 1px solid #33333d; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; z-index: 20; }
    .dock-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #aaa; font-size: 10px; cursor: pointer; background: none; border: none; width: 25%; height: 100%; }
    .dock-btn.active, .dock-btn:active { color: #007aff; }
    .dock-btn span { font-size: 18px; }

    #toast { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 11px; display: none; z-index: 1000; border: 1px solid #444; pointer-events: none; }
    input[type="file"] { display: none !important; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
</head>
<body>

<div id="app">
  <div id="top-bar">
    <button class="icon-btn" onclick="resetCamera()">🏠 Center</button>
    <div class="brand-title">PRISMA 3D (RIGGED GLB ENGINE)</div>
    <button class="icon-btn" onclick="triggerImport()">📂 Import GLB</button>
  </div>

  <div id="viewport">
    <canvas id="canvas3d"></canvas>
    <div id="toast">Ready</div>
  </div>

  <div id="bottom-bar">
    <button class="dock-btn active" id="btn-rotate" onclick="setMode('rotate')"><span>🔄</span>Rotate Bone</button>
    <button class="dock-btn" id="btn-move" onclick="setMode('translate')"><span>✢</span>Move Bone</button>
    <button class="dock-btn" onclick="triggerImport()"><span>📂</span>Import GLB</button>
    <button class="dock-btn" onclick="deleteSelected()"><span>🗑</span>Clear</button>
  </div>
</div>

<input type="file" id="file-input" accept=".glb,.gltf">

<script>
  let scene, camera, renderer, orbitControls, transformControls;
  let loadedModel = null;
  let bonesList = [];
  let boneHelpers = [];

  function showToast(msg) {
    const t = document.getElementById('toast');
    if (!t) return;
    t.innerText = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 2500);
  }

  function initEngine() {
    const container = document.getElementById('viewport');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2d2d35);

    camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 1.2, 3.2);

    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));

    orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
    orbitControls.enableDamping = true;
    orbitControls.target.set(0, 1.0, 0);

    transformControls = new THREE.TransformControls(camera, renderer.domElement);
    transformControls.size = 1.0;
    transformControls.setMode('rotate');

    transformControls.addEventListener('dragging-changed', (e) => {
      orbitControls.enabled = !e.value;
    });

    scene.add(transformControls);

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const grid = new THREE.GridHelper(10, 20, 0x5a5a68, 0x3d3d48);
    grid.position.y = -0.01;
    scene.add(grid);

    renderer.domElement.addEventListener('pointerdown', onPointerDown);

    showToast("Import Pre-Rigged .GLB Model");
    animate();
  }

  function triggerImport() {
    document.getElementById('file-input').click();
  }

  document.getElementById('file-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    showToast("Loading Rigged Model...");
    const url = URL.createObjectURL(file);
    const loader = new THREE.GLTFLoader();

    loader.load(url, (gltf) => {
      if (loadedModel) scene.remove(loadedModel);
      clearBones();

      loadedModel = gltf.scene;

      // Find all embedded bones in the model
      loadedModel.traverse((child) => {
        if (child.isBone) {
          bonesList.push(child);
          createBoneHandle(child);
        }
        if (child.isMesh) {
          child.material.roughness = 0.5;
        }
      });

      // Auto Adjust Scale and Position
      const box = new THREE.Box3().setFromObject(loadedModel);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      loadedModel.position.sub(center);
      loadedModel.position.y += size.y / 2;

      const maxDim = Math.max(size.x, size.y, size.z);
      if (maxDim > 0) {
        const scale = 2.0 / maxDim;
        loadedModel.scale.set(scale, scale, scale);
      }

      scene.add(loadedModel);
      showToast(`Model Loaded! Found ${bonesList.length} Bones.`);
      URL.revokeObjectURL(url);
    }, undefined, (err) => {
      showToast("Error loading .GLB file!");
      console.error(err);
    });
  });

  function createBoneHandle(bone) {
    const geo = new THREE.SphereGeometry(0.03, 16, 16);
    const mat = new THREE.MeshBasicMaterial({ color: 0x007aff, depthTest: false, depthWrite: false });
    const handle = new THREE.Mesh(geo, mat);
    handle.renderOrder = 999;
    handle.userData = { targetBone: bone };
    bone.add(handle);
    boneHelpers.push(handle);
  }

  function onPointerDown(event) {
    if (transformControls.dragging) return;

    const rect = renderer.domElement.getBoundingClientRect();
    const mouse = new THREE.Vector2(
      ((event.clientX - rect.left) / rect.width) * 2 - 1,
      -((event.clientY - rect.top) / rect.height) * 2 + 1
    );

    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(mouse, camera);

    const intersects = raycaster.intersectObjects(boneHelpers, false);

    if (intersects.length > 0) {
      const selectedHandle = intersects[0].object;
      const targetBone = selectedHandle.userData.targetBone;
      transformControls.detach();
      transformControls.attach(targetBone);
    }
  }

  function clearBones() {
    transformControls.detach();
    boneHelpers = [];
    bonesList = [];
  }

  function setMode(mode) {
    transformControls.setMode(mode);
    document.getElementById('btn-rotate').classList.toggle('active', mode === 'rotate');
    document.getElementById('btn-move').classList.toggle('active', mode === 'translate');
    showToast(`Mode: ${mode.toUpperCase()}`);
  }

  function resetCamera() {
    camera.position.set(0, 1.2, 3.2);
    orbitControls.target.set(0, 1.0, 0);
  }

  function deleteSelected() {
    if (loadedModel) {
      scene.remove(loadedModel);
      loadedModel = null;
      clearBones();
      showToast("Model Cleared!");
    }
  }

  function animate() {
    requestAnimationFrame(animate);
    orbitControls.update();
    renderer.render(scene, camera);
  }

  window.addEventListener('load', initEngine);
</script>
</body>
</html>
